<!--
@title Testimonials
@description Three customer quotes in cards, each with the person's name, role, company and an initials avatar. No photos needed.
@tags testimonials, quotes, social proof, reviews, customers
@preview fill
@height 520
@added 2026-10-31
-->
<style>
  .c-testimonials {
    background: var(--ds-bg);
    font-family: var(--ds-font-sans);
    color: var(--ds-text);
  }
  .c-testimonials .wrap { max-width: 1200px; margin: 0 auto; padding: var(--ds-space-10) var(--ds-space-6); }
  .c-testimonials .head { display: grid; gap: var(--ds-space-3); max-width: 640px; margin: 0 auto var(--ds-space-9); text-align: center; }
  .c-testimonials .eyebrow { font-size: var(--ds-text-sm); font-weight: 700; color: var(--ds-muted); }
  .c-testimonials h2 {
    margin: 0;
    font-family: var(--ds-font-display);
    font-size: var(--ds-text-2xl);
    font-weight: var(--ds-weight-display);
    letter-spacing: var(--ds-tracking-display);
    line-height: var(--ds-leading-tight);
    color: var(--ds-ink);
    text-wrap: balance;
  }
  .c-testimonials .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ds-space-5); margin: 0; padding: 0; list-style: none; }
  .c-testimonials .grid > li { display: flex; }
  .c-testimonials .card {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: var(--ds-space-6);
    margin: 0;
    padding: var(--ds-space-7) var(--ds-space-6) var(--ds-space-6);
    border: var(--ds-hairline) solid var(--ds-line);
    border-radius: var(--ds-radius-xl);
    background: var(--ds-surface);
  }
  .c-testimonials .quote-mark { width: 28px; height: 28px; color: var(--ds-line); }
  .c-testimonials blockquote { flex: 1; margin: 0; font-size: var(--ds-text-md); line-height: var(--ds-leading-body); color: var(--ds-ink); text-wrap: pretty; }
  .c-testimonials blockquote b { font-weight: 700; }
  .c-testimonials figcaption { display: flex; align-items: center; gap: var(--ds-space-3); padding-top: var(--ds-space-5); border-top: var(--ds-hairline) solid var(--ds-line); }
  .c-testimonials .avatar {
    flex: none;
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: var(--ds-radius-pill);
    background: var(--ds-panel);
    color: var(--ds-ink);
    font-size: var(--ds-text-sm);
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .c-testimonials .who { display: grid; line-height: var(--ds-leading-snug); }
  .c-testimonials .name { font-size: var(--ds-text-sm); font-weight: 700; color: var(--ds-ink); }
  .c-testimonials .role { font-size: var(--ds-text-sm); color: var(--ds-muted); text-wrap: balance; }
  @media (max-width: 960px) {
    .c-testimonials .grid { grid-template-columns: 1fr; max-width: 560px; margin: 0 auto; }
  }
  @media (max-width: 600px) {
    .c-testimonials .wrap { padding: var(--ds-space-8) var(--ds-space-4); }
    .c-testimonials .head { margin-bottom: var(--ds-space-7); }
    .c-testimonials h2 { font-size: var(--ds-text-xl); }
    .c-testimonials .card { padding: var(--ds-space-6) var(--ds-space-5) var(--ds-space-5); }
  }
</style>

<section class="c-testimonials">
  <div class="wrap">
    <div class="head">
      <span class="eyebrow">Customers</span>
      <h2>Finance teams that got their evenings back</h2>
    </div>
    <ul class="grid">
      <li>
        <figure class="card">
          <svg class="quote-mark" viewBox="0 0 28 28" fill="currentColor" aria-hidden="true"><path d="M4 22v-8.2C4 8.6 7 5.2 12 4.5v3.6c-2.4.6-3.6 2.2-3.7 4.4H12V22zm13 0v-8.2c0-5.2 3-8.6 8-9.3v3.6c-2.4.6-3.6 2.2-3.7 4.4H25V22z"/></svg>
          <blockquote>Our month-end close used to take eleven working days. It now takes <b>four</b>, and the audit request list that once ate a week is a single export.</blockquote>
          <figcaption>
            <span class="avatar" aria-hidden="true">PA</span>
            <span class="who"><span class="name">Priya Anand</span><span class="role">Financial Controller, Brightwater Logistics</span></span>
          </figcaption>
        </figure>
      </li>
      <li>
        <figure class="card">
          <svg class="quote-mark" viewBox="0 0 28 28" fill="currentColor" aria-hidden="true"><path d="M4 22v-8.2C4 8.6 7 5.2 12 4.5v3.6c-2.4.6-3.6 2.2-3.7 4.4H12V22zm13 0v-8.2c0-5.2 3-8.6 8-9.3v3.6c-2.4.6-3.6 2.2-3.7 4.4H25V22z"/></svg>
          <blockquote>The matching is the part that sold me. We went from checking 2,000 lines by hand to reviewing <b>about 60 exceptions</b>, and the notes explain why each one moved.</blockquote>
          <figcaption>
            <span class="avatar" aria-hidden="true">TR</span>
            <span class="who"><span class="name">Tomas Reyes</span><span class="role">Head of Finance, Fernhill Dental Group</span></span>
          </figcaption>
        </figure>
      </li>
      <li>
        <figure class="card">
          <svg class="quote-mark" viewBox="0 0 28 28" fill="currentColor" aria-hidden="true"><path d="M4 22v-8.2C4 8.6 7 5.2 12 4.5v3.6c-2.4.6-3.6 2.2-3.7 4.4H12V22zm13 0v-8.2c0-5.2 3-8.6 8-9.3v3.6c-2.4.6-3.6 2.2-3.7 4.4H25V22z"/></svg>
          <blockquote>I am a team of one, and Stackwell feels like hiring a careful junior. Approvals chase themselves and I can finally <b>take a Friday off</b> at quarter end.</blockquote>
          <figcaption>
            <span class="avatar" aria-hidden="true">HV</span>
            <span class="who"><span class="name">Hannah Voss</span><span class="role">Finance Lead, Copperline Studios</span></span>
          </figcaption>
        </figure>
      </li>
    </ul>
  </div>
</section>
