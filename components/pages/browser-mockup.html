<style>
  .c-browser-mockup,
  .c-browser-mockup *,
  .c-browser-mockup *::before,
  .c-browser-mockup *::after { box-sizing: border-box; }
  .c-browser-mockup {
    width: min(900px, 100%);
    margin: 0;
    overflow: hidden;
    border: var(--ds-hairline) solid var(--ds-line);
    border-radius: var(--ds-radius-xl);
    background: var(--ds-raised);
    box-shadow: var(--ds-shadow-lg);
    font-family: var(--ds-font-sans);
    color: var(--ds-text);
  }
  .c-browser-mockup .tabs {
    display: flex;
    align-items: flex-end;
    gap: var(--ds-space-3);
    padding: var(--ds-space-3) var(--ds-space-4) 0;
    background: var(--ds-panel);
  }
  .c-browser-mockup .lights { display: flex; gap: 7px; align-self: center; padding-bottom: var(--ds-space-2); }
  .c-browser-mockup .lights i { width: 11px; height: 11px; border-radius: var(--ds-radius-pill); border: var(--ds-hairline) solid; }
  .c-browser-mockup .lights i:nth-child(1) { background: var(--ds-danger-fill); border-color: var(--ds-danger-line); }
  .c-browser-mockup .lights i:nth-child(2) { background: var(--ds-highlight-fill); border-color: var(--ds-highlight-line); }
  .c-browser-mockup .lights i:nth-child(3) { background: var(--ds-note-fill); border-color: var(--ds-note-line); }
  .c-browser-mockup .tab {
    display: flex;
    align-items: center;
    gap: var(--ds-space-2);
    min-width: 0;
    max-width: 220px;
    padding: var(--ds-space-2) var(--ds-space-4);
    border-radius: var(--ds-radius-md) var(--ds-radius-md) 0 0;
    background: var(--ds-surface);
    font-size: var(--ds-text-xs);
    font-weight: 600;
    color: var(--ds-ink);
  }
  .c-browser-mockup .tab .fav { flex: none; width: 12px; height: 12px; border-radius: 4px; background: var(--ds-series-1); }
  .c-browser-mockup .tab .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-browser-mockup .tab .x { flex: none; color: var(--ds-muted); font-weight: 400; }
  .c-browser-mockup .newtab { align-self: center; color: var(--ds-muted); font-size: var(--ds-text-md); padding-bottom: var(--ds-space-1); }
  .c-browser-mockup .bar {
    display: flex;
    align-items: center;
    gap: var(--ds-space-3);
    padding: var(--ds-space-2) var(--ds-space-4);
    border-bottom: var(--ds-hairline) solid var(--ds-line);
    background: var(--ds-surface);
  }
  .c-browser-mockup .nav { display: flex; gap: var(--ds-space-3); color: var(--ds-muted); flex: none; }
  .c-browser-mockup .nav svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .c-browser-mockup .url {
    display: flex;
    align-items: center;
    gap: var(--ds-space-2);
    flex: 1;
    min-width: 0;
    padding: 5px var(--ds-space-4);
    border-radius: var(--ds-radius-pill);
    background: var(--ds-panel);
    font-size: var(--ds-text-xs);
    color: var(--ds-text);
  }
  .c-browser-mockup .url svg { flex: none; width: 12px; height: 12px; fill: none; stroke: var(--ds-muted); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .c-browser-mockup .url span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-browser-mockup .me { flex: none; width: 22px; height: 22px; border-radius: var(--ds-radius-pill); background: var(--ds-highlight-fill); border: var(--ds-hairline) solid var(--ds-highlight-line); }

  .c-browser-mockup .app { display: grid; grid-template-columns: 148px minmax(0, 1fr); min-height: 380px; }
  .c-browser-mockup .side {
    display: grid;
    align-content: start;
    gap: var(--ds-space-1);
    padding: var(--ds-space-4) var(--ds-space-3);
    border-right: var(--ds-hairline) solid var(--ds-line);
    background: var(--ds-surface);
    font-size: var(--ds-text-xs);
    font-weight: 600;
    color: var(--ds-muted);
  }
  .c-browser-mockup .side .brand { display: flex; align-items: center; gap: var(--ds-space-2); margin-bottom: var(--ds-space-3); padding: 0 var(--ds-space-2); color: var(--ds-ink); font-size: var(--ds-text-sm); font-weight: 700; }
  .c-browser-mockup .side .brand i { width: 18px; height: 18px; border-radius: 5px; background: var(--ds-action); }
  .c-browser-mockup .side span { padding: var(--ds-space-2); border-radius: var(--ds-radius-sm); }
  .c-browser-mockup .side span.on { background: var(--ds-panel); color: var(--ds-ink); }
  .c-browser-mockup .main { display: grid; align-content: start; gap: var(--ds-space-4); padding: var(--ds-space-5); min-width: 0; }
  .c-browser-mockup .head { display: flex; align-items: center; justify-content: space-between; gap: var(--ds-space-3); }
  .c-browser-mockup .head b { font-size: var(--ds-text-lg); color: var(--ds-ink); white-space: nowrap; }
  .c-browser-mockup .head .chip { padding: 3px var(--ds-space-3); white-space: nowrap; border: var(--ds-hairline) solid var(--ds-line); border-radius: var(--ds-radius-pill); font-size: var(--ds-text-xs); font-weight: 600; color: var(--ds-text); }
  .c-browser-mockup .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--ds-space-3); }
  .c-browser-mockup .kpi { display: grid; gap: 2px; padding: var(--ds-space-3) var(--ds-space-4); border-radius: var(--ds-radius-md); background: var(--ds-panel); }
  .c-browser-mockup .kpi span { font-size: var(--ds-text-xs); font-weight: 600; color: var(--ds-muted); }
  .c-browser-mockup .kpi b { font-size: var(--ds-text-xl); line-height: 1.15; color: var(--ds-ink); font-variant-numeric: tabular-nums; }
  .c-browser-mockup .kpi em { font-style: normal; font-size: var(--ds-text-xs); font-weight: 700; color: var(--ds-text); }
  .c-browser-mockup .kpi em.up { color: var(--ds-text); }
  .c-browser-mockup .panes { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--ds-space-3); }
  .c-browser-mockup .card { display: grid; gap: var(--ds-space-3); padding: var(--ds-space-4); border: var(--ds-hairline) solid var(--ds-line); border-radius: var(--ds-radius-md); min-width: 0; }
  .c-browser-mockup .card h4 { margin: 0; font-size: var(--ds-text-xs); font-weight: 700; color: var(--ds-ink); }
  .c-browser-mockup .bars { display: flex; align-items: flex-end; gap: var(--ds-space-2); height: 104px; }
  .c-browser-mockup .bars i {
    flex: 1;
    border-radius: var(--ds-radius-sm) var(--ds-radius-sm) 0 0;
    background: var(--ds-series-1);
    transform-origin: bottom;
  }
  .c-browser-mockup .bars i.hi { background: var(--ds-series-2); }
  .c-browser-mockup .rows { display: grid; gap: var(--ds-space-2); }
  .c-browser-mockup .rows div { display: flex; align-items: center; justify-content: space-between; gap: var(--ds-space-3); font-size: var(--ds-text-xs); font-weight: 600; color: var(--ds-text); }
  .c-browser-mockup .rows div i { display: block; width: 52px; height: 6px; border-radius: var(--ds-radius-pill); background: var(--ds-panel); overflow: hidden; flex: none; }
  .c-browser-mockup .rows div i::after { content: ""; display: block; width: var(--w); height: 100%; background: var(--ds-series-3); }
  .c-browser-mockup .live { display: inline-flex; align-items: center; gap: 6px; font-size: var(--ds-text-xs); font-weight: 600; color: var(--ds-muted); }
  .c-browser-mockup .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ds-note-line); animation: c-browser-mockup-pulse 1800ms var(--ds-ease) infinite; }
  @keyframes c-browser-mockup-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* armed only by script, so nothing is hidden without it */
  .c-browser-mockup.is-armed .bars i { transform: scaleY(0); }
  .c-browser-mockup.is-armed.is-in .bars i {
    transform: scaleY(1);
    transition: transform var(--ds-dur-story) var(--ds-ease);
    transition-delay: calc(var(--n) * 70ms + var(--ds-dur-base));
  }
  .c-browser-mockup.is-armed .kpi,
  .c-browser-mockup.is-armed .card { opacity: 0; transform: translateY(8px); }
  .c-browser-mockup.is-armed.is-in .kpi,
  .c-browser-mockup.is-armed.is-in .card {
    opacity: 1;
    transform: none;
    transition: opacity var(--ds-dur-slow) var(--ds-ease), transform var(--ds-dur-slow) var(--ds-ease);
    transition-delay: calc(var(--n, 0) * 90ms);
  }

  @media (max-width: 640px) {
    .c-browser-mockup .app { grid-template-columns: 1fr; }
    .c-browser-mockup .side { display: none; }
    .c-browser-mockup .panes { grid-template-columns: 1fr; }
    .c-browser-mockup .newtab { display: none; }
    .c-browser-mockup .live { display: none; }
    .c-browser-mockup .main { padding: var(--ds-space-4); }
    .c-browser-mockup .kpi b { font-size: var(--ds-text-lg); }
    .c-browser-mockup .kpis { gap: var(--ds-space-2); }
    .c-browser-mockup .kpi { padding: var(--ds-space-3) var(--ds-space-2); }
    .c-browser-mockup .kpi em { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .c-browser-mockup .live i { animation: none; }
  }
</style>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.c-browser-mockup').forEach((root) => {
    if (reduced) return;
    root.classList.add('is-armed');
    const io = new IntersectionObserver((entries) => {
      if (!entries.some((e) => e.isIntersecting)) return;
      io.disconnect();
      requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-in')));
    }, { threshold: 0.35 });
    io.observe(root);
  });
})();
</script>
