<!--
@title Dot grid
@description A subtle dot or line grid that fades out toward the edges with a radial mask. Pure CSS: add the is-lines class for a line grid.
@tags background, grid, dots, pattern, blueprint, hero
@preview fill
@height 420
@added 2026-10-31
-->
<style>
  .c-dot-grid,
  .c-dot-grid *,
  .c-dot-grid *::before,
  .c-dot-grid *::after { box-sizing: border-box; }
  .c-dot-grid {
    /* tune the look here */
    --grid-gap: 26px;
    --grid-ink: color-mix(in srgb, var(--ds-ink) 42%, transparent);
    position: relative;
    isolation: isolate;
    display: grid;
    place-items: center;
    min-height: 420px;
    overflow: hidden;
    background: var(--ds-bg);
    font-family: var(--ds-font-sans);
    color: var(--ds-text);
  }
  .c-dot-grid .grid {
    position: absolute;
    inset: 0;
    z-index: -1;
    background-image: radial-gradient(circle, var(--grid-ink) 1.4px, transparent 1.9px);
    background-size: var(--grid-gap) var(--grid-gap);
    background-position: center;
    -webkit-mask-image: radial-gradient(ellipse 75% 80% at 50% 50%, black 0%, transparent 100%);
    mask-image: radial-gradient(ellipse 75% 80% at 50% 50%, black 0%, transparent 100%);
    animation: c-dot-grid-breathe calc(var(--ds-dur-story) * 5) var(--ds-ease-in-out) infinite alternate;
  }
  .c-dot-grid.is-lines .grid {
    background-image:
      linear-gradient(to right, var(--grid-ink) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-ink) 1px, transparent 1px);
  }
  .c-dot-grid .content {
    display: grid;
    justify-items: center;
    gap: var(--ds-space-4);
    max-width: 720px;
    padding: var(--ds-space-8) var(--ds-space-5);
    text-align: center;
  }
  .c-dot-grid .eyebrow {
    padding: var(--ds-space-1) var(--ds-space-3);
    border: var(--ds-hairline) solid var(--ds-line);
    border-radius: var(--ds-radius-pill);
    background: var(--ds-surface);
    font-size: var(--ds-text-xs);
    font-weight: 600;
  }
  .c-dot-grid h2 {
    margin: 0;
    font-family: var(--ds-font-display);
    font-size: clamp(32px, 6vw, var(--ds-text-3xl));
    font-weight: var(--ds-weight-display);
    letter-spacing: var(--ds-tracking-display);
    line-height: var(--ds-leading-tight);
    color: var(--ds-ink);
    text-wrap: balance;
  }
  .c-dot-grid .sub { margin: 0; max-width: 32em; font-size: var(--ds-text-lg); line-height: var(--ds-leading-snug); color: var(--ds-text); text-wrap: pretty; }
  @keyframes c-dot-grid-breathe {
    from { opacity: 0.6; }
    to { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .c-dot-grid .grid { animation: none; }
  }
</style>

<section class="c-dot-grid">
  <div class="grid" aria-hidden="true"></div>
  <div class="content">
    <span class="eyebrow">Developer preview</span>
    <h2>Structure you can feel but not see</h2>
    <p class="sub">A faint grid gives a blank page a sense of scale. It fades out before it reaches the edges, so the headline never fights it.</p>
  </div>
</section>
