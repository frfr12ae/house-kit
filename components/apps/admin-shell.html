<script>
(() => {
  // Replace with your own records. seen is minutes since last activity.
  const FIRST = ['Maja', 'Jonas', 'Ida', 'Lucas', 'Freja', 'Noah', 'Clara', 'Oscar', 'Alma', 'Emil', 'Sofie', 'Victor', 'Ella', 'William', 'Karla', 'Malthe', 'Nora', 'Elias', 'Liva', 'Anton', 'Agnes', 'Felix', 'Esther', 'August'];
  const LAST = ['Holm', 'Berg', 'Lund', 'Dahl', 'Krogh', 'Moller', 'Vang', 'Friis', 'Bak', 'Juhl', 'Skov', 'Thorsen'];
  const ROLES = ['Owner', 'Admin', 'Editor', 'Editor', 'Viewer', 'Viewer', 'Editor', 'Admin'];
  const STATUSES = ['Active', 'Active', 'Active', 'Invited', 'Active', 'Suspended', 'Active', 'Invited'];
  const USERS = FIRST.map((f, i) => {
    const l = LAST[(i * 5) % LAST.length];
    return { id: i + 1, name: f + ' ' + l, email: (f + '.' + l).toLowerCase() + '@northwind.example', role: i ? ROLES[i % ROLES.length] : 'Owner', status: i ? STATUSES[(i * 3) % STATUSES.length] : 'Active', seen: (i * 37 + 3) % 4320 + i * 11 };
  });

  const I = {
    home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
    check: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
    grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/>',
    panel: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
    download: '<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    dots: '<circle cx="5.5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18.5" cy="12" r="1"/>',
    left: '<path d="M14.5 6l-6 6 6 6"/>',
    right: '<path d="M9.5 6l6 6-6 6"/>',
    updown: '<path d="M8 9l4-4 4 4M8 15l4 4 4-4"/>',
  };
  const svg = (n) => '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + I[n] + '</svg>';
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ago = (m) => (m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago');
  const initials = (n) => n.split(' ').map((p) => p[0]).join('');

  document.querySelectorAll('.c-admin-shell').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    root.querySelectorAll('[data-i]').forEach((el) => { el.outerHTML = svg(el.dataset.i); });

    const users = USERS.map((u) => ({ ...u }));
    const S = { q: '', status: '', role: '', key: 'name', dir: 1, page: 0, size: 8, sel: new Set(), menu: null };
    const $ = (s) => root.querySelector(s);
    const tbody = $('tbody');
    const live = $('.status[role="status"]');
    const say = (t) => { live.textContent = t; };

    function rows() {
      const q = S.q.toLowerCase();
      return users
        .filter((u) => (!q || (u.name + ' ' + u.email).toLowerCase().includes(q)) && (!S.status || u.status === S.status) && (!S.role || u.role === S.role))
        .sort((a, b) => (a[S.key] > b[S.key] ? 1 : a[S.key] < b[S.key] ? -1 : 0) * S.dir);
    }

    function render() {
      const all = rows();
      const pages = Math.max(1, Math.ceil(all.length / S.size));
      S.page = Math.min(S.page, pages - 1);
      const view = all.slice(S.page * S.size, (S.page + 1) * S.size);
      tbody.innerHTML = view.length ? view.map((u) => {
        const on = S.sel.has(u.id);
        return '<tr class="' + (on ? 'is-sel' : '') + '" data-id="' + u.id + '">' +
          '<td class="col-check"><input type="checkbox" data-act="row"' + (on ? ' checked' : '') + ' aria-label="Select ' + esc(u.name) + '"></td>' +
          '<td><div class="who"><span class="av" aria-hidden="true">' + initials(u.name) + '</span><div><b>' + esc(u.name) + '</b><small>' + esc(u.email) + '</small></div></div></td>' +
          '<td><span class="tag ' + u.status.toLowerCase() + '">' + u.status + '</span></td>' +
          '<td>' + u.role + '</td>' +
          '<td class="muted">' + ago(u.seen) + '</td>' +
          '<td class="row-menu"><button class="icon-btn" type="button" data-act="menu" aria-haspopup="menu" aria-expanded="' + (S.menu === u.id) + '" aria-label="Actions for ' + esc(u.name) + '">' + svg('dots') + '</button>' +
          (S.menu === u.id ? '<ul class="menu" role="menu"><li><button role="menuitem" type="button" data-act="edit">Edit</button></li><li><button role="menuitem" type="button" data-act="resend">Resend invite</button></li><li><button role="menuitem" type="button" class="danger" data-act="suspend">' + (u.status === 'Suspended' ? 'Reactivate' : 'Suspend') + '</button></li></ul>' : '') +
          '</td></tr>';
      }).join('') : '<tr><td colspan="6" class="empty">No users match these filters.</td></tr>';

      const allBox = $('[data-act="all"]');
      const onPage = view.filter((u) => S.sel.has(u.id)).length;
      allBox.checked = view.length > 0 && onPage === view.length;
      allBox.indeterminate = onPage > 0 && onPage < view.length;
      root.querySelectorAll('th[data-k]').forEach((th) => th.setAttribute('aria-sort', th.dataset.k === S.key ? (S.dir > 0 ? 'ascending' : 'descending') : 'none'));
      $('[data-out="sel"]').textContent = S.sel.size + ' of ' + all.length + ' selected';
      $('[data-out="page"]').textContent = 'Page ' + (S.page + 1) + ' of ' + pages;
      $('[data-act="prev"]').disabled = S.page === 0;
      $('[data-act="next"]').disabled = S.page >= pages - 1;
      $('.bulk').hidden = S.sel.size === 0;
      $('.bulk b').textContent = S.sel.size + ' selected';
      $('[data-act="reset"]').hidden = !(S.q || S.status || S.role);
      if (S.menu !== null) { const first = tbody.querySelector('.menu button'); if (first) first.focus(); }
    }

    root.querySelectorAll('[data-f]').forEach((el) => el.addEventListener('input', () => {
      const k = el.dataset.f;
      S[k] = k === 'size' ? Number(el.value) : el.value;
      S.page = 0;
      render();
    }));

    root.querySelectorAll('th[data-k] button').forEach((b) => b.addEventListener('click', () => {
      const k = b.parentElement.dataset.k;
      S.dir = S.key === k ? -S.dir : 1;
      S.key = k;
      render();
    }));

    root.addEventListener('click', (e) => {
      const t = e.target.closest('[data-act]');
      if (!t || !root.contains(t)) { if (S.menu !== null && !e.target.closest('.menu')) { S.menu = null; render(); } return; }
      const id = Number(t.closest('tr') && t.closest('tr').dataset.id);
      const u = users.find((x) => x.id === id);
      const act = t.dataset.act;
      if (act === 'toggle') {
        const narrow = root.offsetWidth <= 760;
        root.classList.toggle(narrow ? 'is-open' : 'is-collapsed');
        t.setAttribute('aria-expanded', String(narrow ? root.classList.contains('is-open') : !root.classList.contains('is-collapsed')));
        return;
      }
      if (act === 'row') { t.checked ? S.sel.add(id) : S.sel.delete(id); }
      else if (act === 'all') {
        const view = rows().slice(S.page * S.size, (S.page + 1) * S.size);
        view.forEach((x) => (t.checked ? S.sel.add(x.id) : S.sel.delete(x.id)));
      }
      else if (act === 'prev') S.page -= 1;
      else if (act === 'next') S.page += 1;
      else if (act === 'reset') { S.q = S.status = S.role = ''; root.querySelectorAll('.tools [data-f]').forEach((el) => { el.value = ''; }); }
      else if (act === 'menu') S.menu = S.menu === id ? null : id;
      else if (act === 'suspend') { u.status = u.status === 'Suspended' ? 'Active' : 'Suspended'; S.menu = null; say(u.name + ' is now ' + u.status.toLowerCase()); }
      else if (act === 'edit' || act === 'resend') { S.menu = null; say(act === 'edit' ? 'Editing ' + u.name : 'Invite sent again to ' + u.email); }
      else if (act === 'bulk-suspend') { users.forEach((x) => { if (S.sel.has(x.id)) x.status = 'Suspended'; }); say(S.sel.size + ' users suspended'); S.sel.clear(); }
      else if (act === 'bulk-role') { users.forEach((x) => { if (S.sel.has(x.id) && x.role !== 'Owner') x.role = 'Viewer'; }); say('Role set to Viewer for ' + S.sel.size + ' users'); S.sel.clear(); }
      else return;
      render();
    });

    $('.scrim').addEventListener('click', () => { root.classList.remove('is-open'); });
    root.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && S.menu !== null) { const id = S.menu; S.menu = null; render(); const b = tbody.querySelector('tr[data-id="' + id + '"] [data-act="menu"]'); if (b) b.focus(); }
      if (e.key === 'Escape') root.classList.remove('is-open');
    });

    render();
  });
})();
</script>
