<!--
@title Pull quote
@description A large quote with attribution and role, for lifting one voice out of a report. The quote is the only display element.
@tags quote, testimonial, interview, callout, attribution
@preview fill
@height 380
@added 2026-10-31
-->
<style>
  .c-pull-quote {
    padding: var(--ds-space-8) var(--ds-space-7);
    background: var(--ds-surface);
    border-radius: var(--ds-radius-xl);
    font-family: var(--ds-font-sans);
    color: var(--ds-text);
  }
  .c-pull-quote .quote {
    position: relative;
    margin: 0 auto;
    max-width: 760px;
    padding-left: var(--ds-space-7);
    border-left: 3px solid var(--ds-neutral-line);
  }
  .c-pull-quote .mark { display: block; width: 36px; height: 28px; margin-bottom: var(--ds-space-4); color: var(--ds-muted); }
  .c-pull-quote blockquote { margin: 0; }
  .c-pull-quote .text {
    margin: 0;
    font-family: var(--ds-font-display);
    font-size: clamp(22px, 3.2vw, 34px);
    font-weight: 600;
    letter-spacing: var(--ds-tracking-display);
    line-height: 1.28;
    color: var(--ds-ink);
    text-wrap: pretty;
  }
  .c-pull-quote figcaption { display: grid; gap: 2px; margin-top: var(--ds-space-5); font-size: var(--ds-text-sm); }
  .c-pull-quote .who { font-weight: 700; color: var(--ds-ink); }
  .c-pull-quote .role { color: var(--ds-muted); }
  @media (max-width: 560px) {
    .c-pull-quote { padding: var(--ds-space-6) var(--ds-space-4); }
    .c-pull-quote .quote { padding-left: var(--ds-space-5); }
  }
</style>

<figure class="c-pull-quote">
  <div class="quote">
    <svg class="mark" viewBox="0 0 36 28" fill="currentColor" aria-hidden="true"><path d="M0 28V16.4C0 6.6 5 1.2 14.2 0l1.4 4.6C10.8 6 8.6 8.8 8.4 12.4H15V28H0Zm21 0V16.4C21 6.6 26 1.2 35.2 0l.8 4.6C31.8 6 29.6 8.8 29.4 12.4H36V28H21Z"/></svg>
    <blockquote>
      <p class="text">We stopped arguing about whose numbers were right and started arguing about what to do with them. That alone saved us two meetings a week.</p>
    </blockquote>
    <figcaption>
      <span class="who">Operations Director</span>
      <span class="role">Regional logistics client, interviewed 14 October 2026</span>
    </figcaption>
  </div>
</figure>
