<!--
@title Annotated price chart
@description A single-claim line chart in SVG: the claim as the title, a price pane with the last price tagged on the right edge, muted volume bars, one horizontal reference line, rings on the earlier touches of that level, a ring on today, a short caption and a source footer. Fictional data for a fictional ticker; edit KEYS, LEVEL and TOUCHES at the top of the script.
@tags chart, price, stock, annotated, line, volume, support, svg, finance
@preview fill
@height 640
@added 2026-10-31
-->
<style>
  .c-annotated-price-chart {
    margin: 0;
    padding: var(--ds-space-7) var(--ds-space-6) var(--ds-space-5);
    background: var(--ds-surface);
    border-radius: var(--ds-radius-xl);
    font-family: var(--ds-font-sans);
    color: var(--ds-text);
  }
  .c-annotated-price-chart .band { margin: 0 0 var(--ds-space-5); max-width: 40ch; }
  .c-annotated-price-chart .eyebrow { margin: 0 0 var(--ds-space-2); font-size: var(--ds-text-xs); font-weight: 600; color: var(--ds-muted); }
  .c-annotated-price-chart h3 {
    margin: 0;
    font-family: var(--ds-font-display);
    font-size: var(--ds-text-xl);
    font-weight: var(--ds-weight-display);
    letter-spacing: var(--ds-tracking-display);
    line-height: var(--ds-leading-tight);
    color: var(--ds-ink);
    text-wrap: balance;
  }
  .c-annotated-price-chart .plot { width: 100%; }
  .c-annotated-price-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .c-annotated-price-chart text { font-family: var(--ds-font-sans); font-size: 12px; fill: var(--ds-muted); font-variant-numeric: tabular-nums; }
  .c-annotated-price-chart .base { stroke: var(--ds-line); stroke-width: 1; }
  .c-annotated-price-chart .vol { fill: color-mix(in srgb, var(--ds-neutral-line) 38%, transparent); }
  .c-annotated-price-chart .px { fill: none; stroke: var(--ds-ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .c-annotated-price-chart .ref { stroke: var(--ds-highlight-line); stroke-width: 1.75; stroke-dasharray: 6 5; }
  .c-annotated-price-chart .ref-label { fill: var(--ds-ink); font-weight: 700; font-size: 12px; }
  .c-annotated-price-chart .ring { fill: none; stroke: var(--ds-muted); stroke-width: 1.75; }
  .c-annotated-price-chart .now { fill: color-mix(in srgb, var(--ds-note-line) 24%, transparent); stroke: var(--ds-note-line); stroke-width: 1.75; }
  .c-annotated-price-chart .now.is-down { fill: color-mix(in srgb, var(--ds-danger-line) 24%, transparent); stroke: var(--ds-danger-line); }
  .c-annotated-price-chart .note-text { font-weight: 600; }
  .c-annotated-price-chart .note-text.is-now { fill: var(--ds-ink); font-weight: 700; }
  .c-annotated-price-chart .tag-box { fill: var(--ds-note-fill); stroke: var(--ds-note-line); stroke-width: 1.5; }
  .c-annotated-price-chart .tag-box.is-down { fill: var(--ds-danger-fill); stroke: var(--ds-danger-line); }
  .c-annotated-price-chart .tag-text { fill: var(--ds-ink); font-weight: 700; text-anchor: middle; }
  .c-annotated-price-chart .caption { margin: var(--ds-space-4) 0 0; font-size: var(--ds-text-md); font-weight: 600; color: var(--ds-ink); }
  .c-annotated-price-chart .foot { display: grid; gap: var(--ds-space-1); margin: var(--ds-space-5) 0 0; padding-top: var(--ds-space-4); border-top: var(--ds-hairline) solid var(--ds-line); text-align: center; }
  .c-annotated-price-chart .meta { margin: 0; font-size: var(--ds-text-xs); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ds-text); }
  .c-annotated-price-chart .source { margin: 0; font-size: var(--ds-text-xs); color: var(--ds-muted); }
  @media (max-width: 560px) {
    .c-annotated-price-chart { padding: var(--ds-space-6) var(--ds-space-4) var(--ds-space-5); }
  }
</style>

<figure class="c-annotated-price-chart">
  <div class="band">
    <p class="eyebrow">ORVX · Orvex Systems · daily close</p>
    <h3>ORVX is back at the line that held twice before</h3>
  </div>
  <div class="plot" role="img" aria-label="Line chart of the ORVX daily close over 130 sessions. The price has fallen back to 84.50, close to the 84.20 support level that held on two earlier tests."></div>
  <p class="caption">Third test of old resistance as support.</p>
  <figcaption class="foot">
    <p class="meta">Ticker: ORVX · Timeframe: Daily</p>
    <p class="source">Source: illustrative fictional data. Not a real security and not advice.</p>
  </figcaption>
</figure>

<script>
(() => {
  // Fictional, deterministic data. KEYS are [session index, price] anchors; the path between them is smoothed and
  // given repeatable texture. Replace DATA generation with your own closes and volumes to reuse the chart.
  const N = 130;
  const KEYS = [[0, 72.0], [22, 84.2], [40, 95.6], [55, 84.3], [78, 98.4], [100, 84.2], [114, 93.2], [128, 84.1], [129, 84.5]];
  const TOUCHES = [55, 100];
  const LEVEL = 84.2;
  const TICKER_START = Date.UTC(2026, 4, 4);
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const hash = (n) => { const v = Math.sin(n * 12.9898) * 43758.5453; return v - Math.floor(v) - 0.5; };
  const price = [];
  for (let s = 0; s < KEYS.length - 1; s++) {
    const [i0, p0] = KEYS[s];
    const [i1, p1] = KEYS[s + 1];
    for (let i = i0; i < i1; i++) {
      const f = (i - i0) / (i1 - i0);
      const ease = (1 - Math.cos(Math.PI * f)) / 2;
      const wob = Math.sin(Math.PI * f) * (hash(i) * 2.6 + hash(i * 3 + 1) * 1.6);
      price.push(p0 + (p1 - p0) * ease + wob + hash(i * 5 + 4) * 0.5);
    }
  }
  price.push(KEYS[KEYS.length - 1][1]);
  const vol = price.map((p, i) => {
    const near = TOUCHES.concat([22, 129]).reduce((m, t) => Math.max(m, Math.max(0, 1 - Math.abs(i - t) / 5)), 0);
    return 1.4 + (hash(i * 7 + 2) + 0.5) * 1.3 + near * 1.6;
  });
  const dates = [];
  for (let d = TICKER_START; dates.length < N; d += 86400000) {
    const dow = new Date(d).getUTCDay();
    if (dow !== 0 && dow !== 6) dates.push(new Date(d));
  }

  const fmt = (v) => v.toFixed(2);
  const last = price[N - 1];
  const up = last >= price[N - 2];

  document.querySelectorAll('.c-annotated-price-chart').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    const plot = root.querySelector('.plot');
    const NS = 'http://www.w3.org/2000/svg';

    function render() {
      const W = Math.max(280, Math.round(plot.clientWidth));
      const H = Math.round(Math.min(420, Math.max(290, W * 0.5)));
      const m = { l: 6, r: 58, t: 14, b: 30 };
      const paneB = H - m.b;
      const plotR = W - m.r;
      const dataR = m.l + (plotR - m.l) * 0.84;
      const step = (dataR - m.l) / (N - 1);
      const x = (i) => m.l + step * i;
      const pLo0 = Math.min(...price);
      const pHi0 = Math.max(...price);
      const hi = pHi0 + (pHi0 - pLo0) * 0.05;
      const lo = pLo0 - (pHi0 - pLo0) * 0.32;
      const y = (v) => m.t + (paneB - m.t) * (1 - (v - lo) / (hi - lo));
      const vMax = Math.max(...vol);
      const vy = (v) => ((v / vMax) * (paneB - m.t) * 0.2);

      let out = '<line class="base" x1="' + m.l + '" x2="' + plotR + '" y1="' + paneB + '" y2="' + paneB + '"/>';
      vol.forEach((v, i) => {
        const h = vy(v);
        out += '<rect class="vol" x="' + (x(i) - Math.max(0.8, step * 0.36)).toFixed(1) + '" y="' + (paneB - h).toFixed(1) + '" width="' + Math.max(1.6, step * 0.72).toFixed(1) + '" height="' + h.toFixed(1) + '"/>';
      });

      // Month labels at the first session of each month.
      let lastX = -99;
      dates.forEach((d, i) => {
        if ((i === 0 || d.getUTCMonth() !== dates[i - 1].getUTCMonth()) && x(i) - lastX >= 42) {
          lastX = x(i);
          out += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? 'start' : 'middle') + '">' + MONTHS[d.getUTCMonth()] + '</text>';
        }
      });

      // Right-hand price axis, no gridlines. Skip ticks that would sit under the last-price tag.
      const rough = (pHi0 - pLo0) / 6;
      const mag = Math.pow(10, Math.floor(Math.log10(rough)));
      const tickStep = [1, 2, 5, 10].map((k) => k * mag).find((s) => s >= rough);
      for (let t = Math.ceil(lo / tickStep) * tickStep; t <= hi; t += tickStep) {
        const ty = y(t);
        if (Math.abs(ty - y(last)) < 16 || ty > paneB - (paneB - m.t) * 0.24) continue;
        out += '<text x="' + (plotR + 8) + '" y="' + ty.toFixed(1) + '" dominant-baseline="central">' + Math.round(t) + '</text>';
      }

      // Reference line, drawn to the axis, with a label placed where it clears the price path.
      const ly = y(LEVEL);
      out += '<line class="ref" x1="' + m.l + '" x2="' + plotR + '" y1="' + ly.toFixed(1) + '" y2="' + ly.toFixed(1) + '"/>';
      const pts = price.map((p, i) => [x(i), y(p)]);
      const marks = TOUCHES.concat([N - 1]).map((t) => ({ l: x(t) - 16, r: x(t) + 16, t: y(price[t]) - 16, b: y(price[t]) + 38 }));
      const label = ['Support ' + fmt(LEVEL), fmt(LEVEL)].map((txt) => ({ txt, w: txt.length * 6.9 + 4 })).find((c) => {
        for (let sx = m.l + 4; sx + c.w < plotR - 4; sx += 6) {
          for (const sy of [ly - 20, ly + 6]) {
            const clear = !pts.some(([px, py]) => px > sx - 4 && px < sx + c.w + 4 && py > sy - 4 && py < sy + 18) &&
              !marks.some((k) => sx < k.r && sx + c.w > k.l && sy < k.b && sy + 14 > k.t);
            if (clear) { c.x = sx; c.y = sy; return true; }
          }
        }
        return false;
      });
      if (label) out += '<text class="ref-label" x="' + label.x + '" y="' + (label.y + 12) + '">' + label.txt + '</text>';

      out += '<path class="px" d="' + pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('') + '"/>';

      // Earlier touches of the level.
      TOUCHES.forEach((t) => {
        out += '<circle class="ring" cx="' + x(t).toFixed(1) + '" cy="' + y(price[t]).toFixed(1) + '" r="11"/>';
        out += '<text class="note-text" x="' + x(t).toFixed(1) + '" y="' + (y(price[t]) + 28).toFixed(1) + '" text-anchor="middle">Held</text>';
      });
      // Today.
      out += '<circle class="now' + (up ? '' : ' is-down') + '" cx="' + x(N - 1).toFixed(1) + '" cy="' + y(last).toFixed(1) + '" r="13"/>';
      out += '<text class="note-text is-now" x="' + x(N - 1).toFixed(1) + '" y="' + (y(last) + 31).toFixed(1) + '" text-anchor="middle">Today</text>';

      // Last-price tag on the right edge.
      const ty = y(last);
      out += '<rect class="tag-box' + (up ? '' : ' is-down') + '" x="' + (plotR + 2) + '" y="' + (ty - 11).toFixed(1) + '" width="' + (m.r - 4) + '" height="22" rx="4"/>';
      out += '<text class="tag-text" x="' + (plotR + 2 + (m.r - 4) / 2) + '" y="' + ty.toFixed(1) + '" dominant-baseline="central">' + fmt(last) + '</text>';

      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svg.setAttribute('aria-hidden', 'true');
      svg.innerHTML = out;
      plot.querySelectorAll('svg').forEach((n) => n.remove());
      plot.appendChild(svg);
    }

    render();
    new ResizeObserver(render).observe(plot);
  });
})();
</script>
