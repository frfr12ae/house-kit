<!--
@title Dependency matrix
@description Initiatives down the side, shared enablers across the top, a filled dot where an initiative depends on an enabler, column totals underneath and the highest-leverage enabler highlighted. The table scrolls sideways on narrow screens with the initiative names pinned. Edit ENABLERS and INITIATIVES at the top of the script.
@tags matrix, dependencies, enablers, table, leverage, roadmap, grid
@preview fill
@height 560
@added 2026-10-31
-->
<style>
  .c-dependency-matrix {
    margin: 0;
    padding: var(--ds-space-7) var(--ds-space-6);
    background: var(--ds-surface);
    border-radius: var(--ds-radius-xl);
    font-family: var(--ds-font-sans);
    color: var(--ds-text);
    container-type: inline-size;
  }
  .c-dependency-matrix .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .c-dependency-matrix .head { margin: 0 0 var(--ds-space-6); max-width: 62ch; }
  .c-dependency-matrix h3 { margin: 0; font-size: var(--ds-text-lg); color: var(--ds-ink); line-height: var(--ds-leading-snug); }
  .c-dependency-matrix .hint { margin: var(--ds-space-1) 0 0; font-size: var(--ds-text-sm); color: var(--ds-muted); }
  .c-dependency-matrix .scroll {
    overflow-x: auto;
    background: var(--ds-raised);
    border: var(--ds-hairline) solid var(--ds-line);
    border-radius: var(--ds-radius-lg);
    scrollbar-width: thin;
    scrollbar-color: var(--ds-line) transparent;
  }
  .c-dependency-matrix .scroll:focus-visible { outline: none; box-shadow: var(--ds-focus); }
  .c-dependency-matrix table { width: 100%; min-width: 760px; border-collapse: separate; border-spacing: 0; font-size: var(--ds-text-sm); }
  .c-dependency-matrix th,
  .c-dependency-matrix td { padding: var(--ds-space-3) var(--ds-space-3); text-align: center; border-bottom: var(--ds-hairline) solid var(--ds-line); }
  .c-dependency-matrix thead th { vertical-align: bottom; padding-top: var(--ds-space-5); padding-bottom: var(--ds-space-4); font-size: var(--ds-text-xs); font-weight: 600; line-height: var(--ds-leading-snug); color: var(--ds-muted); background: var(--ds-panel); width: 96px; }
  .c-dependency-matrix thead th .tagline { display: block; margin: 0 auto var(--ds-space-2); width: fit-content; padding: 1px 7px; border: var(--ds-hairline) solid var(--ds-highlight-line); border-radius: var(--ds-radius-pill); background: var(--ds-raised); font-size: 11px; font-weight: 700; color: var(--ds-ink); white-space: nowrap; }
  .c-dependency-matrix .corner,
  .c-dependency-matrix tbody th { position: sticky; left: 0; z-index: 1; text-align: left; border-right: var(--ds-hairline) solid var(--ds-line); }
  .c-dependency-matrix thead .corner { width: 220px; min-width: 190px; background: var(--ds-panel); }
  .c-dependency-matrix tbody th { padding-left: var(--ds-space-5); font-size: var(--ds-text-sm); font-weight: 600; color: var(--ds-ink); background: var(--ds-raised); }
  .c-dependency-matrix .needs { width: 80px; font-size: var(--ds-text-xs); color: var(--ds-muted); font-variant-numeric: tabular-nums; border-left: var(--ds-hairline) solid var(--ds-line); }
  .c-dependency-matrix tbody .needs { font-size: var(--ds-text-sm); font-weight: 600; color: var(--ds-text); }
  .c-dependency-matrix tbody tr:hover td,
  .c-dependency-matrix tbody tr:hover th { background-image: linear-gradient(color-mix(in srgb, var(--ds-panel) 70%, transparent), color-mix(in srgb, var(--ds-panel) 70%, transparent)); }
  .c-dependency-matrix .dot { display: block; width: 14px; height: 14px; margin: 0 auto; border-radius: 50%; background: var(--ds-info-line); }
  .c-dependency-matrix .is-top { background: color-mix(in srgb, var(--ds-highlight-fill) 80%, transparent); }
  .c-dependency-matrix thead .is-top { background: var(--ds-highlight-fill); color: var(--ds-ink); }
  .c-dependency-matrix .is-top .dot { background: var(--ds-highlight-line); }
  .c-dependency-matrix tfoot th,
  .c-dependency-matrix tfoot td { border-bottom: 0; padding-top: var(--ds-space-4); padding-bottom: var(--ds-space-4); background: var(--ds-panel); }
  .c-dependency-matrix tfoot th { padding-left: var(--ds-space-5); font-size: var(--ds-text-xs); font-weight: 600; color: var(--ds-muted); }
  .c-dependency-matrix tfoot td { font-size: var(--ds-text-lg); font-weight: 700; color: var(--ds-ink); font-variant-numeric: tabular-nums; }
  .c-dependency-matrix tfoot .is-top { background: var(--ds-highlight-fill); }
  .c-dependency-matrix .swipe { display: none; margin: var(--ds-space-3) 0 0; font-size: var(--ds-text-xs); color: var(--ds-muted); }
  .c-dependency-matrix .key { display: flex; flex-wrap: wrap; gap: var(--ds-space-2) var(--ds-space-5); margin: var(--ds-space-4) 0 0; padding: 0; list-style: none; font-size: var(--ds-text-xs); color: var(--ds-muted); }
  .c-dependency-matrix .key li { display: inline-flex; align-items: center; gap: var(--ds-space-2); }
  .c-dependency-matrix .key .dot { margin: 0; width: 10px; height: 10px; }
  .c-dependency-matrix .key .is-key .dot { background: var(--ds-highlight-line); }
  @container (max-width: 820px) {
    .c-dependency-matrix { padding: var(--ds-space-6) var(--ds-space-4); }
    .c-dependency-matrix .swipe { display: block; }
    .c-dependency-matrix thead .corner { width: 150px; min-width: 150px; }
    .c-dependency-matrix tbody th { padding-left: var(--ds-space-3); font-size: var(--ds-text-xs); }
    .c-dependency-matrix tfoot th { padding-left: var(--ds-space-3); }
  }
</style>

<figure class="c-dependency-matrix">
  <figcaption class="head">
    <h3>Which shared enablers each initiative waits on</h3>
    <p class="hint"></p>
  </figcaption>
  <div class="scroll" tabindex="0" role="region" aria-label="Dependency table, scrolls sideways"></div>
  <p class="swipe">Swipe sideways to see every enabler.</p>
  <ul class="key">
    <li><i class="dot"></i>Initiative depends on the enabler</li>
    <li class="is-key"><i class="dot"></i>Highest-leverage enabler</li>
  </ul>
</figure>

<script>
(() => {
  // Replace with your own. "needs" lists the indexes of the enablers an initiative depends on.
  const ENABLERS = ['Clean customer data', 'Event tracking', 'Single sign-on', 'Approval workflow', 'Model hosting', 'Training budget'];
  const INITIATIVES = [
    { name: 'Churn alerts', needs: [0, 1, 4] },
    { name: 'Smart routing', needs: [0, 3] },
    { name: 'Invoice matching', needs: [0, 3, 4] },
    { name: 'Self-service portal', needs: [0, 2, 3] },
    { name: 'Renewal forecasting', needs: [0, 1, 4] },
    { name: 'Onboarding checklist', needs: [2, 5] },
    { name: 'Call summaries', needs: [4, 5] },
    { name: 'Spend dashboard', needs: [0, 1] },
  ];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  document.querySelectorAll('.c-dependency-matrix').forEach((root) => {
    const totals = ENABLERS.map((_, e) => INITIATIVES.filter((it) => it.needs.includes(e)).length);
    const peak = Math.max(...totals);
    const top = (e) => totals[e] === peak;
    const cls = (e) => (top(e) ? ' class="is-top"' : '');

    let html = '<table><thead><tr><th class="corner" scope="col">Initiative</th>';
    ENABLERS.forEach((n, e) => {
      html += '<th scope="col"' + cls(e) + '>' + (top(e) ? '<span class="tagline">Highest leverage</span>' : '') + esc(n) + '</th>';
    });
    html += '<th class="needs" scope="col">Needs</th></tr></thead><tbody>';
    INITIATIVES.forEach((it) => {
      html += '<tr><th scope="row">' + esc(it.name) + '</th>';
      ENABLERS.forEach((n, e) => {
        html += '<td' + cls(e) + '>' + (it.needs.includes(e) ? '<span class="dot" role="img" aria-label="Depends on ' + esc(n) + '"></span>' : '') + '</td>';
      });
      html += '<td class="needs">' + it.needs.length + ' of ' + ENABLERS.length + '</td></tr>';
    });
    html += '</tbody><tfoot><tr><th scope="row">Initiatives waiting</th>';
    totals.forEach((t, e) => { html += '<td' + cls(e) + '>' + t + '</td>'; });
    html += '<td class="needs"></td></tr></tfoot></table>';
    root.querySelector('.scroll').innerHTML = html;

    const names = ENABLERS.filter((_, e) => top(e)).map((n) => n.toLowerCase());
    root.querySelector('.hint').textContent = 'Fix ' + names.join(' and ') + ' first: ' + peak + ' of ' + INITIATIVES.length + ' initiatives wait on ' + (names.length > 1 ? 'each' : 'it') + '.';
  });
})();
</script>
