<!--
@title Thinking indicator
@description A shimmering "Thinking" label above a step list that ticks through its states, with spinners turning into checks. Starts when scrolled into view.
@tags thinking, loading, progress, steps, spinner, agent, llm
@preview center
@height 340
@replay true
@added 2026-10-31
-->
<style>
  .c-thinking-indicator,
  .c-thinking-indicator *,
  .c-thinking-indicator *::before,
  .c-thinking-indicator *::after { box-sizing: border-box; }
  .c-thinking-indicator {
    display: grid;
    gap: var(--ds-space-5);
    width: min(420px, 100%);
    padding: var(--ds-space-6);
    background: var(--ds-surface);
    border: var(--ds-hairline) solid var(--ds-line);
    border-radius: var(--ds-radius-xl);
    font-family: var(--ds-font-sans);
    color: var(--ds-text);
  }
  .c-thinking-indicator .label {
    justify-self: start;
    font-size: var(--ds-text-lg);
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ds-ink);
  }
  .c-thinking-indicator.is-active .label {
    color: transparent;
    background: linear-gradient(100deg, var(--ds-muted) 35%, var(--ds-ink) 50%, var(--ds-muted) 65%) 100% 0 / 280% 100% no-repeat;
    -webkit-background-clip: text;
    background-clip: text;
    animation: c-thinking-indicator-shimmer 1600ms linear infinite;
  }
  .c-thinking-indicator .steps { margin: 0; padding: 0; list-style: none; display: grid; gap: var(--ds-space-3); }
  .c-thinking-indicator .step { display: flex; align-items: center; gap: var(--ds-space-3); font-size: var(--ds-text-sm); color: var(--ds-muted); transition: color var(--ds-dur-base) var(--ds-ease); }
  .c-thinking-indicator .step .icon { position: relative; flex: none; width: 20px; height: 20px; }
  .c-thinking-indicator .icon svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .c-thinking-indicator .pending-dot { stroke: var(--ds-line); }
  .c-thinking-indicator .spin { opacity: 0; }
  .c-thinking-indicator .spin circle { stroke: var(--ds-info-line); }
  .c-thinking-indicator .check { opacity: 0; transform: scale(0.6); }
  .c-thinking-indicator .check circle { fill: var(--ds-note-fill); stroke: var(--ds-note-line); }
  .c-thinking-indicator .check path { stroke: var(--ds-ink); }
  .c-thinking-indicator .step.is-active { color: var(--ds-ink); font-weight: 600; }
  .c-thinking-indicator .step.is-active .spin { opacity: 1; animation: c-thinking-indicator-spin 800ms linear infinite; }
  .c-thinking-indicator .step.is-active .pending-dot { opacity: 0; }
  .c-thinking-indicator .step.is-done { color: var(--ds-text); }
  .c-thinking-indicator .step.is-done .pending-dot { opacity: 0; }
  .c-thinking-indicator .step.is-done .check { opacity: 1; transform: none; transition: opacity var(--ds-dur-base) var(--ds-ease), transform var(--ds-dur-base) var(--ds-ease-spring); }
  .c-thinking-indicator .step .time { margin-left: auto; font-size: var(--ds-text-xs); color: var(--ds-muted); font-variant-numeric: tabular-nums; opacity: 0; }
  .c-thinking-indicator .step.is-done .time { opacity: 1; transition: opacity var(--ds-dur-base) var(--ds-ease); }
  @keyframes c-thinking-indicator-shimmer { to { background-position: 0% 0; } }
  @keyframes c-thinking-indicator-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .c-thinking-indicator.is-active .label { animation: none; }
    .c-thinking-indicator .step.is-active .spin { animation: none; }
  }
</style>

<div class="c-thinking-indicator" role="status" aria-live="polite">
  <span class="label" data-idle="Thinking" data-done="Finished thinking">Thinking</span>
  <ol class="steps">
    <li class="step" data-ms="750">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke-width="1.5"><circle class="pending-dot" cx="10" cy="10" r="3" /></svg>
        <svg class="spin" viewBox="0 0 20 20" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="7" stroke-dasharray="26 18"/></svg>
        <svg class="check" viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8.5"/><path d="M6.4 10.2l2.5 2.5 4.7-5"/></svg>
      </span>
      <span>Searching the web</span><span class="time">0.8s</span>
    </li>
    <li class="step" data-ms="650">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke-width="1.5"><circle class="pending-dot" cx="10" cy="10" r="3" /></svg>
        <svg class="spin" viewBox="0 0 20 20" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="7" stroke-dasharray="26 18"/></svg>
        <svg class="check" viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8.5"/><path d="M6.4 10.2l2.5 2.5 4.7-5"/></svg>
      </span>
      <span>Reading 4 sources</span><span class="time">0.7s</span>
    </li>
    <li class="step" data-ms="750">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke-width="1.5"><circle class="pending-dot" cx="10" cy="10" r="3" /></svg>
        <svg class="spin" viewBox="0 0 20 20" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="10" cy="10" r="7" stroke-dasharray="26 18"/></svg>
        <svg class="check" viewBox="0 0 20 20" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8.5"/><path d="M6.4 10.2l2.5 2.5 4.7-5"/></svg>
      </span>
      <span>Drafting the answer</span><span class="time">0.8s</span>
    </li>
  </ol>
</div>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.querySelectorAll('.c-thinking-indicator').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    const label = root.querySelector('.label');
    const steps = [...root.querySelectorAll('.step')];
    const finish = () => {
      root.classList.remove('is-active');
      label.textContent = label.dataset.done;
    };
    if (reduced) { steps.forEach((s) => s.classList.add('is-done')); finish(); return; }

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    async function run() {
      root.classList.add('is-active');
      for (const step of steps) {
        step.classList.add('is-active');
        await wait(parseFloat(step.dataset.ms) || 700);
        step.classList.remove('is-active');
        step.classList.add('is-done');
      }
      finish();
    }

    const io = new IntersectionObserver((entries) => {
      if (!entries.some((e) => e.isIntersecting)) return;
      io.disconnect();
      run();
    }, { threshold: 0.4 });
    io.observe(root);
  });
})();
</script>
