<!--
@title Carousel cover
@description 4:5 carousel opening slide with a hook headline, a hand-drawn underline, a slide counter and a swipe cue. Exports at 1080x1350.
@tags social, carousel, cover, hook, instagram, linkedin
@preview center
@height 740
@added 2026-10-31
-->
<style>
  .c-carousel-cover {
    container-type: inline-size;
    position: relative;
    width: min(540px, 100%);
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: var(--ds-surface);
    color: var(--ds-text);
    font-family: var(--ds-font-sans);
    box-shadow: var(--ds-shadow-md);
  }
  .c-carousel-cover .inner {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 8cqi;
  }
  .c-carousel-cover .top { display: flex; justify-content: space-between; align-items: center; }
  .c-carousel-cover .tag {
    padding: 1.4cqi 3cqi;
    border: var(--ds-hairline) solid var(--ds-line);
    border-radius: var(--ds-radius-pill);
    font-size: 3.2cqi;
    font-weight: 700;
    color: var(--ds-text);
    background: var(--ds-raised);
  }
  .c-carousel-cover .count { font-size: 3.4cqi; font-weight: 700; color: var(--ds-ink); font-variant-numeric: tabular-nums; }
  .c-carousel-cover .count span { color: var(--ds-muted); }
  .c-carousel-cover .main { align-self: center; display: grid; gap: 5cqi; }
  .c-carousel-cover h1 {
    margin: 0;
    font-family: var(--ds-font-display);
    font-size: 11.6cqi;
    font-weight: var(--ds-weight-display);
    letter-spacing: var(--ds-tracking-display);
    line-height: 1.04;
    color: var(--ds-ink);
    text-wrap: balance;
  }
  .c-carousel-cover .hl { position: relative; display: inline-block; white-space: nowrap; }
  .c-carousel-cover .ul {
    position: absolute;
    left: -1.5%;
    bottom: -1.8cqi;
    width: 103%;
    height: 3cqi;
    max-width: none;
    overflow: visible;
    fill: none;
    stroke: var(--ds-highlight-line);
    stroke-width: 1.1cqi;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  .c-carousel-cover .ul path { vector-effect: non-scaling-stroke; }
  .c-carousel-cover .sub { margin: 0; max-width: 78%; font-size: 4.4cqi; line-height: 1.4; }
  .c-carousel-cover .bottom { display: flex; justify-content: space-between; align-items: center; }
  .c-carousel-cover .handle { font-size: 3.4cqi; font-weight: 600; color: var(--ds-muted); }
  .c-carousel-cover .swipe {
    display: inline-flex;
    align-items: center;
    gap: 2cqi;
    padding: 2cqi 3.6cqi;
    border-radius: var(--ds-radius-pill);
    background: var(--ds-action);
    color: var(--ds-on-action);
    font-size: 3.6cqi;
    font-weight: 700;
  }
  .c-carousel-cover .swipe svg { width: 5cqi; height: 3cqi; fill: none; stroke: currentColor; stroke-width: 0.5cqi; stroke-linecap: round; stroke-linejoin: round; }
</style>

<article class="c-carousel-cover" aria-label="Carousel cover slide">
  <div class="inner">
    <div class="top">
      <span class="tag">Small business tools</span>
      <span class="count">01<span>/07</span></span>
    </div>
    <div class="main">
      <h1>Stop paying for <span class="hl">five apps<svg class="ul" viewBox="0 0 100 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 7 C 16 3, 30 10, 48 6 S 78 3, 98 7"/></svg></span> that do one job.</h1>
      <p class="sub">Seven tools that replaced my whole admin stack, and what each one costs.</p>
    </div>
    <div class="bottom">
      <span class="handle">@yourhandle</span>
      <span class="swipe">Swipe <svg viewBox="0 0 20 12" aria-hidden="true"><path d="M1 6h17M13 1l5 5-5 5"/></svg></span>
    </div>
  </div>
</article>
