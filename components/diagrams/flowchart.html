<style>
  .c-flowchart {
    margin: 0;
    padding: var(--ds-space-7) var(--ds-space-6) var(--ds-space-6);
    background: var(--ds-surface);
    border-radius: var(--ds-radius-xl);
    font-family: var(--ds-font-sans);
    color: var(--ds-text);
  }
  .c-flowchart .head { margin-bottom: var(--ds-space-5); }
  .c-flowchart h3 { margin: 0; font-size: var(--ds-text-lg); color: var(--ds-ink); }
  .c-flowchart .hint { margin: var(--ds-space-1) 0 0; font-size: var(--ds-text-sm); color: var(--ds-muted); }
  .c-flowchart .frame {
    padding: var(--ds-space-5);
    background: var(--ds-raised);
    border: var(--ds-stroke) solid var(--ds-neutral-line);
    border-radius: var(--ds-radius-lg);
    overflow-x: auto;
  }
  .c-flowchart svg { display: block; width: 100%; min-width: 560px; max-width: 1040px; height: auto; margin: 0 auto; overflow: visible; }
  .c-flowchart .scrollhint { display: none; margin: var(--ds-space-3) 0 0; font-size: var(--ds-text-xs); color: var(--ds-muted); }
  .c-flowchart .legend { display: flex; flex-wrap: wrap; gap: var(--ds-space-2) var(--ds-space-5); margin: var(--ds-space-5) 0 0; padding: 0; list-style: none; font-size: var(--ds-text-sm); color: var(--ds-text); }
  .c-flowchart .legend li { display: inline-flex; align-items: center; gap: var(--ds-space-2); }
  .c-flowchart .sw { width: 18px; height: 12px; border-radius: 3px; border: var(--ds-stroke) solid var(--s); background: var(--f); }
  .c-flowchart .ln { width: 24px; height: 0; border-top: var(--ds-stroke) solid var(--s); }
  .c-flowchart .ln.is-dashed { border-top-style: dashed; }
  .c-flowchart .note {
    position: relative;
    max-width: 440px;
    margin: var(--ds-space-6) 0 0 var(--ds-space-6);
    padding: var(--ds-space-3) var(--ds-space-4);
    background: var(--ds-note-fill);
    border: var(--ds-stroke) solid var(--ds-note-line);
    border-radius: var(--ds-radius-md);
    font-size: var(--ds-text-sm);
    font-weight: 700;
    line-height: var(--ds-leading-snug);
    color: var(--ds-ink);
  }
  .c-flowchart .note::before { content: ""; position: absolute; left: 28px; bottom: 100%; height: 20px; border-left: var(--ds-stroke) solid var(--ds-note-line); }
  .c-flowchart .note::after { content: ""; position: absolute; left: 24.5px; bottom: calc(100% + 16px); width: 7px; height: 7px; border-top: var(--ds-stroke) solid var(--ds-note-line); border-left: var(--ds-stroke) solid var(--ds-note-line); transform: rotate(45deg); }
  .c-flowchart .k-n { --f: var(--ds-neutral-fill); --s: var(--ds-neutral-line); }
  .c-flowchart .k-i { --f: var(--ds-info-fill); --s: var(--ds-info-line); }
  .c-flowchart .k-h { --f: var(--ds-highlight-fill); --s: var(--ds-highlight-line); }
  .c-flowchart .k-d { --f: var(--ds-danger-fill); --s: var(--ds-danger-line); }
  .c-flowchart .k-g { --f: var(--ds-note-fill); --s: var(--ds-note-line); }
  .c-flowchart svg { --f: var(--ds-neutral-fill); --s: var(--ds-neutral-line); }
  .c-flowchart .node { fill: var(--f); stroke: var(--s); stroke-width: var(--ds-stroke); }
  .c-flowchart .node.dash { stroke-dasharray: 6 5; }
  .c-flowchart .edge { fill: none; stroke: var(--s); stroke-width: var(--ds-stroke); stroke-linecap: round; stroke-linejoin: round; }
  .c-flowchart .edge.dash { stroke-dasharray: 6 5; }
  .c-flowchart .mk { fill: none; stroke-width: var(--ds-stroke); stroke-linecap: round; stroke-linejoin: round; }
  .c-flowchart .mk-n { stroke: var(--ds-neutral-line); }
  .c-flowchart .mk-i { stroke: var(--ds-info-line); }
  .c-flowchart .mk-h { stroke: var(--ds-highlight-line); }
  .c-flowchart .mk-d { stroke: var(--ds-danger-line); }
  .c-flowchart .mk-g { stroke: var(--ds-note-line); }
  .c-flowchart text { font-family: var(--ds-font-sans); font-size: 14px; fill: var(--ds-text); }
  .c-flowchart .t { font-weight: 600; fill: var(--ds-ink); }
  .c-flowchart .s { font-size: 12.5px; fill: var(--ds-text); fill-opacity: 0.72; }
  .c-flowchart .mu { font-size: 12.5px; font-weight: 600; fill: var(--ds-muted); }
  .c-flowchart .m { font-family: var(--ds-font-mono); font-size: 12px; }
  .c-flowchart .e { font-size: 12.5px; font-weight: 600; fill: var(--ds-text); paint-order: stroke; stroke: var(--ds-raised); stroke-width: 6px; stroke-linejoin: round; }
  .c-flowchart .e.k-h { fill: var(--ds-text); }
  .c-flowchart .e.k-d { fill: var(--ds-danger-line); }
  .c-flowchart .guide { stroke: var(--ds-line); stroke-width: 1; fill: none; }
  .c-flowchart .axis { stroke: var(--ds-neutral-line); stroke-opacity: 0.6; stroke-width: 1; fill: none; }
  @media (max-width: 720px) {
    .c-flowchart { padding: var(--ds-space-6) var(--ds-space-4) var(--ds-space-5); }
    .c-flowchart .frame { padding: var(--ds-space-3); }
    .c-flowchart .scrollhint { display: block; }
    .c-flowchart .note { margin-left: var(--ds-space-4); }
  }
</style>

<figure class="c-flowchart">
  <figcaption class="head">
    <h3>Should a recurring task be automated?</h3>
    <p class="hint">Two questions decide it. Only the highlighted path earns a build.</p>
  </figcaption>
  <div class="frame">
    <svg viewBox="0 0 770 560" role="img" aria-label="Flowchart: a recurring task is done by hand once, then either kept manual, turned into a checklist, or automated depending on how often it repeats and whether it is identical each time.">

<path class="edge k-n" d="M230 64 V100" marker-end="url(#flowchart-an)"/>
<path class="edge k-n" d="M230 148 V184" marker-end="url(#flowchart-an)"/>
<path class="edge k-n" d="M340 236 H450" marker-end="url(#flowchart-an)"/>
<path class="edge k-n" d="M230 288 V332" marker-end="url(#flowchart-an)"/>
<path class="edge k-n" d="M340 384 H450" marker-end="url(#flowchart-an)"/>
<path class="edge k-h" d="M230 436 V476" marker-end="url(#flowchart-ah)"/>
<text class="e" x="395" y="226" text-anchor="middle">No</text>
<text class="e" x="240" y="316" text-anchor="start">Yes</text>
<text class="e" x="395" y="374" text-anchor="middle">No</text>
<text class="e" x="240" y="462" text-anchor="start">Yes</text>
<g class="k-n"><rect class="node" x="130" y="20" width="200" height="44" rx="22"/><text class="t" x="230" y="47" text-anchor="middle">New recurring task</text></g>
<g class="k-n"><rect class="node" x="130" y="100" width="200" height="48" rx="8"/><text class="t" x="230" y="129" text-anchor="middle">Do it by hand once</text></g>
<g class="k-i"><polygon class="node" points="230,184 340,236 230,288 120,236"/><text class="t" x="230" y="233" text-anchor="middle">Will it repeat</text><text class="t" x="230" y="251" text-anchor="middle">more than 3 times?</text></g>
<g class="k-i"><polygon class="node" points="230,332 340,384 230,436 120,384"/><text class="t" x="230" y="381" text-anchor="middle">Is it the same</text><text class="t" x="230" y="399" text-anchor="middle">every time?</text></g>
<g class="k-n"><rect class="node" x="450" y="212" width="200" height="48" rx="22"/><text class="t" x="550" y="233" text-anchor="middle">Keep it manual</text><text class="s" x="550" y="251" text-anchor="middle">a one-off job</text></g>
<g class="k-n"><rect class="node" x="450" y="360" width="200" height="48" rx="22"/><text class="t" x="550" y="381" text-anchor="middle">Write a checklist</text><text class="s" x="550" y="399" text-anchor="middle">repeated, but it varies</text></g>
<g class="k-h"><rect class="node" x="130" y="476" width="200" height="56" rx="28"/><text class="t" x="230" y="501" text-anchor="middle">Automate it</text><text class="s" x="230" y="519" text-anchor="middle">repeated and identical</text></g>
    </svg>
  </div>
  <p class="scrollhint">Scroll sideways to see the whole diagram.</p>
  <p class="note">Most tasks stop at the checklist. Automate only when the steps never change.</p>
  <ul class="legend">
    <li class="k-n"><span class="sw"></span>Start, step or stop</li>
    <li class="k-i"><span class="sw"></span>Decision</li>
