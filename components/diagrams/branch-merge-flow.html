<style>
  .c-branch-merge-flow {

  .c-branch-merge-flow .k-d { --f: var(--ds-danger-fill); --s: var(--ds-danger-line); }

  .c-branch-merge-flow .t { font-weight: 600; fill: var(--ds-ink); }

  .c-branch-merge-flow .m { font-family: var(--ds-font-mono); font-size: 12px; }
  .c-branch-merge-flow .e { font-size: 12.5px; font-weight: 600; fill: var(--ds-text); paint-order: stroke; stroke: var(--ds-raised); stroke-width: 6px; stroke-linejoin: round; }
  .c-branch-merge-flow .e.k-h { fill: var(--ds-text); }
  .c-branch-merge-flow .e.k-d { fill: var(--ds-danger-line); }
  .c-branch-merge-flow .guide { stroke: var(--ds-line); stroke-width: 1; fill: none; }
  .c-branch-merge-flow .axis { stroke: var(--ds-neutral-line); stroke-opacity: 0.6; stroke-width: 1; fill: none; }
  .c-branch-merge-flow .draw { stroke-dasharray: 1; stroke-dashoffset: 0; stroke-linecap: butt; }
  .c-branch-merge-flow.is-armed .draw { stroke-dashoffset: 1; }
  .c-branch-merge-flow.is-armed .pop, .c-branch-merge-flow.is-armed .head { opacity: 0; }
  .c-branch-merge-flow.is-armed .pop { transform: translateY(6px); }
  .c-branch-merge-flow.is-armed.is-in .draw { stroke-dashoffset: 0; transition: stroke-dashoffset var(--ds-dur-slow) var(--ds-ease-in-out) var(--d, 0ms); }
  .c-branch-merge-flow.is-armed.is-in .pop { opacity: 1; transform: none; transition: opacity var(--ds-dur-base) var(--ds-ease) var(--d, 0ms), transform var(--ds-dur-slow) var(--ds-ease) var(--d, 0ms); }
  .c-branch-merge-flow.is-armed.is-in .head { opacity: 1; transition: opacity var(--ds-dur-fast) var(--ds-ease) var(--d, 0ms); }

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.c-branch-merge-flow').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    if (reduced) return;
    root.classList.add('is-armed');
    const io = new IntersectionObserver((entries) => {
      if (!entries.some((e) => e.isIntersecting)) return;
      io.disconnect();
      requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-in')));
    }, { threshold: 0.35 });
    io.observe(root);
  });
})();
</script>
