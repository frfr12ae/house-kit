<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Which store each signal lands in, and which store feeds each surface (federated mode).
  const IN_MAP = [0, 0, 1, 2];
  const OUT_MAP = [0, 1, 1, 2];
  const CAPTIONS = {
    hub: 'Hub and spoke: every signal lands in one record and every surface reads from it. Easy to govern and easy to join, but one place to fail and one team in the queue.',
    fed: 'Federated: each domain keeps its own record and serves its own surfaces, linked by a shared index. Local ownership and fewer bottlenecks, but cross-domain questions take more work.',
  };
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const clamp = (v) => Math.min(1, Math.max(0, v));

  document.querySelectorAll('.c-layered-architecture').forEach((root) => {
    const HUB_X = 252, HUB_W = 626, FED_W = 190, FED_X = [252, 470, 688];
    const CHIP_X = [0, 1, 2, 3].map((i) => 252 + i * 162 + 70);
    const inPaths = [...root.querySelectorAll('.flow-in')];
    const outPaths = [...root.querySelectorAll('.flow-out')];
    const stores = [...root.querySelectorAll('.store')];
    const links = [...root.querySelectorAll('.link')];
    const subHub = root.querySelector('.sub-hub');
    const subFed = root.querySelector('.sub-fed');
    const caption = root.querySelector('.caption');
    const buttons = [...root.querySelectorAll('.opt')];

    // attach point along a store for flow number idx among the flows that share it
    const fedX = (map, i) => {
      const k = map[i];
      const peers = map.filter((m) => m === k);
      const idx = map.slice(0, i).filter((m) => m === k).length;
      return FED_X[k] + FED_W * (idx + 1) / (peers.length + 1);
    };

    function draw(e) {
      const sides = clamp((e - 0.2) / 0.6);
      const geo = [
        { x: HUB_X, w: lerp(36, FED_W, e), o: sides },
        { x: lerp(HUB_X, FED_X[1], e), w: lerp(HUB_W, FED_W, e), o: 1 },
        { x: lerp(HUB_X + HUB_W - 36, FED_X[2], e), w: lerp(36, FED_W, e), o: sides },
      ];
      stores.forEach((g, k) => {
        const r = g.querySelector('rect');
        r.setAttribute('x', geo[k].x.toFixed(1));
        r.setAttribute('width', geo[k].w.toFixed(1));
        g.style.opacity = geo[k].o.toFixed(3);
        const cx = (geo[k].x + geo[k].w / 2).toFixed(1);
        g.querySelectorAll('text').forEach((t) => t.setAttribute('x', cx));
        g.querySelectorAll('.fed-t, .fed-s').forEach((t) => { t.style.opacity = clamp((e - 0.55) / 0.45); });
        g.querySelectorAll('.hub-t, .hub-s').forEach((t) => { t.style.opacity = clamp(1 - e / 0.45); });
      });
      links.forEach((ln, k) => {
        ln.setAttribute('x1', (geo[k].x + geo[k].w).toFixed(1));
        ln.setAttribute('x2', geo[k + 1].x.toFixed(1));
        ln.style.opacity = clamp((e - 0.6) / 0.4).toFixed(3);
      });
      inPaths.forEach((p, i) => {
        const hub = HUB_X + HUB_W * (i + 0.5) / 4;
        const ax = lerp(hub, fedX(IN_MAP, i), e);
        p.setAttribute('d', 'M' + CHIP_X[i] + ' 88 C' + CHIP_X[i] + ' 150 ' + ax.toFixed(1) + ' 150 ' + ax.toFixed(1) + ' 211');
      });
      outPaths.forEach((p, j) => {
        const hub = HUB_X + HUB_W * (j + 0.5) / 4;
        const bx = lerp(hub, fedX(OUT_MAP, j), e);
        p.setAttribute('d', 'M' + bx.toFixed(1) + ' 281 C' + bx.toFixed(1) + ' 343 ' + CHIP_X[j] + ' 343 ' + CHIP_X[j] + ' 403');
      });
      subHub.style.opacity = clamp(1 - e / 0.5);
      subFed.style.opacity = clamp((e - 0.5) / 0.5);
    }

    let e = 0, raf = 0;
    const dur = (parseFloat(getComputedStyle(root).getPropertyValue('--ds-dur-story')) || 1400) * 0.55;
    function go(target) {
      cancelAnimationFrame(raf);
      if (reduced || !dur) { e = target; draw(e); return; }
      const from = e, t0 = performance.now();
      const step = (now) => {
        const p = clamp((now - t0) / dur);
        e = lerp(from, target, ease(p));
        draw(e);
        if (p < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    }
    function setMode(mode, animate) {
      buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
      caption.textContent = CAPTIONS[mode];
      if (animate) go(mode === 'fed' ? 1 : 0); else { e = mode === 'fed' ? 1 : 0; draw(e); }
    }
    buttons.forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode, true)));
    setMode('hub', false);
  });
})();
</script>
