<style>
  .c-fan-out-flow {
    margin: 0;

  .c-fan-out-flow .head { margin-bottom: var(--ds-space-5); }

  .c-fan-out-flow .frame {
    padding: var(--ds-space-5);
    background: var(--ds-raised);

  .c-fan-out-flow .legend { display: flex; flex-wrap: wrap; gap: var(--ds-space-2) var(--ds-space-5); margin: var(--ds-space-5) 0 0; padding: 0; list-style: none; font-size: var(--ds-text-sm); color: var(--ds-text); }

  .c-fan-out-flow .note {

  .c-fan-out-flow .note::before { content: ""; position: absolute; left: 28px; bottom: 100%; height: 20px; border-left: var(--ds-stroke) solid var(--ds-note-line); }
  .c-fan-out-flow .note::after { content: ""; position: absolute; left: 24.5px; bottom: calc(100% + 16px); width: 7px; height: 7px; border-top: var(--ds-stroke) solid var(--ds-note-line); border-left: var(--ds-stroke) solid var(--ds-note-line); transform: rotate(45deg); }
  .c-fan-out-flow .k-n { --f: var(--ds-neutral-fill); --s: var(--ds-neutral-line); }
  .c-fan-out-flow .k-i { --f: var(--ds-info-fill); --s: var(--ds-info-line); }
  .c-fan-out-flow .k-h { --f: var(--ds-highlight-fill); --s: var(--ds-highlight-line); }
  .c-fan-out-flow .k-d { --f: var(--ds-danger-fill); --s: var(--ds-danger-line); }
  .c-fan-out-flow .k-g { --f: var(--ds-note-fill); --s: var(--ds-note-line); }
  .c-fan-out-flow svg { --f: var(--ds-neutral-fill); --s: var(--ds-neutral-line); }
  .c-fan-out-flow .node { fill: var(--f); stroke: var(--s); stroke-width: var(--ds-stroke); }
  .c-fan-out-flow .node.dash { stroke-dasharray: 6 5; }
  .c-fan-out-flow .edge { fill: none; stroke: var(--s); stroke-width: var(--ds-stroke); stroke-linecap: round; stroke-linejoin: round; }
  .c-fan-out-flow .edge.dash { stroke-dasharray: 6 5; }
  .c-fan-out-flow .mk { fill: none; stroke-width: var(--ds-stroke); stroke-linecap: round; stroke-linejoin: round; }
  .c-fan-out-flow .mk-n { stroke: var(--ds-neutral-line); }
  .c-fan-out-flow .mk-i { stroke: var(--ds-info-line); }
  .c-fan-out-flow .mk-h { stroke: var(--ds-highlight-line); }
  .c-fan-out-flow .mk-d { stroke: var(--ds-danger-line); }
  .c-fan-out-flow .mk-g { stroke: var(--ds-note-line); }
  .c-fan-out-flow text { font-family: var(--ds-font-sans); font-size: 14px; fill: var(--ds-text); }
  .c-fan-out-flow .t { font-weight: 600; fill: var(--ds-ink); }
  .c-fan-out-flow .s { font-size: 12.5px; fill: var(--ds-text); fill-opacity: 0.72; }
  .c-fan-out-flow .mu { font-size: 12.5px; font-weight: 600; fill: var(--ds-muted); }
  .c-fan-out-flow .m { font-family: var(--ds-font-mono); font-size: 12px; }
  .c-fan-out-flow .e { font-size: 12.5px; font-weight: 600; fill: var(--ds-text); paint-order: stroke; stroke: var(--ds-raised); stroke-width: 6px; stroke-linejoin: round; }
  .c-fan-out-flow .e.k-h { fill: var(--ds-text); }
  .c-fan-out-flow .e.k-d { fill: var(--ds-danger-line); }
  .c-fan-out-flow .guide { stroke: var(--ds-line); stroke-width: 1; fill: none; }
  .c-fan-out-flow .axis { stroke: var(--ds-neutral-line); stroke-opacity: 0.6; stroke-width: 1; fill: none; }
  .c-fan-out-flow .draw { stroke-dasharray: 1; stroke-dashoffset: 0; stroke-linecap: butt; }
  .c-fan-out-flow.is-armed .draw { stroke-dashoffset: 1; }
  .c-fan-out-flow.is-armed .pop, .c-fan-out-flow.is-armed .head { opacity: 0; }
  .c-fan-out-flow.is-armed .pop { transform: translateY(6px); }
  .c-fan-out-flow.is-armed.is-in .draw { stroke-dashoffset: 0; transition: stroke-dashoffset var(--ds-dur-slow) var(--ds-ease-in-out) var(--d, 0ms); }
  .c-fan-out-flow.is-armed.is-in .pop { opacity: 1; transform: none; transition: opacity var(--ds-dur-base) var(--ds-ease) var(--d, 0ms), transform var(--ds-dur-slow) var(--ds-ease) var(--d, 0ms); }
  .c-fan-out-flow.is-armed.is-in .head { opacity: 1; transition: opacity var(--ds-dur-fast) var(--ds-ease) var(--d, 0ms); }
  @media (max-width: 720px) {
    .c-fan-out-flow { padding: var(--ds-space-6) var(--ds-space-4) var(--ds-space-5); }
    .c-fan-out-flow .frame { padding: var(--ds-space-3); }
    .c-fan-out-flow .scrollhint { display: block; }
    .c-fan-out-flow .note { margin-left: var(--ds-space-4); }

</style>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.c-fan-out-flow').forEach((root) => {
    if (reduced) return;
    root.classList.add('is-armed');
    const io = new IntersectionObserver((entries) => {
      if (!entries.some((e) => e.isIntersecting)) return;
      io.disconnect();
      requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-in')));
    }, { threshold: 0.35 });
    io.observe(root);
  });
})();
</script>
