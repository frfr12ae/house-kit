<style>
  .c-waterfall {
    margin: 0;
    padding: var(--ds-space-7) var(--ds-space-6) var(--ds-space-6);
    background: var(--ds-surface);
    border-radius: var(--ds-radius-xl);
    font-family: var(--ds-font-sans);
    color: var(--ds-text);
  }
  .c-waterfall .head { margin-bottom: var(--ds-space-5); }
  .c-waterfall h3 { margin: 0; font-size: var(--ds-text-lg); color: var(--ds-ink); }
  .c-waterfall .hint { margin: var(--ds-space-1) 0 0; font-size: var(--ds-text-sm); color: var(--ds-muted); }
  .c-waterfall .frame {
    padding: var(--ds-space-5);
    background: var(--ds-raised);
    border: var(--ds-stroke) solid var(--ds-neutral-line);
    border-radius: var(--ds-radius-lg);
    overflow-x: auto;
  }
  .c-waterfall svg { display: block; width: 100%; min-width: 640px; max-width: 1040px; height: auto; margin: 0 auto; overflow: visible; }
  .c-waterfall .scrollhint { display: none; margin: var(--ds-space-3) 0 0; font-size: var(--ds-text-xs); color: var(--ds-muted); }
  .c-waterfall .legend { display: flex; flex-wrap: wrap; gap: var(--ds-space-2) var(--ds-space-5); margin: var(--ds-space-5) 0 0; padding: 0; list-style: none; font-size: var(--ds-text-sm); color: var(--ds-text); }
  .c-waterfall .legend li { display: inline-flex; align-items: center; gap: var(--ds-space-2); }
  .c-waterfall .sw { width: 18px; height: 12px; border-radius: 3px; border: var(--ds-stroke) solid var(--s); background: var(--f); }
  .c-waterfall .ln { width: 24px; height: 0; border-top: var(--ds-stroke) solid var(--s); }
  .c-waterfall .ln.is-dashed { border-top-style: dashed; }
  .c-waterfall .note {
    position: relative;
    max-width: 440px;
    margin: var(--ds-space-6) 0 0 var(--ds-space-6);
    padding: var(--ds-space-3) var(--ds-space-4);
    background: var(--ds-note-fill);
    border: var(--ds-stroke) solid var(--ds-note-line);
    border-radius: var(--ds-radius-md);
    font-size: var(--ds-text-sm);
    font-weight: 700;
    line-height: var(--ds-leading-snug);
    color: var(--ds-ink);
  }
  .c-waterfall .note::before { content: ""; position: absolute; left: 28px; bottom: 100%; height: 20px; border-left: var(--ds-stroke) solid var(--ds-note-line); }
  .c-waterfall .note::after { content: ""; position: absolute; left: 24.5px; bottom: calc(100% + 16px); width: 7px; height: 7px; border-top: var(--ds-stroke) solid var(--ds-note-line); border-left: var(--ds-stroke) solid var(--ds-note-line); transform: rotate(45deg); }
  .c-waterfall .k-n { --f: var(--ds-neutral-fill); --s: var(--ds-neutral-line); }
  .c-waterfall .k-i { --f: var(--ds-info-fill); --s: var(--ds-info-line); }
  .c-waterfall .k-h { --f: var(--ds-highlight-fill); --s: var(--ds-highlight-line); }
  .c-waterfall .k-d { --f: var(--ds-danger-fill); --s: var(--ds-danger-line); }
  .c-waterfall .k-g { --f: var(--ds-note-fill); --s: var(--ds-note-line); }
  .c-waterfall svg { --f: var(--ds-neutral-fill); --s: var(--ds-neutral-line); }
  .c-waterfall .node { fill: var(--f); stroke: var(--s); stroke-width: var(--ds-stroke); }
  .c-waterfall .node.dash { stroke-dasharray: 6 5; }
  .c-waterfall .edge { fill: none; stroke: var(--s); stroke-width: var(--ds-stroke); stroke-linecap: round; stroke-linejoin: round; }
  .c-waterfall .edge.dash { stroke-dasharray: 6 5; }
  .c-waterfall .mk { fill: none; stroke-width: var(--ds-stroke); stroke-linecap: round; stroke-linejoin: round; }
  .c-waterfall .mk-n { stroke: var(--ds-neutral-line); }
  .c-waterfall .mk-i { stroke: var(--ds-info-line); }
  .c-waterfall .mk-h { stroke: var(--ds-highlight-line); }
  .c-waterfall .mk-d { stroke: var(--ds-danger-line); }
  .c-waterfall .mk-g { stroke: var(--ds-note-line); }
  .c-waterfall text { font-family: var(--ds-font-sans); font-size: 14px; fill: var(--ds-text); }
  .c-waterfall .t { font-weight: 600; fill: var(--ds-ink); }
  .c-waterfall .s { font-size: 12.5px; fill: var(--ds-text); fill-opacity: 0.72; }
  .c-waterfall .mu { font-size: 12.5px; font-weight: 600; fill: var(--ds-muted); }
  .c-waterfall .m { font-family: var(--ds-font-mono); font-size: 12px; }
  .c-waterfall .e { font-size: 12.5px; font-weight: 600; fill: var(--ds-text); paint-order: stroke; stroke: var(--ds-raised); stroke-width: 6px; stroke-linejoin: round; }
  .c-waterfall .e.k-h { fill: var(--ds-text); }
  .c-waterfall .e.k-d { fill: var(--ds-danger-line); }
  .c-waterfall .guide { stroke: var(--ds-line); stroke-width: 1; fill: none; }
  .c-waterfall .axis { stroke: var(--ds-neutral-line); stroke-opacity: 0.6; stroke-width: 1; fill: none; }
  @media (max-width: 720px) {
    .c-waterfall { padding: var(--ds-space-6) var(--ds-space-4) var(--ds-space-5); }
    .c-waterfall .frame { padding: var(--ds-space-3); }
    .c-waterfall .scrollhint { display: block; }
    .c-waterfall .note { margin-left: var(--ds-space-4); }
  }
</style>
