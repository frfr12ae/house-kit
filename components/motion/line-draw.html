<!--
@title Line draw
@description SVG line chart whose path draws on, then the area fades in and the end point pulses with a value label. Set the series in data-points.
@tags chart, line, draw, svg, trend, dataviz
@preview center
@height 440
@replay true
@added 2026-10-31
-->
<style>
  .c-line-draw,
  .c-line-draw *,
  .c-line-draw *::before,
  .c-line-draw *::after { box-sizing: border-box; }
  .c-line-draw {
    width: min(680px, 100%);
    padding: var(--ds-space-6);
    background: var(--ds-surface);
    border-radius: var(--ds-radius-xl);
    font-family: var(--ds-font-sans);
    color: var(--ds-text);
    margin: 0;
  }
  .c-line-draw .head { display: grid; gap: var(--ds-space-1); margin-bottom: var(--ds-space-6); }
  .c-line-draw .title { font-size: var(--ds-text-md); font-weight: 700; color: var(--ds-ink); }
  .c-line-draw .unit { font-size: var(--ds-text-sm); color: var(--ds-muted); }
  .c-line-draw .plot { position: relative; }
  .c-line-draw svg { width: 100%; height: auto; overflow: visible; }
  .c-line-draw .grid { stroke: var(--ds-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .c-line-draw .area { fill: var(--ds-series-1); opacity: 0.16; }
  .c-line-draw .line {
    fill: none;
    stroke: var(--ds-series-1);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  .c-line-draw .dot {
    position: absolute;
    width: 12px;
    height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: var(--ds-series-1);
    border: 2px solid var(--ds-surface);
  }
  .c-line-draw .dot::after {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: var(--ds-stroke) solid var(--ds-series-1);
    animation: c-line-draw-pulse 1800ms var(--ds-ease) infinite;
  }
  .c-line-draw .tag {
    position: absolute;
    transform: translate(-100%, -100%);
    margin: -14px 0 0 -2px;
    padding: var(--ds-space-1) var(--ds-space-3);
    border-radius: var(--ds-radius-pill);
    background: var(--ds-action);
    color: var(--ds-on-action);
    font-size: var(--ds-text-sm);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .c-line-draw .axis {
    position: relative;
    height: 20px;
    margin-top: var(--ds-space-3);
    font-size: var(--ds-text-sm);
    color: var(--ds-muted);
  }
  .c-line-draw .axis span { position: absolute; top: 0; white-space: nowrap; }
  @keyframes c-line-draw-pulse {
    0% { transform: scale(1); opacity: 0.7; }
    80%, 100% { transform: scale(2.6); opacity: 0; }
  }

  /* the hidden state carries no transition, so arming never animates; only the move to .is-in does */
  .c-line-draw.is-armed .line { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .c-line-draw.is-armed .area { opacity: 0; }
  .c-line-draw.is-armed .dot,
  .c-line-draw.is-armed .tag { opacity: 0; }
  .c-line-draw.is-armed.is-in .line { stroke-dashoffset: 0; transition: stroke-dashoffset calc(var(--ds-dur-story) * 1.5) var(--ds-ease-in-out); }
  .c-line-draw.is-armed.is-in .area { opacity: 0.16; transition: opacity var(--ds-dur-slow) var(--ds-ease); transition-delay: calc(var(--ds-dur-story) * 1.2); }
  .c-line-draw.is-armed.is-in .dot,
  .c-line-draw.is-armed.is-in .tag { opacity: 1; transition: opacity var(--ds-dur-base) var(--ds-ease); transition-delay: calc(var(--ds-dur-story) * 1.5); }

  @media (prefers-reduced-motion: reduce) {
    .c-line-draw .dot::after { animation: none; opacity: 0; }
  }
</style>

<figure class="c-line-draw" data-points="22,28,26,35,41,38,52,61,58,74,86,98" data-suffix="k">
  <div class="head">
    <span class="title">Weekly active users</span>
    <span class="unit">Last 12 weeks, in thousands</span>
  </div>
  <div class="plot" role="img" aria-label="Line chart of weekly active users rising from 22 thousand to 98 thousand over 12 weeks">
    <svg viewBox="0 0 640 250" preserveAspectRatio="none" aria-hidden="true">
      <line class="grid" x1="0" x2="640" y1="20" y2="20"/>
      <line class="grid" x1="0" x2="640" y1="95" y2="95"/>
      <line class="grid" x1="0" x2="640" y1="170" y2="170"/>
      <line class="grid" x1="0" x2="640" y1="245" y2="245"/>
      <path class="area" d=""/>
      <path class="line" pathLength="1" d=""/>
    </svg>
    <span class="dot"></span>
    <span class="tag"></span>
  </div>
  <div class="axis" aria-hidden="true"><span style="left: 0">Week 1</span><span style="left: 50%; transform: translateX(-50%)">Week 6</span><span style="left: 100%; transform: translateX(-100%)">Week 12</span></div>
</figure>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const W = 640, TOP = 20, BOTTOM = 245;

  function smooth(pts) {
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1].toFixed(1)}`;
    }
    return d;
  }

  document.querySelectorAll('.c-line-draw').forEach((root) => {
    const values = root.dataset.points.split(',').map(Number);
    const max = Math.ceil(Math.max(...values) / 25) * 25;
    const pts = values.map((v, i) => [(i / (values.length - 1)) * W, BOTTOM - (v / max) * (BOTTOM - TOP)]);
    const line = smooth(pts);
    root.querySelector('.line').setAttribute('d', line);
    root.querySelector('.area').setAttribute('d', `${line} L${W},${BOTTOM} L0,${BOTTOM} Z`);

    const last = pts[pts.length - 1];
    const vb = root.querySelector('svg').viewBox.baseVal;
    const dot = root.querySelector('.dot');
    const tag = root.querySelector('.tag');
    const left = `${(last[0] / vb.width) * 100}%`;
    const top = `${(last[1] / vb.height) * 100}%`;
    dot.style.left = left; dot.style.top = top;
    tag.style.left = left; tag.style.top = top;
    tag.textContent = values[values.length - 1] + (root.dataset.suffix || '');

    if (reduced) return;
    root.classList.add('is-armed');
    const io = new IntersectionObserver((entries) => {
      if (!entries.some((e) => e.isIntersecting)) return;
      io.disconnect();
      requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-in')));
    }, { threshold: 0.4 });
    io.observe(root);
  });
})();
</script>
