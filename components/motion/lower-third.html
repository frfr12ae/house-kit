<!--
@title Lower third
@description A name and role lower third that wipes in, holds, wipes out and loops, shown on a neutral video-frame placeholder.
@tags lower third, video, overlay, name, caption, broadcast, loop
@preview fill
@height 460
@replay true
@added 2026-10-31
-->
<style>
  .c-lower-third,
  .c-lower-third *,
  .c-lower-third *::before,
  .c-lower-third *::after { box-sizing: border-box; }
  .c-lower-third {
    container-type: inline-size;
    position: relative;
    width: min(960px, 100%);
    margin-inline: auto;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: var(--ds-radius-xl);
    font-family: var(--ds-font-sans);
    background:
      radial-gradient(ellipse 60% 70% at 78% 28%, color-mix(in srgb, var(--ds-series-1) 26%, transparent), transparent 70%),
      radial-gradient(ellipse 50% 60% at 18% 82%, color-mix(in srgb, var(--ds-series-2) 16%, transparent), transparent 70%),
      color-mix(in srgb, var(--ds-neutral-line) 16%, black);
  }
  .c-lower-third .figure {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 24cqi;
    height: 38cqi;
    transform: translateX(10%);
    border-radius: 50% 50% 0 0 / 38% 38% 0 0;
    background: color-mix(in srgb, var(--ds-neutral-line) 38%, transparent);
    opacity: 0.55;
  }
  .c-lower-third .figure::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -26%;
    width: 52%;
    aspect-ratio: 1;
    transform: translateX(-50%);
    border-radius: 50%;
    background: inherit;
  }
  .c-lower-third .rec {
    position: absolute;
    top: 4cqi;
    left: 4.5cqi;
    display: flex;
    align-items: center;
    gap: 1cqi;
    font-size: clamp(10px, 1.4cqi, 14px);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--ds-neutral-line) 60%, white);
  }
  .c-lower-third .rec i {
    width: 1cqi;
    height: 1cqi;
    min-width: 7px;
    min-height: 7px;
    border-radius: 50%;
    background: var(--ds-danger-line);
  }

  .c-lower-third .lt {
    position: absolute;
    left: 4.5cqi;
    bottom: 7cqi;
    display: flex;
    align-items: stretch;
    max-width: calc(100% - 9cqi);
  }
  .c-lower-third .bar {
    width: clamp(4px, 0.7cqi, 8px);
    flex: none;
    background: var(--ds-highlight-line);
    transform-origin: bottom;
    transition: transform var(--ds-dur-base) var(--ds-ease-in-out);
  }
  .c-lower-third .plate {
    display: grid;
    gap: 0.3cqi;
    padding: clamp(8px, 1.5cqi, 20px) clamp(14px, 2.6cqi, 36px) clamp(8px, 1.5cqi, 20px) clamp(12px, 2cqi, 28px);
    background: var(--ds-raised);
    border: var(--ds-hairline) solid var(--ds-line);
    border-left: 0;
    clip-path: inset(0 100% 0 0);
    transition: clip-path var(--ds-dur-slow) var(--ds-ease-in-out);
  }
  .c-lower-third .name {
    font-family: var(--ds-font-display);
    font-size: clamp(15px, 3cqi, 34px);
    font-weight: var(--ds-weight-display);
    letter-spacing: var(--ds-tracking-display);
    line-height: var(--ds-leading-tight);
    color: var(--ds-ink);
  }
  .c-lower-third .role {
    font-size: clamp(11px, 1.9cqi, 22px);
    line-height: var(--ds-leading-snug);
    color: var(--ds-muted);
    font-weight: 600;
  }
  .c-lower-third .bar { transform: scaleY(0); }

  .c-lower-third.is-in .bar { transform: scaleY(1); }
  .c-lower-third.is-in .plate { clip-path: inset(0 0 0 0); transition-delay: var(--ds-dur-fast); }
  .c-lower-third.is-out .plate { clip-path: inset(0 0 0 100%); transition-delay: 0ms; }
  .c-lower-third.is-out .bar { transform: scaleY(0); transition-delay: var(--ds-dur-slow); }
  .c-lower-third.is-reset .bar,
  .c-lower-third.is-reset .plate { transition: none; }
</style>

<div class="c-lower-third" role="img" aria-label="Video frame with a lower third naming Jordan Ellis, Head of Customer Research">
  <div class="figure" aria-hidden="true"></div>
  <div class="rec" aria-hidden="true"><i></i>Rec 00:14:32</div>
  <div class="lt">
    <div class="bar"></div>
    <div class="plate">
      <span class="name">Jordan Ellis</span>
      <span class="role">Head of Customer Research</span>
    </div>
  </div>
</div>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const HOLD = 2600, PAUSE = 700;

  document.querySelectorAll('.c-lower-third').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    if (reduced) { root.classList.add('is-in'); return; }
    const slow = parseFloat(getComputedStyle(root).getPropertyValue('--ds-dur-slow')) || 600;
    let timers = [];
    let running = false;
    const later = (fn, ms) => timers.push(setTimeout(fn, ms));

    function cycle() {
      root.classList.remove('is-out');
      root.classList.add('is-in');
      later(() => root.classList.add('is-out'), slow * 2 + HOLD);
      later(() => {
        root.classList.add('is-reset');
        root.classList.remove('is-in', 'is-out');
        void root.offsetWidth;
        root.classList.remove('is-reset');
      }, slow * 4 + HOLD);
      later(cycle, slow * 4 + HOLD + PAUSE);
    }
    function stop() { timers.forEach(clearTimeout); timers = []; running = false; }

    const io = new IntersectionObserver((entries) => {
      const visible = entries.some((e) => e.isIntersecting);
      if (visible && !running) { running = true; requestAnimationFrame(() => requestAnimationFrame(cycle)); }
      else if (!visible && running) stop();
    }, { threshold: 0.4 });
    io.observe(root);
  });
})();
</script>
