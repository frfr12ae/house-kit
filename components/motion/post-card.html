<!--
@title Post card
@description A social post card slides in, then the reply, repost and like counts tick up and the like button fills.
@tags social, post, card, likes, counter, engagement, motion
@preview center
@height 420
@replay true
@added 2026-11-18
@source HyperFrames x-post block by HeyGen (look only; code written from scratch) | https://github.com/heygen-com/hyperframes | inspired-by
-->
<style>
  .c-post-card,
  .c-post-card *,
  .c-post-card *::before,
  .c-post-card *::after { box-sizing: border-box; }
  .c-post-card {
    width: min(520px, 100%);
    margin: 0;
    padding: var(--ds-space-5);
    background: var(--ds-surface);
    border: var(--ds-hairline) solid var(--ds-line);
    border-radius: var(--ds-radius-xl);
    box-shadow: var(--ds-shadow-md);
    font-family: var(--ds-font-sans);
    color: var(--ds-text);
  }
  .c-post-card .head { display: flex; align-items: center; gap: var(--ds-space-3); margin-bottom: var(--ds-space-4); }
  .c-post-card .avatar {
    flex: none;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--ds-highlight-fill);
    border: var(--ds-hairline) solid var(--ds-highlight-line);
    color: var(--ds-ink);
    font-weight: 700;
  }
  .c-post-card .who { min-width: 0; display: grid; }
  .c-post-card .name { font-size: var(--ds-text-md); font-weight: 700; color: var(--ds-ink); }
  .c-post-card .handle { font-size: var(--ds-text-sm); color: var(--ds-muted); }
  .c-post-card .body { margin: 0 0 var(--ds-space-3); font-size: var(--ds-text-lg); line-height: var(--ds-leading-snug); color: var(--ds-ink); }
  .c-post-card .tag { color: var(--ds-ink); font-weight: 700; }
  .c-post-card .stamp {
    margin: 0 0 var(--ds-space-3);
    padding-bottom: var(--ds-space-3);
    border-bottom: var(--ds-hairline) solid var(--ds-line);
    font-size: var(--ds-text-sm);
    color: var(--ds-muted);
  }
  .c-post-card .metrics { display: flex; flex-wrap: wrap; gap: var(--ds-space-2) var(--ds-space-5); }
  .c-post-card .metric { display: inline-flex; align-items: center; gap: var(--ds-space-2); font-size: var(--ds-text-sm); color: var(--ds-muted); }
  .c-post-card .metric svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .c-post-card .num { font-variant-numeric: tabular-nums; min-width: 3ch; }
  .c-post-card .metric--like svg { transform-origin: 50% 60%; }
  .c-post-card .metric--like.is-on { color: var(--ds-ink); }
  .c-post-card .metric--like.is-on svg { fill: var(--ds-highlight-line); stroke: var(--ds-highlight-line); animation: c-post-card-pop var(--ds-dur-slow) var(--ds-ease-spring); }
  @keyframes c-post-card-pop { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }

  .c-post-card.is-armed { opacity: 0; transform: translateY(40px); }
  .c-post-card.is-armed.is-in { opacity: 1; transform: none; transition: opacity var(--ds-dur-slow) var(--ds-ease), transform var(--ds-dur-story) var(--ds-ease); }

  @media (max-width: 400px) {
    .c-post-card { padding: var(--ds-space-4); }
    .c-post-card .body { font-size: var(--ds-text-md); }
    .c-post-card .metrics { gap: var(--ds-space-2) var(--ds-space-4); }
  }
  @media (prefers-reduced-motion: reduce) {
    .c-post-card .metric--like.is-on svg { animation: none; }
  }
</style>

<article class="c-post-card" aria-label="Post by Mara Voss">
  <div class="head">
    <span class="avatar" aria-hidden="true">MV</span>
    <div class="who"><span class="name">Mara Voss</span><span class="handle">@maravoss</span></div>
  </div>
  <p class="body">We cut our onboarding from nine steps to four. Support tickets dropped by a third in the first month. <span class="tag">#productdesign</span></p>
  <p class="stamp">9:41 AM &middot; Nov 18, 2026</p>
  <div class="metrics">
    <span class="metric"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="num" data-to="42" data-from="31">42</span></span>
    <span class="metric"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11V9a3 3 0 0 1 3-3h11m0 0-3-3m3 3-3 3M20 13v2a3 3 0 0 1-3 3H6m0 0 3 3m-3-3 3-3"/></svg><span class="num" data-to="1280" data-from="990" data-fmt="k">1.3K</span></span>
    <span class="metric metric--like"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span class="num" data-to="8420" data-from="8100" data-fmt="k">8.4K</span></span>
    <span class="metric"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L8 8m4-4 4 4M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg><span class="num">Share</span></span>
  </div>
</article>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fmt = (n, mode) => mode === 'k' && n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K' : String(Math.round(n));
  document.querySelectorAll('.c-post-card').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    if (reduced) return;
    const nums = Array.from(root.querySelectorAll('.num[data-to]'));
    const like = root.querySelector('.metric--like');
    nums.forEach((el) => { el.textContent = fmt(+el.dataset.from, el.dataset.fmt); });
    root.classList.add('is-armed');
    const tick = () => {
      const t0 = performance.now(), dur = 1500;
      const step = (now) => {
        const p = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3);
        nums.forEach((el) => { el.textContent = fmt(+el.dataset.from + (+el.dataset.to - +el.dataset.from) * e, el.dataset.fmt); });
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
      setTimeout(() => like.classList.add('is-on'), 500);
    };
    const io = new IntersectionObserver((entries) => {
      if (!entries.some((e) => e.isIntersecting)) return;
      io.disconnect();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        root.classList.add('is-in');
        setTimeout(tick, 900);
      }));
    }, { threshold: 0.4 });
    io.observe(root);
  });
})();
</script>
