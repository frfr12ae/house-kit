<!--
@title Marquee ticker
@description An infinite horizontal ticker of keywords in two rows moving in opposite directions, with faded edges. Pauses on hover and when off screen.
@tags marquee, ticker, loop, keywords, logos, scroll
@preview fill
@height 240
@replay true
@added 2026-10-31
-->
<style>
  .c-marquee,
  .c-marquee *,
  .c-marquee *::before,
  .c-marquee *::after { box-sizing: border-box; }
  .c-marquee {
    display: grid;
    gap: var(--ds-space-4);
    padding: var(--ds-space-8) 0;
    font-family: var(--ds-font-sans);
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
    mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
  }
  .c-marquee .row { display: flex; overflow: hidden; }
  .c-marquee .track {
    display: flex;
    flex: none;
    gap: var(--ds-space-3);
    padding-right: var(--ds-space-3);
    animation: c-marquee-slide 42s linear infinite;
    animation-play-state: paused;
  }
  .c-marquee .row--rev .track { animation-direction: reverse; animation-duration: 52s; }
  .c-marquee.is-in .track { animation-play-state: running; }
  .c-marquee:hover .track,
  .c-marquee:focus-within .track { animation-play-state: paused; }
  .c-marquee .chip {
    flex: none;
    display: inline-flex;
    align-items: center;
    height: 52px;
    padding: 0 var(--ds-space-6);
    border: var(--ds-hairline) solid var(--ds-line);
    border-radius: var(--ds-radius-pill);
    background: var(--ds-raised);
    color: var(--ds-ink);
    font-size: var(--ds-text-md);
    font-weight: 600;
    white-space: nowrap;
  }
  .c-marquee .row--rev .chip { background: transparent; color: var(--ds-text); }
  @keyframes c-marquee-slide {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .c-marquee .track { animation: none; }
    .c-marquee .row { overflow-x: auto; }
    .c-marquee .track[aria-hidden="true"] { display: none; }
  }
</style>

<div class="c-marquee" role="group" aria-label="Services">
  <div class="row">
    <div class="track">
      <span class="chip">Brand strategy</span><span class="chip">Design systems</span><span class="chip">Motion graphics</span><span class="chip">Web builds</span><span class="chip">Analytics</span><span class="chip">Copywriting</span><span class="chip">Automation</span><span class="chip">Workshops</span>
    </div>
  </div>
  <div class="row row--rev">
    <div class="track">
      <span class="chip">User research</span><span class="chip">Prototyping</span><span class="chip">Dashboards</span><span class="chip">Content audits</span><span class="chip">Email design</span><span class="chip">Accessibility</span><span class="chip">Reporting</span><span class="chip">Training</span>
    </div>
  </div>
</div>

<script>
(() => {
  document.querySelectorAll('.c-marquee').forEach((root) => {
    root.querySelectorAll('.track').forEach((track) => {
      // repeat the set until one track is wider than the row, then add one copy for the seamless loop
      const row = track.parentElement;
      const clones = [];
      const make = () => {
        const c = track.cloneNode(true);
        c.setAttribute('aria-hidden', 'true');
        clones.push(c);
        row.appendChild(c);
      };
      make();
      let guard = 0;
      while (track.scrollWidth * (clones.length + 1) < row.clientWidth * 2 && guard++ < 6) make();
    });

    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => root.classList.toggle('is-in', e.isIntersecting));
    }, { threshold: 0.1 });
    io.observe(root);
  });
})();
</script>
