<style>
  .c-pitch-competition, .c-pitch-competition *, .c-pitch-competition *::before, .c-pitch-competition *::after { box-sizing: border-box; }
  .c-pitch-competition {
    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--ds-surface);
    color: var(--ds-text);
    font-family: var(--ds-font-sans);
  }
  .c-pitch-competition .inner {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    padding: 6cqi;
  }
  .c-pitch-competition .brand {
    display: flex;
    align-items: center;
    gap: 0.6cqi;
    font-size: 1.5cqi;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1;
    color: var(--ds-ink);
  }
  .c-pitch-competition .brand svg { width: 1.7cqi; height: 1.7cqi; fill: none; stroke: var(--ds-ink); stroke-width: 2; stroke-linecap: round; }
  .c-pitch-competition .brand svg .strike { stroke: var(--ds-highlight-line); }
  .c-pitch-competition .num {
    position: absolute;
    right: 6cqi;
    bottom: 2.6cqi;
    font-size: 1cqi;
    line-height: 1;
    color: var(--ds-muted);
    font-variant-numeric: tabular-nums;
  }
  .c-pitch-competition h2 {
    margin: 0;
    font-family: var(--ds-font-display);
    font-size: 4.6cqi;
    font-weight: var(--ds-weight-display);
    letter-spacing: var(--ds-tracking-display);
    line-height: 1.06;
    color: var(--ds-ink);
  }
  .c-pitch-competition .kicker { font-size: 1.5cqi; font-weight: 700; color: var(--ds-muted); }

  .c-pitch-competition .main { display: grid; grid-template-columns: minmax(0, 1fr) 28cqi; gap: 4.5cqi; align-items: stretch; padding-top: 3cqi; }
  .c-pitch-competition .chart { display: grid; grid-template-columns: auto 1fr; grid-template-rows: 1fr auto; gap: 1cqi; min-height: 0; }
  .c-pitch-competition .yax { grid-row: 1; display: flex; justify-content: space-between; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 1.2cqw; font-weight: 600; color: var(--ds-muted); }
  .c-pitch-competition .xax { grid-column: 2; display: flex; justify-content: space-between; font-size: 1.2cqi; font-weight: 600; color: var(--ds-muted); }
  .c-pitch-competition .plane { position: relative; border: var(--ds-hairline) solid var(--ds-line); border-radius: var(--ds-radius-lg); background: var(--ds-panel); }
  .c-pitch-competition .plane::before, .c-pitch-competition .plane::after { content: ""; position: absolute; background: var(--ds-line); }
  .c-pitch-competition .plane::before { left: 50%; top: 0; bottom: 0; width: var(--ds-hairline); }
  .c-pitch-competition .plane::after { top: 50%; left: 0; right: 0; height: var(--ds-hairline); }
  .c-pitch-competition .who { position: absolute; z-index: 1; display: flex; align-items: center; gap: 0.7cqi; font-size: 1.55cqi; font-weight: 600; color: var(--ds-text); white-space: nowrap; }
  .c-pitch-competition .who::before { content: ""; width: 0.9cqi; height: 0.9cqi; border-radius: 50%; background: var(--ds-neutral-line); }
  .c-pitch-competition .who.us { right: 5%; top: 9%; padding: 0.9cqi 1.6cqi; border: var(--ds-hairline) solid var(--ds-highlight-line); border-radius: var(--ds-radius-pill); background: var(--ds-highlight-fill); font-size: 2cqi; font-weight: 800; color: var(--ds-ink); box-shadow: var(--ds-shadow-md); }
  .c-pitch-competition .who.us::before { width: 1.2cqi; height: 1.2cqi; background: var(--ds-highlight-line); }
  .c-pitch-competition .side { display: grid; gap: 2.4cqi; align-content: center; }
  .c-pitch-competition h2 { font-size: 3.6cqi; }
  .c-pitch-competition .moat { padding: 1.5cqi 1.8cqi; border: var(--ds-hairline) solid var(--ds-note-line); border-radius: var(--ds-radius-md); background: var(--ds-note-fill); font-size: 1.6cqi; line-height: 1.38; color: var(--ds-ink); }
  .c-pitch-competition .moat b { display: block; margin-bottom: 0.4cqi; font-size: 1.3cqi; font-weight: 700; color: var(--ds-muted); }
</style>

<section class="c-pitch-competition" aria-label="Competition slide">
  <div class="inner">
    <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3v14M8 3v14M12 3v14M16 3v14"/><path class="strike" d="M1.5 15.5L18.5 4.5"/></svg>Tallyhouse</div>
    <div class="main">
      <div class="chart" role="img" aria-label="Positioning map. Axes: generic to built for studios, and manual to automatic. Tallyhouse sits alone in the built for studios, automatic corner. Spreadsheets, Brightbooks, Ledgerly, Penny and Co and local accountants sit elsewhere.">
        <div class="yax"><span>Do it yourself</span><span>Runs itself</span></div>
        <div class="plane">
          <span class="who" style="left: 6%; top: 76%;">Spreadsheets</span>
          <span class="who" style="left: 12%; top: 53%;">Brightbooks</span>
          <span class="who" style="left: 30%; top: 26%;">Ledgerly</span>
          <span class="who" style="left: 56%; top: 80%;">Local accountant</span>
          <span class="who" style="left: 58%; top: 60%;">Penny &amp; Co</span>
          <span class="who us">Tallyhouse</span>
        </div>
        <div class="xax"><span>Built for everyone</span><span>Built for studios</span></div>
      </div>
      <div class="side">
        <h2>Only one tool is built for studios and runs itself.</h2>
        <div class="moat"><b>Our moat</b>Every studio we add makes the categoriser smarter for all of them.</div>
      </div>
    </div>
  </div>
  <div class="num" aria-hidden="true">9</div>
</section>
