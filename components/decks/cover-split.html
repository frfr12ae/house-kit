<!--
@title Cover, split
@group Openers and structure
@description Split cover: a left colour field built from token shapes (circles, a quarter, a bar and a dot grid) and the title block on the right.
@tags slide, cover, title, split, abstract, opening
@preview slide
@added 2026-10-31
@source frontend-slides style presets by Zara Zhang | https://github.com/zarazhangrui/frontend-slides | inspired-by
-->
<style>
  .c-cover-split {
    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    display: grid;
    grid-template-columns: 41cqi minmax(0, 1fr);
    background: var(--ds-surface);
    color: var(--ds-text);
    font-family: var(--ds-font-sans);
  }
  .c-cover-split .field {
    position: relative;
    overflow: hidden;
    background: var(--ds-highlight-fill);
  }
  .c-cover-split .field > * { position: absolute; display: block; }
  .c-cover-split .dots {
    left: 3cqi;
    top: 3cqi;
    width: 13cqi;
    height: 13cqi;
    background-image: radial-gradient(circle, var(--ds-ink) 0.18cqi, transparent 0.24cqi);
    background-size: 1.9cqi 1.9cqi;
    opacity: 0.35;
  }
  .c-cover-split .sun {
    left: 14cqi;
    top: 7cqi;
    width: 21cqi;
    height: 21cqi;
    border-radius: 50%;
    background: var(--ds-series-2);
  }
  .c-cover-split .arch {
    left: 5cqi;
    bottom: 5cqi;
    width: 16cqi;
    height: 22.2cqi;
    border-radius: 16cqi 16cqi 0 0;
    background: var(--ds-series-1);
  }
  .c-cover-split .quarter {
    left: 21cqi;
    bottom: 0;
    width: 16cqi;
    height: 16cqi;
    border-radius: 100% 0 0 0;
    background: var(--ds-ink);
  }
  .c-cover-split .block {
    left: 21cqi;
    top: 29cqi;
    width: 9cqi;
    height: 9cqi;
    background: var(--ds-series-3);
  }
  .c-cover-split .ring {
    left: 30cqi;
    top: 29cqi;
    width: 7cqi;
    height: 7cqi;
    border-radius: 50%;
    border: 0.5cqi solid var(--ds-ink);
  }
  .c-cover-split .bar {
    left: 0;
    bottom: 0;
    width: 21cqi;
    height: 5cqi;
    background: var(--ds-series-5);
  }
  .c-cover-split .pip {
    left: 2cqi;
    top: 24cqi;
    width: 2.2cqi;
    height: 2.2cqi;
    border-radius: 50%;
    background: var(--ds-ink);
  }
  .c-cover-split .body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 6cqi 7cqi 5cqi 6cqi;
    min-width: 0;
  }
  .c-cover-split .tag {
    justify-self: start;
    padding: 0.55cqi 1.5cqi;
    border-radius: var(--ds-radius-pill);
    background: var(--ds-highlight-fill);
    border: var(--ds-hairline) solid var(--ds-highlight-line);
    font-size: 1.3cqi;
    font-weight: 700;
    color: var(--ds-ink);
  }
  .c-cover-split .main { align-self: center; display: grid; gap: 2.2cqi; }
  .c-cover-split h1 {
    margin: 0;
    font-family: var(--ds-font-display);
    font-size: 5.4cqi;
    font-weight: var(--ds-weight-display);
    letter-spacing: var(--ds-tracking-display);
    line-height: 1.04;
    color: var(--ds-ink);
  }
  .c-cover-split .sub { margin: 0; max-width: 40cqi; font-size: 1.9cqi; line-height: 1.45; }
  .c-cover-split .foot {
    display: flex;
    justify-content: space-between;
    gap: 2cqi;
    padding-top: 1.8cqi;
    border-top: var(--ds-hairline) solid var(--ds-line);
    font-size: 1.3cqi;
    color: var(--ds-muted);
  }
  .c-cover-split .foot b { color: var(--ds-text); font-weight: 600; }
</style>

<section class="c-cover-split">
  <div class="field" aria-hidden="true">
    <i class="dots"></i>
    <i class="sun"></i>
    <i class="arch"></i>
    <i class="block"></i>
    <i class="ring"></i>
    <i class="quarter"></i>
    <i class="bar"></i>
    <i class="pip"></i>
  </div>
  <div class="body">
    <span class="tag">Annual planning</span>
    <div class="main">
      <h1>Build the year around fewer, bigger bets</h1>
      <p class="sub">A working session to pick the three priorities that earn the budget, and say no to the rest.</p>
    </div>
    <div class="foot"><span><b>Amara Okafor</b>, Head of Strategy</span><span>31 October 2026</span></div>
  </div>
</section>
