@title Stacked share chart
@group Exhibits

<style>
  .c-stacked-share {
    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--ds-surface);
    color: var(--ds-text);
    font-family: var(--ds-font-sans);
  }
  .c-stacked-share .inner {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    row-gap: 1.4cqi;
    padding: 5cqi 6cqi;
  }
  .c-stacked-share .top { display: flex; align-items: center; justify-content: space-between; gap: 2cqi; }
  .c-stacked-share .kicker { margin: 0; font-size: 1.25cqi; font-weight: 600; line-height: 1.3; color: var(--ds-muted); }
  .c-stacked-share .tracker { display: flex; gap: 0.5cqi; margin: 0; padding: 0; list-style: none; }
  .c-stacked-share .tracker li { padding: 0.3cqi 0.9cqi; border-radius: var(--ds-radius-pill); background: var(--ds-panel); font-size: 1cqi; font-weight: 600; line-height: 1.2; color: var(--ds-muted); }
  .c-stacked-share .tracker li.is-on { background: var(--ds-highlight-fill); box-shadow: inset 0 0 0 1px var(--ds-highlight-line); color: var(--ds-ink); }
  .c-stacked-share h2 {
    margin: 0.9cqi 0 0;
    font-family: var(--ds-font-display);
    font-size: 2.6cqi;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--ds-ink);
    text-wrap: balance;
  }
  .c-stacked-share .exhibit { min-height: 0; }
  .c-stacked-share .frame { position: relative; width: 100%; aspect-ratio: 880 / 315; }
  .c-stacked-share svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: visible; }
  .c-stacked-share svg text { font-family: var(--ds-font-sans); fill: var(--ds-text); font-variant-numeric: tabular-nums; }
  .c-stacked-share .grid { stroke: var(--ds-line); stroke-width: 1; }
  .c-stacked-share .axis { stroke: var(--ds-muted); stroke-width: 1.2; }
  .c-stacked-share .tick { fill: var(--ds-muted); font-size: 12px; }
  .c-stacked-share .sm { font-size: 12px; }
  .c-stacked-share .md { font-size: 13px; }
  .c-stacked-share .lg { font-size: 14px; }
  .c-stacked-share .b { font-weight: 700; }
  .c-stacked-share .sb { font-weight: 600; }
  .c-stacked-share .ink { fill: var(--ds-ink); }
  .c-stacked-share .mu { fill: var(--ds-muted); }
  .c-stacked-share .mid { text-anchor: middle; }
  .c-stacked-share .end { text-anchor: end; }
  .c-stacked-share .halo { paint-order: stroke; stroke: var(--ds-surface); stroke-width: 4px; stroke-linejoin: round; }
  .c-stacked-share .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 3cqi;
    padding-top: 0.9cqi;
    border-top: var(--ds-hairline) solid var(--ds-line);
    font-size: 0.95cqi;
    line-height: 1.4;
    color: var(--ds-muted);
  }
  .c-stacked-share .page { flex: none; font-weight: 600; color: var(--ds-text); font-variant-numeric: tabular-nums; }

</style>
