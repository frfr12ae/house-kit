<!--
@title Keynote logo wall
@group Keynote
@description A customer wall of twelve fictional wordmarks set in different type weights and styles, with one pull quote underneath.
@tags keynote, logos, customers, wordmarks, social proof, quote
@preview slide
@replay true
@added 2026-10-31
-->
<style>
  .c-keynote-logo-wall, .c-keynote-logo-wall *, .c-keynote-logo-wall *::before, .c-keynote-logo-wall *::after { box-sizing: border-box; }
.c-keynote-logo-wall {
  --k-bg: var(--ds-ink);
  --k-fg: var(--ds-bg);
  --k-dim: color-mix(in srgb, var(--ds-bg) 60%, var(--ds-ink));
  --k-soft: color-mix(in srgb, var(--ds-bg) 82%, var(--ds-ink));
  --k-line: color-mix(in srgb, var(--ds-bg) 16%, transparent);
  --k-card: color-mix(in srgb, var(--ds-bg) 7%, var(--ds-ink));
  --k-card-2: color-mix(in srgb, var(--ds-bg) 12%, var(--ds-ink));
  --k-blue: var(--ds-info-line);
  --k-amber: var(--ds-highlight-line);
  --k-green: var(--ds-note-line);
  --k-t1: color-mix(in srgb, var(--ds-info-line) 80%, var(--ds-bg));
  --k-t2: color-mix(in srgb, var(--ds-highlight-line) 80%, var(--ds-bg));
  --k-t3: color-mix(in srgb, var(--ds-note-line) 80%, var(--ds-bg));
  --k-s1: color-mix(in srgb, var(--ds-info-line) 66%, var(--ds-bg));
  --k-s2: color-mix(in srgb, var(--ds-highlight-line) 66%, var(--ds-bg));
  --k-s3: color-mix(in srgb, var(--ds-note-line) 66%, var(--ds-bg));
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  overflow: hidden;
  background: var(--k-bg);
  color: var(--k-fg);
  font-family: var(--ds-font-sans);
  -webkit-font-smoothing: antialiased;
}
.c-keynote-logo-wall .sky {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(70% 60% at 50% 118%, color-mix(in srgb, var(--k-blue) 24%, transparent), transparent 70%),
    radial-gradient(50% 45% at 94% -8%, color-mix(in srgb, var(--k-amber) 14%, transparent), transparent 70%),
    radial-gradient(45% 40% at 2% 30%, color-mix(in srgb, var(--k-green) 8%, transparent), transparent 70%);
}
.c-keynote-logo-wall .pad { position: absolute; inset: 0; padding: 5.5cqi 7cqi; }
.c-keynote-logo-wall .eyebrow { margin: 0; font-size: 1.3cqi; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--k-dim); }
.c-keynote-logo-wall .display {
  margin: 0;
  font-family: var(--ds-font-display);
  font-weight: var(--ds-weight-display);
  letter-spacing: var(--ds-tracking-display);
  line-height: 1.02;
  color: var(--k-fg);
}
.c-keynote-logo-wall .grad {
  display: inline-block;
  padding: 0 0.04em 0.1em 0;
  margin: 0 -0.04em -0.1em 0;
  background: linear-gradient(100deg, var(--k-t1) 0%, var(--k-t3) 52%, var(--k-t2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
.c-keynote-logo-wall.is-armed .rv { opacity: 0; transform: translateY(1.8cqi); }
.c-keynote-logo-wall.is-armed.is-in .rv {
  opacity: 1;
  transform: none;
  transition: opacity var(--ds-dur-slow) var(--ds-ease), transform var(--ds-dur-slow) var(--ds-ease);
  transition-delay: calc(var(--d, 0) * 110ms);
}
  .c-keynote-logo-wall .sky {
    background:
      radial-gradient(56% 50% at 50% 30%, color-mix(in srgb, var(--k-blue) 14%, transparent), transparent 70%),
      radial-gradient(40% 40% at 100% 100%, color-mix(in srgb, var(--k-amber) 12%, transparent), transparent 70%),
      radial-gradient(40% 40% at 0% 100%, color-mix(in srgb, var(--k-green) 10%, transparent), transparent 70%);
  }
  .c-keynote-logo-wall .top { position: absolute; left: 7cqi; right: 7cqi; top: 5.4cqi; display: flex; justify-content: space-between; align-items: baseline; }
  .c-keynote-logo-wall .top h2 { font-size: 3.6cqi; }
  .c-keynote-logo-wall .wall { position: absolute; left: 7cqi; right: 7cqi; top: 13.4cqi; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: var(--ds-hairline) solid var(--k-line); }
  .c-keynote-logo-wall .wm {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.8cqi;
    height: 8.2cqi;
    border-top: var(--ds-hairline) solid var(--k-line);
    font-size: 2.6cqi;
    line-height: 1;
    white-space: nowrap;
    color: color-mix(in srgb, var(--k-fg) 78%, var(--k-bg));
  }
  .c-keynote-logo-wall .wm::before { content: none; flex: none; background: var(--k-t1); }
  .c-keynote-logo-wall .w1 { font-weight: 300; font-size: 3cqi; letter-spacing: -0.01em; }
  .c-keynote-logo-wall .w2 { font-weight: 800; font-size: 2.1cqi; letter-spacing: 0.24em; }
  .c-keynote-logo-wall .w3 { font-weight: 700; font-size: 3.4cqi; letter-spacing: -0.05em; }
  .c-keynote-logo-wall .w3::before { content: ""; width: 1.4cqi; height: 1.4cqi; border-radius: 50%; background: var(--k-t2); }
  .c-keynote-logo-wall .w4 { font-family: var(--ds-font-serif); font-style: italic; font-weight: 500; font-size: 2.9cqi; }
  .c-keynote-logo-wall .w5 { font-weight: 200; font-size: 3.4cqi; letter-spacing: 0.04em; }
  .c-keynote-logo-wall .w6 { font-weight: 600; font-size: 2.5cqi; letter-spacing: -0.03em; }
  .c-keynote-logo-wall .w6::before { content: ""; width: 1.5cqi; height: 1.5cqi; border-radius: 0.3cqi; background: var(--k-t3); }
  .c-keynote-logo-wall .w7 { font-weight: 900; font-size: 2.4cqi; letter-spacing: 0.05em; }
  .c-keynote-logo-wall .w8 { font-family: var(--ds-font-serif); font-weight: 400; font-size: 3.1cqi; letter-spacing: -0.01em; }
  .c-keynote-logo-wall .w9 { font-weight: 400; font-size: 1.6cqi; letter-spacing: 0.34em; }
  .c-keynote-logo-wall .w10 { font-style: italic; font-weight: 800; font-size: 2.8cqi; letter-spacing: -0.04em; }
  .c-keynote-logo-wall .w10::before { content: ""; width: 1.6cqi; height: 1.6cqi; background: var(--k-t1); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .c-keynote-logo-wall .w11 { font-weight: 100; font-size: 3.8cqi; letter-spacing: -0.02em; }
  .c-keynote-logo-wall .w12 { font-family: var(--ds-font-serif); font-weight: 700; font-size: 2.6cqi; }
  .c-keynote-logo-wall .quote { position: absolute; left: 7cqi; right: 7cqi; bottom: 5.2cqi; display: grid; grid-template-columns: 0.4cqi minmax(0, 1fr); gap: 2.4cqi; }
  .c-keynote-logo-wall .quote::before { content: ""; border-radius: 0.4cqi; background: linear-gradient(to bottom, var(--k-blue), var(--k-green) 55%, var(--k-amber)); box-shadow: 0 0 2cqi color-mix(in srgb, var(--k-blue) 40%, transparent); }
  .c-keynote-logo-wall blockquote { margin: 0; display: grid; gap: 1.2cqi; }
  .c-keynote-logo-wall blockquote p { margin: 0; font-family: var(--ds-font-display); font-size: 3.1cqi; font-weight: var(--ds-weight-display); letter-spacing: var(--ds-tracking-display); line-height: 1.18; color: var(--k-fg); }
  .c-keynote-logo-wall blockquote footer { font-size: 1.5cqi; color: var(--k-dim); }
  .c-keynote-logo-wall blockquote footer b { color: var(--k-soft); font-weight: 600; }
</style>

<section class="c-keynote-logo-wall" aria-label="Customers using Orbit, with a quote from one of them">
  <div class="sky"></div>
  <div class="top">
    <h2 class="display rv" style="--d:0">Teams that ship, on <span class="grad">Orbit.</span></h2>
    <p class="eyebrow rv" style="--d:1">12,000 teams</p>
  </div>
  <div class="wall" role="list" aria-label="Customer wordmarks">
    <span class="wm w1 rv" style="--d:1" role="listitem">Northlake</span>
    <span class="wm w2 rv" style="--d:2" role="listitem">HALDEN</span>
    <span class="wm w3 rv" style="--d:3" role="listitem">kiln</span>
    <span class="wm w4 rv" style="--d:4" role="listitem">Pelham &amp; Co</span>
    <span class="wm w5 rv" style="--d:2" role="listitem">Vantry</span>
    <span class="wm w6 rv" style="--d:3" role="listitem">fieldwork</span>
    <span class="wm w7 rv" style="--d:4" role="listitem">STRATUM</span>
    <span class="wm w8 rv" style="--d:5" role="listitem">Tidewater</span>
    <span class="wm w9 rv" style="--d:3" role="listitem">ORCHARD ROW</span>
    <span class="wm w10 rv" style="--d:4" role="listitem">Brightmoor</span>
    <span class="wm w11 rv" style="--d:5" role="listitem">quarrel</span>
    <span class="wm w12 rv" style="--d:6" role="listitem">Marlow &amp; Finch</span>
  </div>
  <div class="quote rv" style="--d:6">
    <blockquote>
      <p>Orbit 2 replaced three tools and gave us our Fridays back.</p>
      <footer><b>Priya Nair</b>, Head of Product at Tidewater</footer>
    </blockquote>
  </div>
</section>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.c-keynote-logo-wall').forEach((root) => {
    if (reduced) return;
    root.classList.add('is-armed');
    const io = new IntersectionObserver((entries) => {
      if (!entries.some((e) => e.isIntersecting)) return;
      io.disconnect();
      requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-in')));
    }, { threshold: 0.35 });
    io.observe(root);
  });
})();
</script>
