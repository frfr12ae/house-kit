<!--
@title Agent eval curve
@group Agent sessions
@description Benchmark line across releases with dotted drop lines, small dim labels for older points and large bright labels for the latest two. Use when the trend and the newest result both matter.
@tags chart, line, benchmark, eval, trend, releases, keynote
@preview slide
@added 2026-11-17
@source Lydia Hallie, "Rethinking Claude Code Best Practices", AI Engineer 2026 | https://www.youtube.com/watch?v=vlfCjWuv4es | inspired-by

<style>
.c-agent-eval-curve, .c-agent-eval-curve *, .c-agent-eval-curve *::before, .c-agent-eval-curve *::after { box-sizing: border-box; }
.c-agent-eval-curve {
  --k-bg: var(--ds-bg);
  --k-panel: color-mix(in srgb, var(--ds-ink) 4%, var(--ds-panel));
  --k-raised: color-mix(in srgb, var(--ds-ink) 7%, var(--ds-raised));
  --k-code: var(--ds-surface);
  --k-ink: var(--ds-ink);
  --k-text: var(--ds-text);
  --k-dim: var(--ds-muted);
  --k-faint: color-mix(in srgb, var(--ds-muted) 45%, var(--ds-bg));
  --k-line: var(--ds-line);
  --k-path: var(--ds-highlight-line);
  --k-pass: var(--ds-note-line);
  --k-passfill: var(--ds-note-fill);
  --k-fail: var(--ds-danger-line);
  --k-failfill: var(--ds-danger-fill);
  --k-human: var(--ds-info-line);
  --k-data: var(--ds-series-1);
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  overflow: hidden;
  border-radius: var(--ds-radius-lg);
  background-color: var(--k-bg);
  background-image: radial-gradient(circle, color-mix(in srgb, var(--ds-ink) 7%, transparent) 0.07cqi, transparent 0.09cqi);
  background-size: 1.4cqi 1.4cqi;
  color: var(--k-ink);
  font-family: var(--ds-font-sans);
}
.c-agent-eval-curve svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.c-agent-eval-curve text { font-family: var(--ds-font-sans); }
.c-agent-eval-curve .serif { font-family: var(--ds-font-display); font-weight: var(--ds-weight-display); letter-spacing: var(--ds-tracking-display); }
.c-agent-eval-curve .mono, .c-agent-eval-curve .mono text { font-family: var(--ds-font-mono); }
.c-agent-eval-curve .f-none { fill: none; }
.c-agent-eval-curve .f-bg { fill: var(--k-bg); }
.c-agent-eval-curve .f-panel { fill: var(--k-panel); }
.c-agent-eval-curve .f-raised { fill: var(--k-raised); }
.c-agent-eval-curve .f-code { fill: var(--k-code); }
.c-agent-eval-curve .f-ink { fill: var(--k-ink); }
.c-agent-eval-curve .f-text { fill: var(--k-text); }
.c-agent-eval-curve .f-dim { fill: var(--k-dim); }
.c-agent-eval-curve .f-faint { fill: var(--k-faint); }
.c-agent-eval-curve .f-line { fill: var(--k-line); }
.c-agent-eval-curve .f-path { fill: var(--k-path); }
.c-agent-eval-curve .f-pass { fill: var(--k-pass); }
.c-agent-eval-curve .f-passfill { fill: var(--k-passfill); }
.c-agent-eval-curve .f-fail { fill: var(--k-fail); }
.c-agent-eval-curve .f-failfill { fill: var(--k-failfill); }
.c-agent-eval-curve .f-human { fill: var(--k-human); }
.c-agent-eval-curve .f-data { fill: var(--k-data); }
.c-agent-eval-curve .s-bg { stroke: var(--k-bg); }
.c-agent-eval-curve .s-panel { stroke: var(--k-panel); }
.c-agent-eval-curve .s-raised { stroke: var(--k-raised); }
.c-agent-eval-curve .s-code { stroke: var(--k-code); }
.c-agent-eval-curve .s-ink { stroke: var(--k-ink); }
.c-agent-eval-curve .s-text { stroke: var(--k-text); }
.c-agent-eval-curve .s-dim { stroke: var(--k-dim); }
.c-agent-eval-curve .s-faint { stroke: var(--k-faint); }
.c-agent-eval-curve .s-line { stroke: var(--k-line); }
.c-agent-eval-curve .s-path { stroke: var(--k-path); }
.c-agent-eval-curve .s-pass { stroke: var(--k-pass); }
.c-agent-eval-curve .s-passfill { stroke: var(--k-passfill); }
.c-agent-eval-curve .s-fail { stroke: var(--k-fail); }
.c-agent-eval-curve .s-failfill { stroke: var(--k-failfill); }
.c-agent-eval-curve .s-human { stroke: var(--k-human); }
.c-agent-eval-curve .s-data { stroke: var(--k-data); }
</style>

<section class="c-agent-eval-curve" aria-label="Eval pass rate rising from 52 percent in release 1 to 93 percent in release 9">
  <svg viewBox="0 0 1600 900" role="img" aria-label="Eval pass rate rising from 52 percent in release 1 to 93 percent in release 9"></svg>
</section>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const check = (p, x, y, s, state) => {
    const g = el('g', {}, p);
    if (state === 'done' || state === 'fail') {
      el('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: s * 0.18, class: state === 'done' ? 'f-pass' : 'f-fail' }, g);
      const d = state === 'done'
        ? `M${x - s * 0.25} ${y} l${s * 0.17} ${s * 0.17} l${s * 0.33} ${-s * 0.33}`
        : `M${x - s * 0.2} ${y - s * 0.2} L${x + s * 0.2} ${y + s * 0.2} M${x + s * 0.2} ${y - s * 0.2} L${x - s * 0.2} ${y + s * 0.2}`;
      el('path', { d, class: 'f-none s-bg', 'stroke-width': s * 0.12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    } else {
      el('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: s * 0.18, class: 'f-bg ' + (state === 'bad' ? 's-fail' : 's-pass'), 'stroke-width': Math.max(1.5, s * 0.07) }, g);
    }
    return g;
  };
  const person = (p, x, y, r, tone) => {
    tone = tone || 'human';
    const g = el('g', {}, p);
    el('circle', { cx: x, cy: y, r, class: 'f-bg s-' + tone, 'stroke-width': r * 0.12 }, g);
    el('circle', { cx: x, cy: y - r * 0.2, r: r * 0.28, class: 'f-' + tone }, g);
    el('path', { d: `M${x - r * 0.55} ${y + r * 0.62} a${r * 0.55} ${r * 0.5} 0 0 1 ${r * 1.1} 0`, class: 'f-' + tone }, g);
    return g;
  };
  const spark = (p, x, y, r) => {
    const g = el('g', { class: 's-path', 'stroke-width': r * 0.18, 'stroke-linecap': 'round' }, p);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + Math.PI / 8;
      const l = i % 2 ? r * 0.72 : r;
      el('line', { x1: x + Math.cos(a) * r * 0.2, y1: y + Math.sin(a) * r * 0.2, x2: x + Math.cos(a) * l, y2: y + Math.sin(a) * l }, g);
    }
    return g;
  };
  const chip = (p, x, y, verb, arg, o) => {
    o = o || {};
    const fs = o.fs || 20;
    const pad = 10;
    const w = (verb.length + (arg ? arg.length + 1 : 0) + (o.mark ? 2 : 0)) * fs * 0.6 + pad * 2;
    const g = el('g', { class: 'mono' }, p);
    el('rect', { x: x - w / 2, y: y - fs * 0.9, width: w, height: fs * 1.8, rx: 6, class: o.danger ? 'f-failfill s-fail' : 'f-raised s-line', 'stroke-width': 1 }, g);
    const t = el('text', { x: x - w / 2 + pad, y: y + fs * 0.35, 'font-size': fs, class: o.danger ? 'f-fail' : 'f-ink' }, g, verb);
    if (arg) el('tspan', { class: o.danger ? 'f-fail' : 'f-dim' }, t, ' ' + arg);
    if (o.mark) el('tspan', { class: o.danger ? 'f-fail' : 'f-text' }, t, ' ' + o.mark);
    return g;
  };
  const bubble = (p, x, y, txt, fs, anchor) => {
    fs = fs || 22;
    const w = txt.length * fs * 0.52 + 28;
    const x0 = anchor === 'end' ? x - w : x;
    el('rect', { x: x0, y: y - fs * 1.05, width: w, height: fs * 2, rx: 8, class: 'f-panel' }, p);
    el('text', { x: x0 + 14, y: y + fs * 0.3, 'font-size': fs, class: 'f-ink' }, p, txt);
  };
  const wave = (x0, x1, yc, amp, waves) => {
    let d = '';
    for (let i = 0; i <= 160; i++) {
      const t = i / 160;
      const x = x0 + (x1 - x0) * t;
      const y = yc - amp * Math.sin(Math.PI * Math.min(1, t * 1.05)) * Math.sin(t * Math.PI * 2 * waves);
      d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
  };
  const waveY = (x, x0, x1, yc, amp, waves) => {
    const t = (x - x0) / (x1 - x0);
    return yc - amp * Math.sin(Math.PI * Math.min(1, t * 1.05)) * Math.sin(t * Math.PI * 2 * waves);
  };
  const baseline = (p, x0, x1, y) => el('line', { x1: x0, y1: y, x2: x1, y2: y, class: 's-faint', 'stroke-width': 2, 'stroke-dasharray': '2 9', 'stroke-linecap': 'round' }, p);
  const startNode = (p, x, y) => el('rect', { x: x - 7, y: y - 7, width: 14, height: 14, rx: 3, class: 'f-bg s-dim', 'stroke-width': 2 }, p);

  document.querySelectorAll('.c-agent-eval-curve').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    const s = root.querySelector('svg');

    const DATA = {
      title: 'Eval pass rate', note: 'Internal agent benchmark, 400 tasks. Settings vary by release.', highlight: 2,
      points: [['R1', 'Jan', 52], ['R2', 'Feb', 53], ['R3', 'Apr', 64], ['R4', 'May', 69], ['R5', 'Jun', 80], ['R6', 'Jul', 79], ['R7', 'Aug', 81], ['R8', 'Sep', 90], ['R9', 'Nov', 93]],
    };
    const P = DATA.points;
    el('text', { x: 90, y: 120, class: 'serif f-ink', 'font-size': 52 }, s, DATA.title);
    el('text', { x: 92, y: 165, 'font-size': 22, class: 'f-dim' }, s, DATA.note);
    const X = (i) => 140 + i * (1320 / (P.length - 1));
    const Y = (v) => 740 - (v - 45) * 9.5;
    let d = '';
    P.forEach((p, i) => {
      const x = X(i), y = Y(p[2]);
      if (!i) d = `M${x} ${y}`;
      else { const px = X(i - 1), py = Y(P[i - 1][2]), cx = (px + x) / 2; d += ` C ${cx} ${py}, ${cx} ${y}, ${x} ${y}`; }
      el('line', { x1: x, y1: y, x2: x, y2: 790, class: 's-faint', 'stroke-width': 1.5, 'stroke-dasharray': '3 7' }, s);
    });
    el('line', { x1: 100, y1: 790, x2: 1540, y2: 790, class: 's-line', 'stroke-width': 1.5 }, s);
    el('path', { d, class: 'f-none s-data', 'stroke-width': 4 }, s);
    P.forEach((p, i) => {
      const hi = i >= P.length - DATA.highlight, x = X(i), y = Y(p[2]);
      el('circle', { cx: x, cy: y, r: hi ? 14 : 8, class: 'f-data s-bg', 'stroke-width': 4 }, s);
      el('text', { x, y: y - (hi ? 32 : 22), 'text-anchor': 'middle', class: 'serif ' + (hi ? 'f-ink' : 'f-text'), 'font-size': hi ? 60 : 34 }, s, p[2] + '%');
      el('text', { x, y: 830, 'text-anchor': 'middle', 'font-size': 24, class: hi ? 'f-ink' : 'f-text' }, s, p[0]);
      el('text', { x, y: 862, 'text-anchor': 'middle', 'font-size': 18, class: 'f-dim' }, s, p[1]);
    });

  });
})();
</script>
