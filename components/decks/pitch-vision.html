<style>
  .c-pitch-vision, .c-pitch-vision *, .c-pitch-vision *::before, .c-pitch-vision *::after { box-sizing: border-box; }
  .c-pitch-vision {
    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--ds-surface);
    color: var(--ds-text);
    font-family: var(--ds-font-sans);
  }
  .c-pitch-vision .inner {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    padding: 6cqi;
  }
  .c-pitch-vision .brand {
    display: flex;
    align-items: center;
    gap: 0.6cqi;
    font-size: 1.5cqi;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1;
    color: var(--ds-ink);
  }
  .c-pitch-vision .brand svg { width: 1.7cqi; height: 1.7cqi; fill: none; stroke: var(--ds-ink); stroke-width: 2; stroke-linecap: round; }
  .c-pitch-vision .brand svg .strike { stroke: var(--ds-highlight-line); }
  .c-pitch-vision .num {
    position: absolute;
    right: 6cqi;
    bottom: 2.6cqi;
    font-size: 1cqi;
    line-height: 1;
    color: var(--ds-muted);
    font-variant-numeric: tabular-nums;
  }
  .c-pitch-vision h2 {
    margin: 0;
    font-family: var(--ds-font-display);
    font-size: 4.6cqi;
    font-weight: var(--ds-weight-display);
    letter-spacing: var(--ds-tracking-display);
    line-height: 1.06;
    color: var(--ds-ink);
  }
  .c-pitch-vision .kicker { font-size: 1.5cqi; font-weight: 700; color: var(--ds-muted); }

  .c-pitch-vision .inner { grid-template-rows: auto minmax(0, 1fr) auto; }
  .c-pitch-vision .main { align-self: center; }
  .c-pitch-vision h2 { max-width: 74cqi; font-size: 7cqi; line-height: 1.02; letter-spacing: -0.03em; }
  .c-pitch-vision h2 em { font-style: normal; color: var(--ds-muted); }
  .c-pitch-vision .foot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 1.8cqi; border-top: var(--ds-hairline) solid var(--ds-line); font-size: 1.6cqi; color: var(--ds-muted); }
  .c-pitch-vision .foot b { color: var(--ds-ink); font-weight: 700; }
</style>

<section class="c-pitch-vision" aria-label="Vision slide">
  <div class="inner">
    <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3v14M8 3v14M12 3v14M16 3v14"/><path class="strike" d="M1.5 15.5L18.5 4.5"/></svg>Tallyhouse</div>
    <div class="main">
      <h2>Every small studio runs on books it <em>never has to think about.</em></h2>
    </div>
    <div class="foot"><span><b>Maren Voss</b>, CEO</span><span>maren@tallyhouse.example</span></div>
  </div>
  <div class="num" aria-hidden="true">12</div>
</section>
