<!--
@title Before and after metrics
@group Exhibits
@description Paired bars per metric, before and after, with a delta chip that turns danger when the change is unfavourable. Bars are scaled within each metric.
@tags slide, before after, metrics, delta, comparison, impact, results, exhibit
@preview slide
@added 2026-10-31
-->
<style>
  .c-before-after-metrics {
    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--ds-surface);
    color: var(--ds-text);
    font-family: var(--ds-font-sans);
  }
  .c-before-after-metrics .inner {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    row-gap: 1.4cqi;
    padding: 5cqi 6cqi;
  }
  .c-before-after-metrics .top { display: flex; align-items: center; justify-content: space-between; gap: 2cqi; }
  .c-before-after-metrics .kicker { margin: 0; font-size: 1.25cqi; font-weight: 600; line-height: 1.3; color: var(--ds-muted); }
  .c-before-after-metrics .tracker { display: flex; gap: 0.5cqi; margin: 0; padding: 0; list-style: none; }
  .c-before-after-metrics .tracker li { padding: 0.3cqi 0.9cqi; border-radius: var(--ds-radius-pill); background: var(--ds-panel); font-size: 1cqi; font-weight: 600; line-height: 1.2; color: var(--ds-muted); }
  .c-before-after-metrics .tracker li.is-on { background: var(--ds-highlight-fill); box-shadow: inset 0 0 0 1px var(--ds-highlight-line); color: var(--ds-ink); }
  .c-before-after-metrics h2 {
    margin: 0.9cqi 0 0;
    font-family: var(--ds-font-display);
    font-size: 2.6cqi;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--ds-ink);
    text-wrap: balance;
  }
  .c-before-after-metrics .exhibit { min-height: 0; }
  .c-before-after-metrics .frame { position: relative; width: 100%; aspect-ratio: 880 / 315; }
  .c-before-after-metrics svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: visible; }
  .c-before-after-metrics svg text { font-family: var(--ds-font-sans); fill: var(--ds-text); font-variant-numeric: tabular-nums; }
  .c-before-after-metrics .grid { stroke: var(--ds-line); stroke-width: 1; }
  .c-before-after-metrics .axis { stroke: var(--ds-muted); stroke-width: 1.2; }
  .c-before-after-metrics .tick { fill: var(--ds-muted); font-size: 12px; }
  .c-before-after-metrics .sm { font-size: 12px; }
  .c-before-after-metrics .md { font-size: 13px; }
  .c-before-after-metrics .lg { font-size: 14px; }
  .c-before-after-metrics .b { font-weight: 700; }
  .c-before-after-metrics .sb { font-weight: 600; }
  .c-before-after-metrics .ink { fill: var(--ds-ink); }
  .c-before-after-metrics .mu { fill: var(--ds-muted); }
  .c-before-after-metrics .mid { text-anchor: middle; }
  .c-before-after-metrics .end { text-anchor: end; }
  .c-before-after-metrics .halo { paint-order: stroke; stroke: var(--ds-surface); stroke-width: 4px; stroke-linejoin: round; }
  .c-before-after-metrics .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 3cqi;
    padding-top: 0.9cqi;
    border-top: var(--ds-hairline) solid var(--ds-line);
    font-size: 0.95cqi;
    line-height: 1.4;
    color: var(--ds-muted);
  }
  .c-before-after-metrics .page { flex: none; font-weight: 600; color: var(--ds-text); font-variant-numeric: tabular-nums; }

</style>
