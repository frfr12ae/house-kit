<!--
@title Keynote demo cue
@group Keynote
@description A "Live demo" interstitial with a pulsing live dot and a countdown ring that runs down from five, to cue the switch to the stage laptop.
@tags keynote, demo, live, countdown, ring, interstitial, pulse
@preview slide
@replay true
@added 2026-10-31
-->
<style>
  .c-keynote-demo-cue, .c-keynote-demo-cue *, .c-keynote-demo-cue *::before, .c-keynote-demo-cue *::after { box-sizing: border-box; }
.c-keynote-demo-cue {
  --k-bg: var(--ds-ink);
  --k-fg: var(--ds-bg);
  --k-dim: color-mix(in srgb, var(--ds-bg) 60%, var(--ds-ink));
  --k-soft: color-mix(in srgb, var(--ds-bg) 82%, var(--ds-ink));
  --k-line: color-mix(in srgb, var(--ds-bg) 16%, transparent);
  --k-card: color-mix(in srgb, var(--ds-bg) 7%, var(--ds-ink));
  --k-card-2: color-mix(in srgb, var(--ds-bg) 12%, var(--ds-ink));
  --k-blue: var(--ds-info-line);
  --k-amber: var(--ds-highlight-line);
  --k-green: var(--ds-note-line);
  --k-t1: color-mix(in srgb, var(--ds-info-line) 80%, var(--ds-bg));
  --k-t2: color-mix(in srgb, var(--ds-highlight-line) 80%, var(--ds-bg));
  --k-t3: color-mix(in srgb, var(--ds-note-line) 80%, var(--ds-bg));
  --k-s1: color-mix(in srgb, var(--ds-info-line) 66%, var(--ds-bg));
  --k-s2: color-mix(in srgb, var(--ds-highlight-line) 66%, var(--ds-bg));
  --k-s3: color-mix(in srgb, var(--ds-note-line) 66%, var(--ds-bg));
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  overflow: hidden;
  background: var(--k-bg);
  color: var(--k-fg);
  font-family: var(--ds-font-sans);
  -webkit-font-smoothing: antialiased;
}
.c-keynote-demo-cue .sky {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(70% 60% at 50% 118%, color-mix(in srgb, var(--k-blue) 24%, transparent), transparent 70%),
    radial-gradient(50% 45% at 94% -8%, color-mix(in srgb, var(--k-amber) 14%, transparent), transparent 70%),
    radial-gradient(45% 40% at 2% 30%, color-mix(in srgb, var(--k-green) 8%, transparent), transparent 70%);
}
.c-keynote-demo-cue .pad { position: absolute; inset: 0; padding: 5.5cqi 7cqi; }
.c-keynote-demo-cue .eyebrow { margin: 0; font-size: 1.3cqi; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--k-dim); }
.c-keynote-demo-cue .display {
  margin: 0;
  font-family: var(--ds-font-display);
  font-weight: var(--ds-weight-display);
  letter-spacing: var(--ds-tracking-display);
  line-height: 1.02;
  color: var(--k-fg);
}
.c-keynote-demo-cue .grad {
  display: inline-block;
  padding: 0 0.04em 0.1em 0;
  margin: 0 -0.04em -0.1em 0;
  background: linear-gradient(100deg, var(--k-t1) 0%, var(--k-t3) 52%, var(--k-t2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
.c-keynote-demo-cue.is-armed .rv { opacity: 0; transform: translateY(1.8cqi); }
.c-keynote-demo-cue.is-armed.is-in .rv {
  opacity: 1;
  transform: none;
  transition: opacity var(--ds-dur-slow) var(--ds-ease), transform var(--ds-dur-slow) var(--ds-ease);
  transition-delay: calc(var(--d, 0) * 110ms);
}
  .c-keynote-demo-cue .sky {
    background:
      radial-gradient(44% 56% at 50% 36%, color-mix(in srgb, var(--k-blue) 24%, transparent), transparent 70%),
      radial-gradient(40% 40% at 100% 100%, color-mix(in srgb, var(--k-amber) 12%, transparent), transparent 70%),
      radial-gradient(40% 40% at 0% 100%, color-mix(in srgb, var(--k-green) 12%, transparent), transparent 70%);
  }
  .c-keynote-demo-cue .center { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 2.4cqi; padding: 3cqi 7cqi 0; text-align: center; }
  .c-keynote-demo-cue .ring { position: relative; width: 17cqi; height: 17cqi; }
  .c-keynote-demo-cue .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .c-keynote-demo-cue .ring .track { fill: none; stroke: var(--k-line); stroke-width: 2; }
  .c-keynote-demo-cue .ring .arc {
    fill: none;
    stroke: url(#c-keynote-demo-cue-grad);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 276.46;
    stroke-dashoffset: 69;
    filter: drop-shadow(0 0 2.4px color-mix(in srgb, var(--k-blue) 80%, transparent));
  }
  .c-keynote-demo-cue.is-armed .arc { stroke-dashoffset: 0; }
  .c-keynote-demo-cue.is-armed.is-in .arc { animation: c-keynote-demo-cue-run 5s linear forwards; }
  @keyframes c-keynote-demo-cue-run { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 276.46; } }
  .c-keynote-demo-cue .count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--ds-font-display); font-size: 7cqi; font-weight: var(--ds-weight-display); letter-spacing: var(--ds-tracking-display); line-height: 1; font-variant-numeric: tabular-nums; color: var(--k-fg); }
  .c-keynote-demo-cue h2 { display: inline-flex; align-items: center; gap: 4cqi; font-size: 11cqi; line-height: 1; }
  .c-keynote-demo-cue .live { position: relative; flex: none; width: 2.6cqi; height: 2.6cqi; border-radius: 50%; background: var(--k-green); box-shadow: 0 0 3cqi color-mix(in srgb, var(--k-green) 70%, transparent); }
  .c-keynote-demo-cue .live::before, .c-keynote-demo-cue .live::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 0.2cqi solid var(--k-green); animation: c-keynote-demo-cue-pulse 1800ms var(--ds-ease) infinite; }
  .c-keynote-demo-cue .live::after { animation-delay: 900ms; }
  @keyframes c-keynote-demo-cue-pulse { from { transform: scale(1); opacity: 0.8; } to { transform: scale(2.8); opacity: 0; } }
  .c-keynote-demo-cue .sub { margin: 0; font-size: 2.2cqi; color: var(--k-dim); }
  @media (prefers-reduced-motion: reduce) {
    .c-keynote-demo-cue .live::before, .c-keynote-demo-cue .live::after { animation: none; opacity: 0; }
  }
</style>

<section class="c-keynote-demo-cue" aria-label="Live demo, starting in five seconds">
  <div class="sky"></div>
  <div class="center">
    <div class="ring rv" style="--d:0" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="c-keynote-demo-cue-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color: var(--k-blue)"></stop>
            <stop offset="1" style="stop-color: var(--k-green)"></stop>
          </linearGradient>
        </defs>
        <circle class="track" cx="50" cy="50" r="44"></circle>
        <circle class="arc" cx="50" cy="50" r="44"></circle>
      </svg>
      <span class="count">5</span>
    </div>
    <h2 class="display rv" style="--d:1"><span class="live" aria-hidden="true"></span>Live demo</h2>
    <p class="sub rv" style="--d:2">Switching to the stage laptop.</p>
  </div>
</section>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.c-keynote-demo-cue').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    if (reduced) return;
    const count = root.querySelector('.count');
    root.classList.add('is-armed');
    const run = () => {
      let n = 5;
      count.textContent = String(n);
      const timer = setInterval(() => {
        n -= 1;
        if (n <= 0) { count.textContent = 'Go'; clearInterval(timer); return; }
        count.textContent = String(n);
      }, 1000);
    };
    const io = new IntersectionObserver((entries) => {
      if (!entries.some((e) => e.isIntersecting)) return;
      io.disconnect();
      requestAnimationFrame(() => requestAnimationFrame(() => { root.classList.add('is-in'); run(); }));
    }, { threshold: 0.35 });
    io.observe(root);
  });
})();
</script>
