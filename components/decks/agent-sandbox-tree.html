<style>
.c-agent-sandbox-tree, .c-agent-sandbox-tree *, .c-agent-sandbox-tree *::before, .c-agent-sandbox-tree *::after { box-sizing: border-box; }
.c-agent-sandbox-tree {
  --k-bg: var(--ds-bg);
  --k-panel: color-mix(in srgb, var(--ds-ink) 4%, var(--ds-panel));
  --k-raised: color-mix(in srgb, var(--ds-ink) 7%, var(--ds-raised));
  --k-code: var(--ds-surface);
  --k-ink: var(--ds-ink);
  --k-text: var(--ds-text);
  --k-dim: var(--ds-muted);
  --k-faint: color-mix(in srgb, var(--ds-muted) 45%, var(--ds-bg));
  --k-line: var(--ds-line);
  --k-path: var(--ds-highlight-line);
  --k-pass: var(--ds-note-line);
  --k-passfill: var(--ds-note-fill);
  --k-fail: var(--ds-danger-line);
  --k-failfill: var(--ds-danger-fill);
  --k-human: var(--ds-info-line);
  --k-data: var(--ds-series-1);
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  overflow: hidden;
  border-radius: var(--ds-radius-lg);
  background-color: var(--k-bg);
  background-image: radial-gradient(circle, color-mix(in srgb, var(--ds-ink) 7%, transparent) 0.07cqi, transparent 0.09cqi);
  background-size: 1.4cqi 1.4cqi;
  color: var(--k-ink);
  font-family: var(--ds-font-sans);
}
.c-agent-sandbox-tree svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.c-agent-sandbox-tree text { font-family: var(--ds-font-sans); }
.c-agent-sandbox-tree .serif { font-family: var(--ds-font-display); font-weight: var(--ds-weight-display); letter-spacing: var(--ds-tracking-display); }
.c-agent-sandbox-tree .mono, .c-agent-sandbox-tree .mono text { font-family: var(--ds-font-mono); }
.c-agent-sandbox-tree .f-none { fill: none; }
.c-agent-sandbox-tree .f-bg { fill: var(--k-bg); }
.c-agent-sandbox-tree .f-panel { fill: var(--k-panel); }
.c-agent-sandbox-tree .f-raised { fill: var(--k-raised); }
.c-agent-sandbox-tree .f-code { fill: var(--k-code); }
.c-agent-sandbox-tree .f-ink { fill: var(--k-ink); }
.c-agent-sandbox-tree .f-text { fill: var(--k-text); }
.c-agent-sandbox-tree .f-dim { fill: var(--k-dim); }
.c-agent-sandbox-tree .f-faint { fill: var(--k-faint); }
.c-agent-sandbox-tree .f-line { fill: var(--k-line); }
.c-agent-sandbox-tree .f-path { fill: var(--k-path); }
.c-agent-sandbox-tree .f-pass { fill: var(--k-pass); }
.c-agent-sandbox-tree .f-passfill { fill: var(--k-passfill); }
.c-agent-sandbox-tree .f-fail { fill: var(--k-fail); }
.c-agent-sandbox-tree .f-failfill { fill: var(--k-failfill); }
.c-agent-sandbox-tree .f-human { fill: var(--k-human); }
.c-agent-sandbox-tree .f-data { fill: var(--k-data); }
.c-agent-sandbox-tree .s-bg { stroke: var(--k-bg); }
.c-agent-sandbox-tree .s-panel { stroke: var(--k-panel); }
.c-agent-sandbox-tree .s-raised { stroke: var(--k-raised); }
.c-agent-sandbox-tree .s-code { stroke: var(--k-code); }
.c-agent-sandbox-tree .s-ink { stroke: var(--k-ink); }
.c-agent-sandbox-tree .s-text { stroke: var(--k-text); }
.c-agent-sandbox-tree .s-dim { stroke: var(--k-dim); }
.c-agent-sandbox-tree .s-faint { stroke: var(--k-faint); }
.c-agent-sandbox-tree .s-line { stroke: var(--k-line); }
.c-agent-sandbox-tree .s-path { stroke: var(--k-path); }
.c-agent-sandbox-tree .s-pass { stroke: var(--k-pass); }
.c-agent-sandbox-tree .s-passfill { stroke: var(--k-passfill); }
.c-agent-sandbox-tree .s-fail { stroke: var(--k-fail); }
.c-agent-sandbox-tree .s-failfill { stroke: var(--k-failfill); }
.c-agent-sandbox-tree .s-human { stroke: var(--k-human); }
.c-agent-sandbox-tree .s-data { stroke: var(--k-data); }
</style>

<section class="c-agent-sandbox-tree" aria-label="npm test runs code you did not write; inside the sandbox, reading .env, reading ssh keys and reaching an unknown host are blocked">
  <svg viewBox="0 0 1600 900" role="img" aria-label="npm test runs code you did not write; inside the sandbox, reading .env, reading ssh keys and reaching an unknown host are blocked"></svg>
</section>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const check = (p, x, y, s, state) => {
    const g = el('g', {}, p);
    if (state === 'done' || state === 'fail') {
      el('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: s * 0.18, class: state === 'done' ? 'f-pass' : 'f-fail' }, g);
      const d = state === 'done'
        ? `M${x - s * 0.25} ${y} l${s * 0.17} ${s * 0.17} l${s * 0.33} ${-s * 0.33}`
        : `M${x - s * 0.2} ${y - s * 0.2} L${x + s * 0.2} ${y + s * 0.2} M${x + s * 0.2} ${y - s * 0.2} L${x - s * 0.2} ${y + s * 0.2}`;
      el('path', { d, class: 'f-none s-bg', 'stroke-width': s * 0.12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    } else {
      el('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: s * 0.18, class: 'f-bg ' + (state === 'bad' ? 's-fail' : 's-pass'), 'stroke-width': Math.max(1.5, s * 0.07) }, g);
    }
    return g;
  };
  const person = (p, x, y, r, tone) => {
    tone = tone || 'human';
    const g = el('g', {}, p);
    el('circle', { cx: x, cy: y, r, class: 'f-bg s-' + tone, 'stroke-width': r * 0.12 }, g);
    el('circle', { cx: x, cy: y - r * 0.2, r: r * 0.28, class: 'f-' + tone }, g);
    el('path', { d: `M${x - r * 0.55} ${y + r * 0.62} a${r * 0.55} ${r * 0.5} 0 0 1 ${r * 1.1} 0`, class: 'f-' + tone }, g);
    return g;
  };
  const spark = (p, x, y, r) => {
    const g = el('g', { class: 's-path', 'stroke-width': r * 0.18, 'stroke-linecap': 'round' }, p);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + Math.PI / 8;
      const l = i % 2 ? r * 0.72 : r;
      el('line', { x1: x + Math.cos(a) * r * 0.2, y1: y + Math.sin(a) * r * 0.2, x2: x + Math.cos(a) * l, y2: y + Math.sin(a) * l }, g);
    }
    return g;
  };
  const chip = (p, x, y, verb, arg, o) => {
    o = o || {};
    const fs = o.fs || 20;
    const pad = 10;
    const w = (verb.length + (arg ? arg.length + 1 : 0) + (o.mark ? 2 : 0)) * fs * 0.6 + pad * 2;
    const g = el('g', { class: 'mono' }, p);
    el('rect', { x: x - w / 2, y: y - fs * 0.9, width: w, height: fs * 1.8, rx: 6, class: o.danger ? 'f-failfill s-fail' : 'f-raised s-line', 'stroke-width': 1 }, g);
    const t = el('text', { x: x - w / 2 + pad, y: y + fs * 0.35, 'font-size': fs, class: o.danger ? 'f-fail' : 'f-ink' }, g, verb);
    if (arg) el('tspan', { class: o.danger ? 'f-fail' : 'f-dim' }, t, ' ' + arg);
    if (o.mark) el('tspan', { class: o.danger ? 'f-fail' : 'f-text' }, t, ' ' + o.mark);
    return g;
  };
  const bubble = (p, x, y, txt, fs, anchor) => {
    fs = fs || 22;
    const w = txt.length * fs * 0.52 + 28;
    const x0 = anchor === 'end' ? x - w : x;
    el('rect', { x: x0, y: y - fs * 1.05, width: w, height: fs * 2, rx: 8, class: 'f-panel' }, p);
    el('text', { x: x0 + 14, y: y + fs * 0.3, 'font-size': fs, class: 'f-ink' }, p, txt);
  };
  const wave = (x0, x1, yc, amp, waves) => {
    let d = '';
    for (let i = 0; i <= 160; i++) {
      const t = i / 160;
      const x = x0 + (x1 - x0) * t;
      const y = yc - amp * Math.sin(Math.PI * Math.min(1, t * 1.05)) * Math.sin(t * Math.PI * 2 * waves);
      d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
  };
  const waveY = (x, x0, x1, yc, amp, waves) => {
    const t = (x - x0) / (x1 - x0);
    return yc - amp * Math.sin(Math.PI * Math.min(1, t * 1.05)) * Math.sin(t * Math.PI * 2 * waves);
  };
  const baseline = (p, x0, x1, y) => el('line', { x1: x0, y1: y, x2: x1, y2: y, class: 's-faint', 'stroke-width': 2, 'stroke-dasharray': '2 9', 'stroke-linecap': 'round' }, p);
  const startNode = (p, x, y) => el('rect', { x: x - 7, y: y - 7, width: 14, height: 14, rx: 3, class: 'f-bg s-dim', 'stroke-width': 2 }, p);

  document.querySelectorAll('.c-agent-sandbox-tree').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    const s = root.querySelector('svg');

    const DATA = {
      command: ['Bash', 'npm test'], label: 'sandbox', enforced: 'enforced by the operating system',
      rows: [['vitest run', 'the script in package.json', 0], ['src/auth/auth.test.ts', 'your tests', 0], ['node_modules/some-package/index.js', 'code you did not write', 1]],
      targets: [[500, '.env', 'deny rule', 'file'], [800, '~/.ssh', 'deny rule', 'file'], [1100, 'collector.example', 'host not approved', 'host']],
    };
    el('rect', { x: 420, y: 200, width: 760, height: 330, rx: 18, class: 'f-none s-ink', 'stroke-width': 2.5 }, s);
    el('rect', { x: 450, y: 186, width: 120, height: 30, class: 'f-bg' }, s);
    el('text', { x: 460, y: 210, 'font-size': 24, class: 'f-ink' }, s, DATA.label);
    el('rect', { x: 820, y: 186, width: 340, height: 30, class: 'f-bg' }, s);
    el('text', { x: 830, y: 210, 'font-size': 21, class: 'f-text' }, s, DATA.enforced);
    chip(s, 800, 150, DATA.command[0], DATA.command[1], { fs: 22 });
    el('rect', { x: 450, y: 240, width: 700, height: 260, rx: 10, class: 'f-code' }, s);
    el('text', { x: 475, y: 280, 'font-size': 18, class: 'f-dim' }, s, 'What ' + DATA.command[1] + ' runs');
    DATA.rows.forEach(([a, b, risky], i) => {
      const y = 330 + i * 55;
      if (risky) el('rect', { x: 455, y: y - 35, width: 690, height: 52, class: 'f-failfill' }, s);
      el('text', { x: 475, y, 'font-size': 22, class: 'mono f-ink' }, s, a);
      el('text', { x: 1130, y, 'text-anchor': 'end', 'font-size': 18, class: risky ? 'f-fail' : 'f-dim' }, s, b);
    });
    DATA.targets.forEach(([x, label, why, kind]) => {
      el('path', { d: `M800 500 V560 H${x} V680`, class: 'f-none s-fail', 'stroke-width': 2.5 }, s);
      el('circle', { cx: x, cy: 530, r: 15, class: 'f-fail' }, s);
      el('path', { d: `M${x - 6} 524 l12 12 M${x + 6} 524 l-12 12`, class: 's-bg', 'stroke-width': 3, 'stroke-linecap': 'round' }, s);
      if (kind === 'file') el('path', { d: `M${x - 18} 690 h26 l12 12 v40 h-38z`, class: 'f-none s-fail', 'stroke-width': 2.5 }, s);
      else { el('rect', { x: x - 22, y: 690, width: 44, height: 22, rx: 4, class: 'f-none s-fail', 'stroke-width': 2.5 }, s); el('rect', { x: x - 22, y: 718, width: 44, height: 22, rx: 4, class: 'f-none s-fail', 'stroke-width': 2.5 }, s); }
      el('text', { x, y: 785, 'text-anchor': 'middle', 'font-size': 24, class: 'mono f-ink' }, s, label);
      el('text', { x, y: 820, 'text-anchor': 'middle', 'font-size': 19, class: 'f-fail' }, s, why);
    });

  });
})();
</script>
