<!--
@title People vs machine waffle
@group Agent sessions
@description Two grids of 100: person glyphs on the left with the share people caught, dots on the right with the share that slipped through. Use to compare a human rate with an automated one.
@tags waffle, icon array, comparison, percentage, safety, review
@preview slide
@added 2026-11-17
@source Lydia Hallie, "Rethinking Claude Code Best Practices", AI Engineer 2026 | https://www.youtube.com/watch?v=vlfCjWuv4es | inspired-by
-->
<style>
.c-agent-waffle-compare, .c-agent-waffle-compare *, .c-agent-waffle-compare *::before, .c-agent-waffle-compare *::after { box-sizing: border-box; }
.c-agent-waffle-compare {
  --k-bg: var(--ds-bg);
  --k-panel: color-mix(in srgb, var(--ds-ink) 4%, var(--ds-panel));
  --k-raised: color-mix(in srgb, var(--ds-ink) 7%, var(--ds-raised));
  --k-code: var(--ds-surface);
  --k-ink: var(--ds-ink);
  --k-text: var(--ds-text);
  --k-dim: var(--ds-muted);
  --k-faint: color-mix(in srgb, var(--ds-muted) 45%, var(--ds-bg));
  --k-line: var(--ds-line);
  --k-path: var(--ds-highlight-line);
  --k-pass: var(--ds-note-line);
  --k-passfill: var(--ds-note-fill);
  --k-fail: var(--ds-danger-line);
  --k-failfill: var(--ds-danger-fill);
  --k-human: var(--ds-info-line);
  --k-data: var(--ds-series-1);
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  overflow: hidden;
  border-radius: var(--ds-radius-lg);
  background-color: var(--k-bg);
  background-image: radial-gradient(circle, color-mix(in srgb, var(--ds-ink) 7%, transparent) 0.07cqi, transparent 0.09cqi);
  background-size: 1.4cqi 1.4cqi;
  color: var(--k-ink);
  font-family: var(--ds-font-sans);
}
.c-agent-waffle-compare svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.c-agent-waffle-compare text { font-family: var(--ds-font-sans); }
.c-agent-waffle-compare .serif { font-family: var(--ds-font-display); font-weight: var(--ds-weight-display); letter-spacing: var(--ds-tracking-display); }
.c-agent-waffle-compare .mono, .c-agent-waffle-compare .mono text { font-family: var(--ds-font-mono); }
.c-agent-waffle-compare .f-none { fill: none; }
.c-agent-waffle-compare .f-bg { fill: var(--k-bg); }
.c-agent-waffle-compare .f-panel { fill: var(--k-panel); }
.c-agent-waffle-compare .f-raised { fill: var(--k-raised); }
.c-agent-waffle-compare .f-code { fill: var(--k-code); }
.c-agent-waffle-compare .f-ink { fill: var(--k-ink); }
.c-agent-waffle-compare .f-text { fill: var(--k-text); }
.c-agent-waffle-compare .f-dim { fill: var(--k-dim); }
.c-agent-waffle-compare .f-faint { fill: var(--k-faint); }
.c-agent-waffle-compare .f-line { fill: var(--k-line); }
.c-agent-waffle-compare .f-path { fill: var(--k-path); }
.c-agent-waffle-compare .f-pass { fill: var(--k-pass); }
.c-agent-waffle-compare .f-passfill { fill: var(--k-passfill); }
.c-agent-waffle-compare .f-fail { fill: var(--k-fail); }
.c-agent-waffle-compare .f-failfill { fill: var(--k-failfill); }
.c-agent-waffle-compare .f-human { fill: var(--k-human); }
.c-agent-waffle-compare .f-data { fill: var(--k-data); }
.c-agent-waffle-compare .s-bg { stroke: var(--k-bg); }
.c-agent-waffle-compare .s-panel { stroke: var(--k-panel); }
.c-agent-waffle-compare .s-raised { stroke: var(--k-raised); }
.c-agent-waffle-compare .s-code { stroke: var(--k-code); }
.c-agent-waffle-compare .s-ink { stroke: var(--k-ink); }
.c-agent-waffle-compare .s-text { stroke: var(--k-text); }
.c-agent-waffle-compare .s-dim { stroke: var(--k-dim); }
.c-agent-waffle-compare .s-faint { stroke: var(--k-faint); }
.c-agent-waffle-compare .s-line { stroke: var(--k-line); }
.c-agent-waffle-compare .s-path { stroke: var(--k-path); }
.c-agent-waffle-compare .s-pass { stroke: var(--k-pass); }
.c-agent-waffle-compare .s-passfill { stroke: var(--k-passfill); }
.c-agent-waffle-compare .s-fail { stroke: var(--k-fail); }
.c-agent-waffle-compare .s-failfill { stroke: var(--k-failfill); }
.c-agent-waffle-compare .s-human { stroke: var(--k-human); }
.c-agent-waffle-compare .s-data { stroke: var(--k-data); }
</style>

<section class="c-agent-waffle-compare" aria-label="14 percent caught by reviewers; 1 in 10 still went through">
  <svg viewBox="0 0 1600 900" role="img" aria-label="14 percent caught by reviewers; 1 in 10 still went through"></svg>
</section>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const check = (p, x, y, s, state) => {
    const g = el('g', {}, p);
    if (state === 'done' || state === 'fail') {
      el('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: s * 0.18, class: state === 'done' ? 'f-pass' : 'f-fail' }, g);
      const d = state === 'done'
        ? `M${x - s * 0.25} ${y} l${s * 0.17} ${s * 0.17} l${s * 0.33} ${-s * 0.33}`
        : `M${x - s * 0.2} ${y - s * 0.2} L${x + s * 0.2} ${y + s * 0.2} M${x + s * 0.2} ${y - s * 0.2} L${x - s * 0.2} ${y + s * 0.2}`;
      el('path', { d, class: 'f-none s-bg', 'stroke-width': s * 0.12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    } else {
      el('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: s * 0.18, class: 'f-bg ' + (state === 'bad' ? 's-fail' : 's-pass'), 'stroke-width': Math.max(1.5, s * 0.07) }, g);
    }
    return g;
  };
  const person = (p, x, y, r, tone) => {
    tone = tone || 'human';
    const g = el('g', {}, p);
    el('circle', { cx: x, cy: y, r, class: 'f-bg s-' + tone, 'stroke-width': r * 0.12 }, g);
    el('circle', { cx: x, cy: y - r * 0.2, r: r * 0.28, class: 'f-' + tone }, g);
    el('path', { d: `M${x - r * 0.55} ${y + r * 0.62} a${r * 0.55} ${r * 0.5} 0 0 1 ${r * 1.1} 0`, class: 'f-' + tone }, g);
    return g;
  };
  const spark = (p, x, y, r) => {
    const g = el('g', { class: 's-path', 'stroke-width': r * 0.18, 'stroke-linecap': 'round' }, p);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + Math.PI / 8;
      const l = i % 2 ? r * 0.72 : r;
      el('line', { x1: x + Math.cos(a) * r * 0.2, y1: y + Math.sin(a) * r * 0.2, x2: x + Math.cos(a) * l, y2: y + Math.sin(a) * l }, g);
    }
    return g;
  };
  const chip = (p, x, y, verb, arg, o) => {
    o = o || {};
    const fs = o.fs || 20;
    const pad = 10;
    const w = (verb.length + (arg ? arg.length + 1 : 0) + (o.mark ? 2 : 0)) * fs * 0.6 + pad * 2;
    const g = el('g', { class: 'mono' }, p);
    el('rect', { x: x - w / 2, y: y - fs * 0.9, width: w, height: fs * 1.8, rx: 6, class: o.danger ? 'f-failfill s-fail' : 'f-raised s-line', 'stroke-width': 1 }, g);
    const t = el('text', { x: x - w / 2 + pad, y: y + fs * 0.35, 'font-size': fs, class: o.danger ? 'f-fail' : 'f-ink' }, g, verb);
    if (arg) el('tspan', { class: o.danger ? 'f-fail' : 'f-dim' }, t, ' ' + arg);
    if (o.mark) el('tspan', { class: o.danger ? 'f-fail' : 'f-text' }, t, ' ' + o.mark);
    return g;
  };
  const bubble = (p, x, y, txt, fs, anchor) => {
    fs = fs || 22;
    const w = txt.length * fs * 0.52 + 28;
    const x0 = anchor === 'end' ? x - w : x;
    el('rect', { x: x0, y: y - fs * 1.05, width: w, height: fs * 2, rx: 8, class: 'f-panel' }, p);
    el('text', { x: x0 + 14, y: y + fs * 0.3, 'font-size': fs, class: 'f-ink' }, p, txt);
  };
  const wave = (x0, x1, yc, amp, waves) => {
    let d = '';
    for (let i = 0; i <= 160; i++) {
      const t = i / 160;
      const x = x0 + (x1 - x0) * t;
      const y = yc - amp * Math.sin(Math.PI * Math.min(1, t * 1.05)) * Math.sin(t * Math.PI * 2 * waves);
      d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
  };
  const waveY = (x, x0, x1, yc, amp, waves) => {
    const t = (x - x0) / (x1 - x0);
    return yc - amp * Math.sin(Math.PI * Math.min(1, t * 1.05)) * Math.sin(t * Math.PI * 2 * waves);
  };
  const baseline = (p, x0, x1, y) => el('line', { x1: x0, y1: y, x2: x1, y2: y, class: 's-faint', 'stroke-width': 2, 'stroke-dasharray': '2 9', 'stroke-linecap': 'round' }, p);
  const startNode = (p, x, y) => el('rect', { x: x - 7, y: y - 7, width: 14, height: 14, rx: 3, class: 'f-bg s-dim', 'stroke-width': 2 }, p);

  document.querySelectorAll('.c-agent-waffle-compare').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    const s = root.querySelector('svg');

    const DATA = {
      left: ['14%', 'caught by reviewers'], right: ['1 in 10', 'still went through'],
      caught: [5, 13, 22, 24, 31, 36, 44, 45, 57, 59, 66, 71, 83, 88],
      slipped: [2, 16, 28, 33, 47, 52, 61, 63, 79, 94],
      source: '400 review sessions, one unsafe command planted in each. Internal study, 2026.',
    };
    const caught = new Set(DATA.caught), slipped = new Set(DATA.slipped);
    el('rect', { x: 70, y: 60, width: 1460, height: 780, rx: 22, class: 'f-panel' }, s);
    el('text', { x: 140, y: 230, class: 'serif f-human', 'font-size': 150 }, s, DATA.left[0]);
    el('text', { x: 145, y: 290, 'font-size': 32, class: 'f-ink' }, s, DATA.left[1]);
    el('text', { x: 850, y: 230, class: 'serif f-ink', 'font-size': 150 }, s, DATA.right[0]);
    el('text', { x: 855, y: 290, 'font-size': 32, class: 'f-ink' }, s, DATA.right[1]);
    for (let i = 0; i < 100; i++) {
      const c = i % 20, r = Math.floor(i / 20);
      person(s, 150 + c * 32, 380 + r * 56, 11, caught.has(i) ? 'human' : 'faint');
      el('circle', { cx: 860 + c * 32, cy: 380 + r * 56, r: 11, class: slipped.has(i) ? 'f-fail' : 'f-line' }, s);
    }
    el('text', { x: 140, y: 790, 'font-size': 19, class: 'f-dim' }, s, DATA.source);

  });
})();
</script>
