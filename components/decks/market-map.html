<!--
@title Market map (Marimekko)
@group Exhibits
@description A Marimekko of market segments: column width is segment size, stacked bars are player share, every cell carries a percentage label and players are named directly.
@tags slide, marimekko, market map, share, segments, competition, chart, exhibit
@preview slide
@added 2026-10-31
-->
<style>
  .c-market-map {
    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--ds-surface);
    color: var(--ds-text);
    font-family: var(--ds-font-sans);
  }
  .c-market-map .inner {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    row-gap: 1.4cqi;
    padding: 5cqi 6cqi;
  }
  .c-market-map .top { display: flex; align-items: center; justify-content: space-between; gap: 2cqi; }
  .c-market-map .kicker { margin: 0; font-size: 1.25cqi; font-weight: 600; line-height: 1.3; color: var(--ds-muted); }
  .c-market-map .tracker { display: flex; gap: 0.5cqi; margin: 0; padding: 0; list-style: none; }
  .c-market-map .tracker li { padding: 0.3cqi 0.9cqi; border-radius: var(--ds-radius-pill); background: var(--ds-panel); font-size: 1cqi; font-weight: 600; line-height: 1.2; color: var(--ds-muted); }
  .c-market-map .tracker li.is-on { background: var(--ds-highlight-fill); box-shadow: inset 0 0 0 1px var(--ds-highlight-line); color: var(--ds-ink); }
  .c-market-map h2 {
    margin: 0.9cqi 0 0;
    font-family: var(--ds-font-display);
    font-size: 2.6cqi;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--ds-ink);
    text-wrap: balance;
  }
  .c-market-map .exhibit { min-height: 0; }
  .c-market-map .frame { position: relative; width: 100%; aspect-ratio: 880 / 315; }
  .c-market-map svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: visible; }
  .c-market-map svg text { font-family: var(--ds-font-sans); fill: var(--ds-text); font-variant-numeric: tabular-nums; }
  .c-market-map .grid { stroke: var(--ds-line); stroke-width: 1; }
  .c-market-map .axis { stroke: var(--ds-muted); stroke-width: 1.2; }
  .c-market-map .tick { fill: var(--ds-muted); font-size: 12px; }
  .c-market-map .sm { font-size: 12px; }
  .c-market-map .md { font-size: 13px; }
  .c-market-map .lg { font-size: 14px; }
  .c-market-map .b { font-weight: 700; }
  .c-market-map .sb { font-weight: 600; }
  .c-market-map .ink { fill: var(--ds-ink); }
  .c-market-map .mu { fill: var(--ds-muted); }
  .c-market-map .mid { text-anchor: middle; }
  .c-market-map .end { text-anchor: end; }
  .c-market-map .halo { paint-order: stroke; stroke: var(--ds-surface); stroke-width: 4px; stroke-linejoin: round; }
  .c-market-map .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 3cqi;
    padding-top: 0.9cqi;
    border-top: var(--ds-hairline) solid var(--ds-line);
    font-size: 0.95cqi;
    line-height: 1.4;
    color: var(--ds-muted);
  }
  .c-market-map .page { flex: none; font-weight: 600; color: var(--ds-text); font-variant-numeric: tabular-nums; }

</style>
