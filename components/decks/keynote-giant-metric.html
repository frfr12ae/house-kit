<!--
@title Keynote giant metric
@group Keynote
@description One enormous glowing number that counts down into place, a short label and a comparison chip against the previous version.
@tags keynote, metric, number, stat, glow, comparison, apple event
@preview slide
@replay true
@added 2026-10-31
@source Apple keynote presentation style | https://www.apple.com/apple-events/ | inspired-by
-->
<style>
  .c-keynote-giant-metric, .c-keynote-giant-metric *, .c-keynote-giant-metric *::before, .c-keynote-giant-metric *::after { box-sizing: border-box; }
.c-keynote-giant-metric {
  --k-bg: var(--ds-ink);
  --k-fg: var(--ds-bg);
  --k-dim: color-mix(in srgb, var(--ds-bg) 60%, var(--ds-ink));
  --k-soft: color-mix(in srgb, var(--ds-bg) 82%, var(--ds-ink));
  --k-line: color-mix(in srgb, var(--ds-bg) 16%, transparent);
  --k-card: color-mix(in srgb, var(--ds-bg) 7%, var(--ds-ink));
  --k-card-2: color-mix(in srgb, var(--ds-bg) 12%, var(--ds-ink));
  --k-blue: var(--ds-info-line);
  --k-amber: var(--ds-highlight-line);
  --k-green: var(--ds-note-line);
  --k-t1: color-mix(in srgb, var(--ds-info-line) 80%, var(--ds-bg));
  --k-t2: color-mix(in srgb, var(--ds-highlight-line) 80%, var(--ds-bg));
  --k-t3: color-mix(in srgb, var(--ds-note-line) 80%, var(--ds-bg));
  --k-s1: color-mix(in srgb, var(--ds-info-line) 66%, var(--ds-bg));
  --k-s2: color-mix(in srgb, var(--ds-highlight-line) 66%, var(--ds-bg));
  --k-s3: color-mix(in srgb, var(--ds-note-line) 66%, var(--ds-bg));
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  overflow: hidden;
  background: var(--k-bg);
  color: var(--k-fg);
  font-family: var(--ds-font-sans);
  -webkit-font-smoothing: antialiased;
}
.c-keynote-giant-metric .sky {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(70% 60% at 50% 118%, color-mix(in srgb, var(--k-blue) 24%, transparent), transparent 70%),
    radial-gradient(50% 45% at 94% -8%, color-mix(in srgb, var(--k-amber) 14%, transparent), transparent 70%),
    radial-gradient(45% 40% at 2% 30%, color-mix(in srgb, var(--k-green) 8%, transparent), transparent 70%);
}
.c-keynote-giant-metric .pad { position: absolute; inset: 0; padding: 5.5cqi 7cqi; }
.c-keynote-giant-metric .eyebrow { margin: 0; font-size: 1.3cqi; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--k-dim); }
.c-keynote-giant-metric .display {
  margin: 0;
  font-family: var(--ds-font-display);
  font-weight: var(--ds-weight-display);
  letter-spacing: var(--ds-tracking-display);
  line-height: 1.02;
  color: var(--k-fg);
}
.c-keynote-giant-metric .grad {
  display: inline-block;
  padding: 0 0.04em 0.1em 0;
  margin: 0 -0.04em -0.1em 0;
  background: linear-gradient(100deg, var(--k-t1) 0%, var(--k-t3) 52%, var(--k-t2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
.c-keynote-giant-metric.is-armed .rv { opacity: 0; transform: translateY(1.8cqi); }
.c-keynote-giant-metric.is-armed.is-in .rv {
  opacity: 1;
  transform: none;
  transition: opacity var(--ds-dur-slow) var(--ds-ease), transform var(--ds-dur-slow) var(--ds-ease);
  transition-delay: calc(var(--d, 0) * 110ms);
}
  .c-keynote-giant-metric .sky {
    background:
      radial-gradient(60% 70% at 50% 48%, color-mix(in srgb, var(--k-blue) 20%, transparent), transparent 70%),
      radial-gradient(36% 40% at 82% 100%, color-mix(in srgb, var(--k-amber) 14%, transparent), transparent 70%),
      radial-gradient(36% 40% at 14% 100%, color-mix(in srgb, var(--k-green) 12%, transparent), transparent 70%);
  }
  .c-keynote-giant-metric .bloom {
    position: absolute;
    left: 50%;
    top: 40%;
    width: 60cqi;
    height: 30cqi;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--k-blue) 36%, transparent), transparent);
    filter: blur(2cqi);
  }
  .c-keynote-giant-metric .center { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 2.4cqi; padding: 4cqi 7cqi 3cqi; text-align: center; }
  .c-keynote-giant-metric .figure { display: flex; align-items: baseline; justify-content: center; gap: 1.2cqi; font-size: 31cqi; line-height: 0.86; font-variant-numeric: tabular-nums; }
  .c-keynote-giant-metric .figure .num { filter: drop-shadow(0 0 4cqi color-mix(in srgb, var(--k-blue) 60%, transparent)); }
  .c-keynote-giant-metric .figure small { font-size: 0.3em; font-weight: 600; letter-spacing: 0; color: var(--k-dim); }
  .c-keynote-giant-metric .label { margin: 0; font-size: 2.6cqi; line-height: 1.3; color: var(--k-soft); }
  .c-keynote-giant-metric .chip {
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 1cqi;
    padding: 1cqi 2.2cqi 1cqi 1.5cqi;
    border: var(--ds-hairline) solid var(--k-line);
    border-radius: var(--ds-radius-pill);
    background: color-mix(in srgb, var(--k-fg) 7%, transparent);
    font-size: 2cqi;
    color: var(--k-soft);
    box-shadow: 0 0 3cqi color-mix(in srgb, var(--k-green) 22%, transparent);
  }
  .c-keynote-giant-metric .chip svg { width: 2.4cqi; height: 2.4cqi; fill: none; stroke: var(--k-s3); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .c-keynote-giant-metric .chip b { color: var(--k-s3); font-weight: 700; }
  .c-keynote-giant-metric .tag { position: absolute; left: 7cqi; top: 5.5cqi; }
  .c-keynote-giant-metric .foot { position: absolute; left: 0; right: 0; bottom: 4cqi; margin: 0; text-align: center; font-size: 1.2cqi; color: var(--k-dim); }
</style>

<section class="c-keynote-giant-metric" aria-label="Sync time 38 milliseconds, 2x faster than Orbit 1">
  <div class="sky"></div>
  <div class="bloom" aria-hidden="true"></div>
  <p class="eyebrow tag">Sync</p>
  <div class="center">
    <div class="figure display rv" style="--d:0"><span class="num grad" data-from="76" data-to="38">38</span><small>ms</small></div>
    <p class="label rv" style="--d:2">median sync time, on any network</p>
    <p class="chip rv" style="--d:3"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span><b>2x</b> faster than Orbit 1</span></p>
  </div>
  <p class="foot">Median of 4.1 million syncs, September 2026. Internal benchmark.</p>
</section>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.c-keynote-giant-metric').forEach((root) => {
    if (reduced) return;
    const num = root.querySelector('.num');
    const from = Number(num.dataset.from);
    const to = Number(num.dataset.to);
    num.textContent = String(from);
    root.classList.add('is-armed');
    const run = () => {
      const t0 = performance.now();
      const dur = 1400;
      const tick = (now) => {
        const p = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3);
        num.textContent = String(Math.round(from + (to - from) * e));
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    };
    const io = new IntersectionObserver((entries) => {
      if (!entries.some((e) => e.isIntersecting)) return;
      io.disconnect();
      requestAnimationFrame(() => requestAnimationFrame(() => { root.classList.add('is-in'); run(); }));
    }, { threshold: 0.35 });
    io.observe(root);
  });
})();
</script>
