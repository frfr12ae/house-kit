<style>
  .c-pitch-business-model, .c-pitch-business-model *, .c-pitch-business-model *::before, .c-pitch-business-model *::after { box-sizing: border-box; }
  .c-pitch-business-model {
    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--ds-surface);
    color: var(--ds-text);
    font-family: var(--ds-font-sans);
  }
  .c-pitch-business-model .inner {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    padding: 6cqi;
  }
  .c-pitch-business-model .brand {
    display: flex;
    align-items: center;
    gap: 0.6cqi;
    font-size: 1.5cqi;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1;
    color: var(--ds-ink);
  }
  .c-pitch-business-model .brand svg { width: 1.7cqi; height: 1.7cqi; fill: none; stroke: var(--ds-ink); stroke-width: 2; stroke-linecap: round; }
  .c-pitch-business-model .brand svg .strike { stroke: var(--ds-highlight-line); }
  .c-pitch-business-model .num {
    position: absolute;
    right: 6cqi;
    bottom: 2.6cqi;
    font-size: 1cqi;
    line-height: 1;
    color: var(--ds-muted);
    font-variant-numeric: tabular-nums;
  }
  .c-pitch-business-model h2 {
    margin: 0;
    font-family: var(--ds-font-display);
    font-size: 4.6cqi;
    font-weight: var(--ds-weight-display);
    letter-spacing: var(--ds-tracking-display);
    line-height: 1.06;
    color: var(--ds-ink);
  }
  .c-pitch-business-model .kicker { font-size: 1.5cqi; font-weight: 700; color: var(--ds-muted); }

  .c-pitch-business-model .main { display: grid; grid-template-rows: auto minmax(0, 1fr); row-gap: 2.6cqi; padding-top: 2.5cqi; align-content: start; }
  .c-pitch-business-model h2 { font-size: 4.2cqi; }
  .c-pitch-business-model .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 5cqi; align-items: start; }
  .c-pitch-business-model .col { display: grid; gap: 1.4cqi; }
  .c-pitch-business-model .tiers { display: grid; gap: 1.2cqi; }
  .c-pitch-business-model .tier { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1cqi; padding: 1.2cqi 2cqi; border: var(--ds-hairline) solid var(--ds-line); border-radius: var(--ds-radius-lg); background: var(--ds-raised); }
  .c-pitch-business-model .tier.pick { border-color: var(--ds-highlight-line); background: var(--ds-highlight-fill); }
  .c-pitch-business-model .tier b { display: block; font-size: 2.1cqi; font-weight: 800; color: var(--ds-ink); }
  .c-pitch-business-model .tier span { font-size: 1.4cqi; color: var(--ds-muted); font-weight: 600; }
  .c-pitch-business-model .tier .price { font-family: var(--ds-font-display); font-size: 3.6cqi; font-weight: var(--ds-weight-display); letter-spacing: var(--ds-tracking-display); color: var(--ds-ink); font-variant-numeric: tabular-nums; }
  .c-pitch-business-model .tier .price small { margin-left: 0.2em; font-size: 0.4em; letter-spacing: 0; color: var(--ds-muted); font-weight: 700; }
  .c-pitch-business-model .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2cqi; }
  .c-pitch-business-model .stat { display: grid; gap: 0.7cqi; align-content: center; padding: 1.5cqi 2cqi; border: var(--ds-hairline) solid var(--ds-line); border-radius: var(--ds-radius-lg); background: var(--ds-panel); }
  .c-pitch-business-model .stat.good { border-color: var(--ds-note-line); background: var(--ds-note-fill); }
  .c-pitch-business-model .stat small { font-size: 1.4cqi; font-weight: 600; color: var(--ds-muted); }
  .c-pitch-business-model .stat.good small { color: var(--ds-text); }
  .c-pitch-business-model .stat b { font-family: var(--ds-font-display); font-size: 4.4cqi; font-weight: var(--ds-weight-display); letter-spacing: var(--ds-tracking-display); line-height: 1; color: var(--ds-ink); font-variant-numeric: tabular-nums; }
  .c-pitch-business-model .stat b i { margin-left: 0.2em; font-style: normal; font-size: 0.4em; letter-spacing: 0; color: var(--ds-muted); }
</style>

<section class="c-pitch-business-model" aria-label="Business model slide">
  <div class="inner">
    <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3v14M8 3v14M12 3v14M16 3v14"/><path class="strike" d="M1.5 15.5L18.5 4.5"/></svg>Tallyhouse</div>
    <div class="main">
      <h2>Simple pricing, fast payback.</h2>
      <div class="cols">
        <div class="col">
          <div class="kicker">Pricing, per studio</div>
          <div class="tiers">
            <div class="tier"><div><b>Solo</b><span>1 to 2 people</span></div><div class="price">$29<small>/mo</small></div></div>
            <div class="tier pick"><div><b>Studio</b><span>3 to 9 people, most chosen</span></div><div class="price">$79<small>/mo</small></div></div>
            <div class="tier"><div><b>Practice</b><span>10 to 20 people</span></div><div class="price">$199<small>/mo</small></div></div>
          </div>
        </div>
        <div class="col">
          <div class="kicker">Unit economics</div>
          <div class="stats">
            <div class="stat"><small>Annual contract value</small><b>$1,150</b></div>
            <div class="stat"><small>Cost to acquire</small><b>$340</b></div>
            <div class="stat good"><small>Payback</small><b>4.3<i>months</i></b></div>
            <div class="stat"><small>Gross margin</small><b>82<i>%</i></b></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="num" aria-hidden="true">7</div>
</section>
