<!--

@group Agent sessions
@description Five cards for the jobs a person does in an agent session. Jobs already handed over dim and name their new owner, and three pills say who takes the rest.

<style>
.c-agent-loop-handoff, .c-agent-loop-handoff *, .c-agent-loop-handoff *::before, .c-agent-loop-handoff *::after { box-sizing: border-box; }
.c-agent-loop-handoff {
  --k-bg: var(--ds-bg);
  --k-panel: color-mix(in srgb, var(--ds-ink) 4%, var(--ds-panel));
  --k-raised: color-mix(in srgb, var(--ds-ink) 7%, var(--ds-raised));
  --k-code: var(--ds-surface);
  --k-ink: var(--ds-ink);
  --k-text: var(--ds-text);
  --k-dim: var(--ds-muted);
  --k-faint: color-mix(in srgb, var(--ds-muted) 45%, var(--ds-bg));
  --k-line: var(--ds-line);
  --k-path: var(--ds-highlight-line);
  --k-pass: var(--ds-note-line);
  --k-passfill: var(--ds-note-fill);
  --k-fail: var(--ds-danger-line);
  --k-failfill: var(--ds-danger-fill);
  --k-human: var(--ds-info-line);
  --k-data: var(--ds-series-1);
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  overflow: hidden;
  border-radius: var(--ds-radius-lg);
  background-color: var(--k-bg);
  background-image: radial-gradient(circle, color-mix(in srgb, var(--ds-ink) 7%, transparent) 0.07cqi, transparent 0.09cqi);
  background-size: 1.4cqi 1.4cqi;
  color: var(--k-ink);
  font-family: var(--ds-font-sans);
}
.c-agent-loop-handoff svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.c-agent-loop-handoff text { font-family: var(--ds-font-sans); }
.c-agent-loop-handoff .serif { font-family: var(--ds-font-display); font-weight: var(--ds-weight-display); letter-spacing: var(--ds-tracking-display); }
.c-agent-loop-handoff .mono, .c-agent-loop-handoff .mono text { font-family: var(--ds-font-mono); }
.c-agent-loop-handoff .f-none { fill: none; }
.c-agent-loop-handoff .f-bg { fill: var(--k-bg); }
.c-agent-loop-handoff .f-panel { fill: var(--k-panel); }
.c-agent-loop-handoff .f-raised { fill: var(--k-raised); }
.c-agent-loop-handoff .f-code { fill: var(--k-code); }
.c-agent-loop-handoff .f-ink { fill: var(--k-ink); }
.c-agent-loop-handoff .f-text { fill: var(--k-text); }
.c-agent-loop-handoff .f-dim { fill: var(--k-dim); }
.c-agent-loop-handoff .f-faint { fill: var(--k-faint); }
.c-agent-loop-handoff .f-line { fill: var(--k-line); }
.c-agent-loop-handoff .f-path { fill: var(--k-path); }
.c-agent-loop-handoff .f-pass { fill: var(--k-pass); }
.c-agent-loop-handoff .f-passfill { fill: var(--k-passfill); }
.c-agent-loop-handoff .f-fail { fill: var(--k-fail); }
.c-agent-loop-handoff .f-failfill { fill: var(--k-failfill); }
.c-agent-loop-handoff .f-human { fill: var(--k-human); }
.c-agent-loop-handoff .f-data { fill: var(--k-data); }
.c-agent-loop-handoff .s-bg { stroke: var(--k-bg); }
.c-agent-loop-handoff .s-panel { stroke: var(--k-panel); }
.c-agent-loop-handoff .s-raised { stroke: var(--k-raised); }
.c-agent-loop-handoff .s-code { stroke: var(--k-code); }
.c-agent-loop-handoff .s-ink { stroke: var(--k-ink); }
.c-agent-loop-handoff .s-text { stroke: var(--k-text); }
.c-agent-loop-handoff .s-dim { stroke: var(--k-dim); }
.c-agent-loop-handoff .s-faint { stroke: var(--k-faint); }
.c-agent-loop-handoff .s-line { stroke: var(--k-line); }
.c-agent-loop-handoff .s-path { stroke: var(--k-path); }
.c-agent-loop-handoff .s-pass { stroke: var(--k-pass); }
.c-agent-loop-handoff .s-passfill { stroke: var(--k-passfill); }
.c-agent-loop-handoff .s-fail { stroke: var(--k-fail); }
.c-agent-loop-handoff .s-failfill { stroke: var(--k-failfill); }
.c-agent-loop-handoff .s-human { stroke: var(--k-human); }
.c-agent-loop-handoff .s-data { stroke: var(--k-data); }
</style>

<section class="c-agent-loop-handoff" aria-label="Out of the loop: steering and approving are handed to the model and auto-approve; the rest go to the model, the harness or the environment">
  <svg viewBox="0 0 1600 900" role="img" aria-label="Out of the loop: steering and approving are handed to the model and auto-approve; the rest go to the model, the harness or the environment"></svg>
</section>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const check = (p, x, y, s, state) => {
    const g = el('g', {}, p);
    if (state === 'done' || state === 'fail') {
      el('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: s * 0.18, class: state === 'done' ? 'f-pass' : 'f-fail' }, g);
      const d = state === 'done'
        ? `M${x - s * 0.25} ${y} l${s * 0.17} ${s * 0.17} l${s * 0.33} ${-s * 0.33}`
        : `M${x - s * 0.2} ${y - s * 0.2} L${x + s * 0.2} ${y + s * 0.2} M${x + s * 0.2} ${y - s * 0.2} L${x - s * 0.2} ${y + s * 0.2}`;
      el('path', { d, class: 'f-none s-bg', 'stroke-width': s * 0.12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    } else {
      el('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: s * 0.18, class: 'f-bg ' + (state === 'bad' ? 's-fail' : 's-pass'), 'stroke-width': Math.max(1.5, s * 0.07) }, g);
    }
    return g;
  };
  const person = (p, x, y, r, tone) => {
    tone = tone || 'human';
    const g = el('g', {}, p);
    el('circle', { cx: x, cy: y, r, class: 'f-bg s-' + tone, 'stroke-width': r * 0.12 }, g);
    el('circle', { cx: x, cy: y - r * 0.2, r: r * 0.28, class: 'f-' + tone }, g);
    el('path', { d: `M${x - r * 0.55} ${y + r * 0.62} a${r * 0.55} ${r * 0.5} 0 0 1 ${r * 1.1} 0`, class: 'f-' + tone }, g);
    return g;
  };
  const spark = (p, x, y, r) => {
    const g = el('g', { class: 's-path', 'stroke-width': r * 0.18, 'stroke-linecap': 'round' }, p);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + Math.PI / 8;
      const l = i % 2 ? r * 0.72 : r;
      el('line', { x1: x + Math.cos(a) * r * 0.2, y1: y + Math.sin(a) * r * 0.2, x2: x + Math.cos(a) * l, y2: y + Math.sin(a) * l }, g);
    }
    return g;
  };
  const chip = (p, x, y, verb, arg, o) => {
    o = o || {};
    const fs = o.fs || 20;
    const pad = 10;
    const w = (verb.length + (arg ? arg.length + 1 : 0) + (o.mark ? 2 : 0)) * fs * 0.6 + pad * 2;
    const g = el('g', { class: 'mono' }, p);
    el('rect', { x: x - w / 2, y: y - fs * 0.9, width: w, height: fs * 1.8, rx: 6, class: o.danger ? 'f-failfill s-fail' : 'f-raised s-line', 'stroke-width': 1 }, g);
    const t = el('text', { x: x - w / 2 + pad, y: y + fs * 0.35, 'font-size': fs, class: o.danger ? 'f-fail' : 'f-ink' }, g, verb);
    if (arg) el('tspan', { class: o.danger ? 'f-fail' : 'f-dim' }, t, ' ' + arg);
    if (o.mark) el('tspan', { class: o.danger ? 'f-fail' : 'f-text' }, t, ' ' + o.mark);
    return g;
  };
  const bubble = (p, x, y, txt, fs, anchor) => {
    fs = fs || 22;
    const w = txt.length * fs * 0.52 + 28;
    const x0 = anchor === 'end' ? x - w : x;
    el('rect', { x: x0, y: y - fs * 1.05, width: w, height: fs * 2, rx: 8, class: 'f-panel' }, p);
    el('text', { x: x0 + 14, y: y + fs * 0.3, 'font-size': fs, class: 'f-ink' }, p, txt);
  };
  const wave = (x0, x1, yc, amp, waves) => {
    let d = '';
    for (let i = 0; i <= 160; i++) {
      const t = i / 160;
      const x = x0 + (x1 - x0) * t;
      const y = yc - amp * Math.sin(Math.PI * Math.min(1, t * 1.05)) * Math.sin(t * Math.PI * 2 * waves);
      d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
  };
  const waveY = (x, x0, x1, yc, amp, waves) => {
    const t = (x - x0) / (x1 - x0);
    return yc - amp * Math.sin(Math.PI * Math.min(1, t * 1.05)) * Math.sin(t * Math.PI * 2 * waves);
  };
  const baseline = (p, x0, x1, y) => el('line', { x1: x0, y1: y, x2: x1, y2: y, class: 's-faint', 'stroke-width': 2, 'stroke-dasharray': '2 9', 'stroke-linecap': 'round' }, p);
  const startNode = (p, x, y) => el('rect', { x: x - 7, y: y - 7, width: 14, height: 14, rx: 3, class: 'f-bg s-dim', 'stroke-width': 2 }, p);

  document.querySelectorAll('.c-agent-loop-handoff').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    const s = root.querySelector('svg');

    const DATA = {
      title: 'Out of the loop',
      jobs: [['Steering it', 'The model'], ['Approving it', 'Auto-approve'], ['Saying no', ''], ['Checking it', ''], ['Starting it', '']],
      owners: ['The model', 'The harness', 'The environment'],
    };
    el('text', { x: 800, y: 150, 'text-anchor': 'middle', class: 'serif f-ink', 'font-size': 84 }, s, DATA.title);
    DATA.jobs.forEach(([j, o], i) => {
      const x = 95 + i * 290, y = 240, w = 270, cx = x + w / 2, cy = y + 120;
      const g = el('g', { opacity: o ? 0.45 : 1 }, s);
      el('rect', { x, y, width: w, height: 330, rx: 14, class: 'f-panel' }, g);
      if (i === 0) { el('path', { d: wave(x + 30, x + w - 30, cy + 20, 22, 1.2), class: 'f-none s-path', 'stroke-width': 2.5 }, g); el('rect', { x: cx - 50, y: cy - 50, width: 110, height: 34, rx: 6, class: 'f-raised s-human' }, g); }
      if (i === 1) { el('rect', { x: cx - 80, y: cy - 50, width: 160, height: 90, rx: 8, class: 'f-code' }, g); el('line', { x1: cx - 60, y1: cy - 25, x2: cx + 30, y2: cy - 25, class: 's-text', 'stroke-width': 3 }, g); el('rect', { x: cx + 10, y: cy + 5, width: 55, height: 20, rx: 4, class: 'f-ink' }, g); }
      if (i === 2) { el('line', { x1: cx - 90, y1: cy + 10, x2: cx + 60, y2: cy + 10, class: 's-fail', 'stroke-width': 3 }, g); el('path', { d: `M${cx + 70} ${cy} l20 20 M${cx + 90} ${cy} l-20 20`, class: 's-fail', 'stroke-width': 3 }, g); person(g, cx + 40, cy - 40, 20); }
      if (i === 3) { el('path', { d: wave(x + 30, cx + 20, cy + 15, 15, 1), class: 'f-none s-path', 'stroke-width': 2.5 }, g); check(g, cx + 50, cy + 10, 40, 'done'); person(g, cx + 50, cy - 50, 20); }
      if (i === 4) { person(g, cx - 70, cy - 20, 20); el('line', { x1: cx - 35, y1: cy - 20, x2: cx + 80, y2: cy - 20, class: 's-ink', 'stroke-width': 4 }, g); startNode(g, cx - 70, cy + 40); el('line', { x1: cx - 60, y1: cy + 40, x2: cx + 90, y2: cy + 40, class: 's-path', 'stroke-width': 2 }, g); }
      el('text', { x: cx, y: y + 260, 'text-anchor': 'middle', 'font-size': 30, class: 'f-ink' }, g, j);
      if (o) el('text', { x: cx, y: y + 300, 'text-anchor': 'middle', 'font-size': 22, class: 'f-text' }, s, o);
    });
    el('path', { d: 'M800 590 V630 M788 618 L800 632 L812 618', class: 'f-none s-path', 'stroke-width': 2.5 }, s);
    DATA.owners.forEach((t, i) => {
      const x = 310 + i * 340;
      el('rect', { x: x - 150, y: 650, width: 300, height: 76, rx: 12, class: 'f-panel' }, s);
      el('text', { x, y: 700, 'text-anchor': 'middle', 'font-size': 30, class: 'f-ink' }, s, t);
    });

  });
})();
</script>
