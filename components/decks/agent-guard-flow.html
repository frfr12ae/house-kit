<!--
@title Guardrail order flow
@group Agent sessions
@description Three chips in a row: a risky tool call, the rule that blocks it in pink, and the later check drawn as an empty outline that never sees it. Use to show which safeguard runs first.
@tags flow, permissions, deny rule, guardrail, safety, agents
@preview slide
@added 2026-11-17
@source Lydia Hallie, "Rethinking Claude Code Best Practices", AI Engineer 2026 | https://www.youtube.com/watch?v=vlfCjWuv4es | inspired-by
-->
<style>
.c-agent-guard-flow, .c-agent-guard-flow *, .c-agent-guard-flow *::before, .c-agent-guard-flow *::after { box-sizing: border-box; }
.c-agent-guard-flow {
  --k-bg: var(--ds-bg);
  --k-panel: color-mix(in srgb, var(--ds-ink) 4%, var(--ds-panel));
  --k-raised: color-mix(in srgb, var(--ds-ink) 7%, var(--ds-raised));
  --k-code: var(--ds-surface);
  --k-ink: var(--ds-ink);
  --k-text: var(--ds-text);
  --k-dim: var(--ds-muted);
  --k-faint: color-mix(in srgb, var(--ds-muted) 45%, var(--ds-bg));
  --k-line: var(--ds-line);
  --k-path: var(--ds-highlight-line);
  --k-pass: var(--ds-note-line);
  --k-passfill: var(--ds-note-fill);
  --k-fail: var(--ds-danger-line);
  --k-failfill: var(--ds-danger-fill);
  --k-human: var(--ds-info-line);
  --k-data: var(--ds-series-1);
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  overflow: hidden;
  border-radius: var(--ds-radius-lg);
  background-color: var(--k-bg);
  background-image: radial-gradient(circle, color-mix(in srgb, var(--ds-ink) 7%, transparent) 0.07cqi, transparent 0.09cqi);
  background-size: 1.4cqi 1.4cqi;
  color: var(--k-ink);
  font-family: var(--ds-font-sans);
}
.c-agent-guard-flow svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.c-agent-guard-flow text { font-family: var(--ds-font-sans); }
.c-agent-guard-flow .serif { font-family: var(--ds-font-display); font-weight: var(--ds-weight-display); letter-spacing: var(--ds-tracking-display); }
.c-agent-guard-flow .mono, .c-agent-guard-flow .mono text { font-family: var(--ds-font-mono); }
.c-agent-guard-flow .f-none { fill: none; }
.c-agent-guard-flow .f-bg { fill: var(--k-bg); }
.c-agent-guard-flow .f-panel { fill: var(--k-panel); }
.c-agent-guard-flow .f-raised { fill: var(--k-raised); }
.c-agent-guard-flow .f-code { fill: var(--k-code); }
.c-agent-guard-flow .f-ink { fill: var(--k-ink); }
.c-agent-guard-flow .f-text { fill: var(--k-text); }
.c-agent-guard-flow .f-dim { fill: var(--k-dim); }
.c-agent-guard-flow .f-faint { fill: var(--k-faint); }
.c-agent-guard-flow .f-line { fill: var(--k-line); }
.c-agent-guard-flow .f-path { fill: var(--k-path); }
.c-agent-guard-flow .f-pass { fill: var(--k-pass); }
.c-agent-guard-flow .f-passfill { fill: var(--k-passfill); }
.c-agent-guard-flow .f-fail { fill: var(--k-fail); }
.c-agent-guard-flow .f-failfill { fill: var(--k-failfill); }
.c-agent-guard-flow .f-human { fill: var(--k-human); }
.c-agent-guard-flow .f-data { fill: var(--k-data); }
.c-agent-guard-flow .s-bg { stroke: var(--k-bg); }
.c-agent-guard-flow .s-panel { stroke: var(--k-panel); }
.c-agent-guard-flow .s-raised { stroke: var(--k-raised); }
.c-agent-guard-flow .s-code { stroke: var(--k-code); }
.c-agent-guard-flow .s-ink { stroke: var(--k-ink); }
.c-agent-guard-flow .s-text { stroke: var(--k-text); }
.c-agent-guard-flow .s-dim { stroke: var(--k-dim); }
.c-agent-guard-flow .s-faint { stroke: var(--k-faint); }
.c-agent-guard-flow .s-line { stroke: var(--k-line); }
.c-agent-guard-flow .s-path { stroke: var(--k-path); }
.c-agent-guard-flow .s-pass { stroke: var(--k-pass); }
.c-agent-guard-flow .s-passfill { stroke: var(--k-passfill); }
.c-agent-guard-flow .s-fail { stroke: var(--k-fail); }
.c-agent-guard-flow .s-failfill { stroke: var(--k-failfill); }
.c-agent-guard-flow .s-human { stroke: var(--k-human); }
.c-agent-guard-flow .s-data { stroke: var(--k-data); }
</style>

<section class="c-agent-guard-flow" aria-label="A git reset hard tool call is blocked by a deny rule; auto-approve never sees it">
  <svg viewBox="0 0 1600 900" role="img" aria-label="A git reset hard tool call is blocked by a deny rule; auto-approve never sees it"></svg>
</section>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const check = (p, x, y, s, state) => {
    const g = el('g', {}, p);
    if (state === 'done' || state === 'fail') {
      el('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: s * 0.18, class: state === 'done' ? 'f-pass' : 'f-fail' }, g);
      const d = state === 'done'
        ? `M${x - s * 0.25} ${y} l${s * 0.17} ${s * 0.17} l${s * 0.33} ${-s * 0.33}`
        : `M${x - s * 0.2} ${y - s * 0.2} L${x + s * 0.2} ${y + s * 0.2} M${x + s * 0.2} ${y - s * 0.2} L${x - s * 0.2} ${y + s * 0.2}`;
      el('path', { d, class: 'f-none s-bg', 'stroke-width': s * 0.12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    } else {
      el('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: s * 0.18, class: 'f-bg ' + (state === 'bad' ? 's-fail' : 's-pass'), 'stroke-width': Math.max(1.5, s * 0.07) }, g);
    }
    return g;
  };
  const person = (p, x, y, r, tone) => {
    tone = tone || 'human';
    const g = el('g', {}, p);
    el('circle', { cx: x, cy: y, r, class: 'f-bg s-' + tone, 'stroke-width': r * 0.12 }, g);
    el('circle', { cx: x, cy: y - r * 0.2, r: r * 0.28, class: 'f-' + tone }, g);
    el('path', { d: `M${x - r * 0.55} ${y + r * 0.62} a${r * 0.55} ${r * 0.5} 0 0 1 ${r * 1.1} 0`, class: 'f-' + tone }, g);
    return g;
  };
  const spark = (p, x, y, r) => {
    const g = el('g', { class: 's-path', 'stroke-width': r * 0.18, 'stroke-linecap': 'round' }, p);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + Math.PI / 8;
      const l = i % 2 ? r * 0.72 : r;
      el('line', { x1: x + Math.cos(a) * r * 0.2, y1: y + Math.sin(a) * r * 0.2, x2: x + Math.cos(a) * l, y2: y + Math.sin(a) * l }, g);
    }
    return g;
  };
  const chip = (p, x, y, verb, arg, o) => {
    o = o || {};
    const fs = o.fs || 20;
    const pad = 10;
    const w = (verb.length + (arg ? arg.length + 1 : 0) + (o.mark ? 2 : 0)) * fs * 0.6 + pad * 2;
    const g = el('g', { class: 'mono' }, p);
    el('rect', { x: x - w / 2, y: y - fs * 0.9, width: w, height: fs * 1.8, rx: 6, class: o.danger ? 'f-failfill s-fail' : 'f-raised s-line', 'stroke-width': 1 }, g);
    const t = el('text', { x: x - w / 2 + pad, y: y + fs * 0.35, 'font-size': fs, class: o.danger ? 'f-fail' : 'f-ink' }, g, verb);
    if (arg) el('tspan', { class: o.danger ? 'f-fail' : 'f-dim' }, t, ' ' + arg);
    if (o.mark) el('tspan', { class: o.danger ? 'f-fail' : 'f-text' }, t, ' ' + o.mark);
    return g;
  };
  const bubble = (p, x, y, txt, fs, anchor) => {
    fs = fs || 22;
    const w = txt.length * fs * 0.52 + 28;
    const x0 = anchor === 'end' ? x - w : x;
    el('rect', { x: x0, y: y - fs * 1.05, width: w, height: fs * 2, rx: 8, class: 'f-panel' }, p);
    el('text', { x: x0 + 14, y: y + fs * 0.3, 'font-size': fs, class: 'f-ink' }, p, txt);
  };
  const wave = (x0, x1, yc, amp, waves) => {
    let d = '';
    for (let i = 0; i <= 160; i++) {
      const t = i / 160;
      const x = x0 + (x1 - x0) * t;
      const y = yc - amp * Math.sin(Math.PI * Math.min(1, t * 1.05)) * Math.sin(t * Math.PI * 2 * waves);
      d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
  };
  const waveY = (x, x0, x1, yc, amp, waves) => {
    const t = (x - x0) / (x1 - x0);
    return yc - amp * Math.sin(Math.PI * Math.min(1, t * 1.05)) * Math.sin(t * Math.PI * 2 * waves);
  };
  const baseline = (p, x0, x1, y) => el('line', { x1: x0, y1: y, x2: x1, y2: y, class: 's-faint', 'stroke-width': 2, 'stroke-dasharray': '2 9', 'stroke-linecap': 'round' }, p);
  const startNode = (p, x, y) => el('rect', { x: x - 7, y: y - 7, width: 14, height: 14, rx: 3, class: 'f-bg s-dim', 'stroke-width': 2 }, p);

  document.querySelectorAll('.c-agent-guard-flow').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    const s = root.querySelector('svg');

    const DATA = { call: ['Bash', 'git reset --hard', 'tool call'], rule: ['Deny rule', 'blocked'], later: ['Auto-approve', 'never sees it'] };
    el('rect', { x: 140, y: 330, width: 400, height: 150, rx: 16, class: 'f-panel' }, s);
    const t = el('text', { x: 340, y: 400, 'text-anchor': 'middle', 'font-size': 32, class: 'mono f-ink' }, s, DATA.call[0]);
    el('tspan', { class: 'f-text' }, t, ' ' + DATA.call[1]);
    el('text', { x: 340, y: 445, 'text-anchor': 'middle', 'font-size': 24, class: 'f-dim' }, s, DATA.call[2]);
    el('path', { d: 'M555 405 H640 M626 392 L642 405 L626 418', class: 'f-none s-fail', 'stroke-width': 3 }, s);
    el('rect', { x: 660, y: 330, width: 320, height: 150, rx: 16, class: 'f-failfill s-fail', 'stroke-width': 2 }, s);
    el('text', { x: 820, y: 400, 'text-anchor': 'middle', 'font-size': 34, class: 'f-ink' }, s, DATA.rule[0]);
    el('text', { x: 820, y: 445, 'text-anchor': 'middle', 'font-size': 24, class: 'f-fail' }, s, DATA.rule[1]);
    el('path', { d: 'M1000 405 H1100', class: 's-faint', 'stroke-width': 3, 'stroke-dasharray': '2 8', 'stroke-linecap': 'round' }, s);
    el('rect', { x: 1120, y: 330, width: 340, height: 150, rx: 16, class: 'f-none s-line', 'stroke-width': 2 }, s);
    el('text', { x: 1290, y: 400, 'text-anchor': 'middle', 'font-size': 34, class: 'f-dim' }, s, DATA.later[0]);
    el('text', { x: 1290, y: 445, 'text-anchor': 'middle', 'font-size': 24, class: 'f-faint' }, s, DATA.later[1]);

  });
})();
</script>
