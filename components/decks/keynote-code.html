<!--
@title Keynote code
@group Keynote
@description A code slide with a filename tab, a syntax-highlighted snippet in token colours, line numbers and a callout pinned to the one line that matters.
@tags keynote, code, snippet, syntax, developer, callout, sdk
@preview slide
@replay true
@added 2026-10-31

<style>
  .c-keynote-code, .c-keynote-code *, .c-keynote-code *::before, .c-keynote-code *::after { box-sizing: border-box; }
.c-keynote-code {
  --k-bg: var(--ds-ink);
  --k-fg: var(--ds-bg);
  --k-dim: color-mix(in srgb, var(--ds-bg) 60%, var(--ds-ink));
  --k-soft: color-mix(in srgb, var(--ds-bg) 82%, var(--ds-ink));
  --k-line: color-mix(in srgb, var(--ds-bg) 16%, transparent);
  --k-card: color-mix(in srgb, var(--ds-bg) 7%, var(--ds-ink));
  --k-card-2: color-mix(in srgb, var(--ds-bg) 12%, var(--ds-ink));
  --k-blue: var(--ds-info-line);
  --k-amber: var(--ds-highlight-line);
  --k-green: var(--ds-note-line);
  --k-t1: color-mix(in srgb, var(--ds-info-line) 80%, var(--ds-bg));
  --k-t2: color-mix(in srgb, var(--ds-highlight-line) 80%, var(--ds-bg));
  --k-t3: color-mix(in srgb, var(--ds-note-line) 80%, var(--ds-bg));
  --k-s1: color-mix(in srgb, var(--ds-info-line) 66%, var(--ds-bg));
  --k-s2: color-mix(in srgb, var(--ds-highlight-line) 66%, var(--ds-bg));
  --k-s3: color-mix(in srgb, var(--ds-note-line) 66%, var(--ds-bg));
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  overflow: hidden;
  background: var(--k-bg);
  color: var(--k-fg);
  font-family: var(--ds-font-sans);
  -webkit-font-smoothing: antialiased;
}
.c-keynote-code .sky {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(70% 60% at 50% 118%, color-mix(in srgb, var(--k-blue) 24%, transparent), transparent 70%),
    radial-gradient(50% 45% at 94% -8%, color-mix(in srgb, var(--k-amber) 14%, transparent), transparent 70%),
    radial-gradient(45% 40% at 2% 30%, color-mix(in srgb, var(--k-green) 8%, transparent), transparent 70%);
}
.c-keynote-code .pad { position: absolute; inset: 0; padding: 5.5cqi 7cqi; }
.c-keynote-code .eyebrow { margin: 0; font-size: 1.3cqi; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--k-dim); }
.c-keynote-code .display {
  margin: 0;
  font-family: var(--ds-font-display);
  font-weight: var(--ds-weight-display);
  letter-spacing: var(--ds-tracking-display);
  line-height: 1.02;
  color: var(--k-fg);
}
.c-keynote-code .grad {
  display: inline-block;
  padding: 0 0.04em 0.1em 0;
  margin: 0 -0.04em -0.1em 0;
  background: linear-gradient(100deg, var(--k-t1) 0%, var(--k-t3) 52%, var(--k-t2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
.c-keynote-code.is-armed .rv { opacity: 0; transform: translateY(1.8cqi); }
.c-keynote-code.is-armed.is-in .rv {
  opacity: 1;
  transform: none;
  transition: opacity var(--ds-dur-slow) var(--ds-ease), transform var(--ds-dur-slow) var(--ds-ease);
  transition-delay: calc(var(--d, 0) * 110ms);
}
  .c-keynote-code .sky {
    background:
      radial-gradient(46% 60% at 36% 62%, color-mix(in srgb, var(--k-blue) 20%, transparent), transparent 70%),
      radial-gradient(34% 40% at 92% 14%, color-mix(in srgb, var(--k-amber) 16%, transparent), transparent 70%),
      radial-gradient(40% 40% at 0% 0%, color-mix(in srgb, var(--k-green) 8%, transparent), transparent 70%);
  }
  .c-keynote-code .head { position: absolute; left: 7cqi; top: 5.4cqi; display: grid; gap: 1.2cqi; }
  .c-keynote-code .head h2 { font-size: 5cqi; }
  .c-keynote-code .win {
    position: absolute;
    left: 7cqi;
    top: 21cqi;
    width: 62cqi;
    border: var(--ds-hairline) solid var(--k-line);
    border-radius: calc(1.6cqi * var(--ds-radius-scale, 1));
    background: linear-gradient(160deg, var(--k-card-2), var(--k-card));
    box-shadow: 0 0 9cqi color-mix(in srgb, var(--k-blue) 22%, transparent), 0 2cqi 5cqi color-mix(in srgb, var(--k-bg) 80%, transparent);
  }
  .c-keynote-code .tabs { display: flex; align-items: flex-end; height: 3.6cqi; padding: 0 1.4cqi; border-bottom: var(--ds-hairline) solid var(--k-line); }
  .c-keynote-code .tab { display: inline-flex; align-items: center; gap: 0.8cqi; height: 100%; padding: 0 1.4cqi; border-bottom: 0.2cqi solid var(--k-blue); font-family: var(--ds-font-mono); font-size: 1.3cqi; font-weight: 600; color: var(--k-fg); }
  .c-keynote-code .tab i { width: 0.9cqi; height: 0.9cqi; border-radius: 0.25cqi; background: var(--k-blue); }
  .c-keynote-code .code { margin: 0; padding: 1.6cqi 2.4cqi 1.8cqi; font-family: var(--ds-font-mono); font-size: 1.8cqi; line-height: 2.95cqi; color: var(--k-soft); }
  .c-keynote-code .code code { display: grid; }
  .c-keynote-code .l { position: relative; display: flex; gap: 2cqi; white-space: pre; }
  .c-keynote-code .n { flex: none; width: 1.6cqi; text-align: right; color: var(--k-dim); opacity: 0.7; }
  .c-keynote-code .l.hl { margin: 0 -2.4cqi; padding: 0 2.4cqi; background: linear-gradient(90deg, color-mix(in srgb, var(--k-amber) 22%, transparent), color-mix(in srgb, var(--k-amber) 6%, transparent)); box-shadow: inset 0.3cqi 0 0 var(--k-amber); }
  .c-keynote-code .k { color: var(--k-s1); }
  .c-keynote-code .s { color: var(--k-s3); }
  .c-keynote-code .f { color: var(--k-s2); }
  .c-keynote-code .c { color: var(--k-dim); }
  .c-keynote-code .call {
    position: absolute;
    left: calc(100% + 3cqi);
    top: 50%;
    width: 21cqi;
    transform: translateY(-50%);
    display: grid;
    gap: 0.4cqi;
    padding: 1.3cqi 1.6cqi;
    white-space: normal;
    border: var(--ds-hairline) solid color-mix(in srgb, var(--k-amber) 60%, transparent);
    border-radius: calc(1.3cqi * var(--ds-radius-scale, 1));
    background: color-mix(in srgb, var(--k-amber) 12%, var(--k-bg));
    box-shadow: 0 0 3cqi color-mix(in srgb, var(--k-amber) 28%, transparent);
    font-family: var(--ds-font-sans);
    line-height: 1.3;
  }
  .c-keynote-code .call::before { content: ""; position: absolute; right: 100%; top: 50%; width: 3cqi; height: 0.14cqi; background: var(--k-amber); }
  .c-keynote-code .call b { font-size: 1.8cqi; font-weight: 700; color: var(--k-fg); }
  .c-keynote-code .call span { font-size: 1.25cqi; color: var(--k-soft); }
  .c-keynote-code.is-armed .l { opacity: 0; transform: translateX(-1cqi); }
  .c-keynote-code.is-armed.is-in .l { opacity: 1; transform: none; transition: opacity var(--ds-dur-slow) var(--ds-ease), transform var(--ds-dur-slow) var(--ds-ease); transition-delay: calc(var(--d, 0) * 90ms + 300ms); }
  .c-keynote-code.is-armed .call { opacity: 0; }
  .c-keynote-code.is-armed.is-in .call { opacity: 1; transition: opacity var(--ds-dur-slow) var(--ds-ease); transition-delay: 1200ms; }
</style>

<section class="c-keynote-code" aria-label="Connecting to Orbit with the SDK, with offline mode switched on">
  <div class="sky"></div>
  <div class="head">
    <p class="eyebrow rv" style="--d:0">Orbit SDK</p>
    <h2 class="display rv" style="--d:1">Real-time, in a <span class="grad">few lines.</span></h2>
  </div>
  <div class="win rv" style="--d:2">
    <div class="tabs"><span class="tab"><i></i>sync.ts</span></div>
    <pre class="code"><code><span class="l" style="--d:0"><span class="n">1</span><span><span class="k">import</span> { Orbit } <span class="k">from</span> <span class="s">"@orbit/sdk"</span>;</span></span>
<span class="l" style="--d:1"><span class="n">2</span><span></span></span>
<span class="l" style="--d:2"><span class="n">3</span><span><span class="k">const</span> space = <span class="k">await</span> Orbit.<span class="f">connect</span>({</span></span>
<span class="l" style="--d:3"><span class="n">4</span><span>  workspace: <span class="s">"design-team"</span>,</span></span>
<span class="l hl" style="--d:4"><span class="n">5</span><span>  offline: <span class="k">true</span>,</span><span class="call"><b>New: works offline</b><span>Edits queue up and sync when you are back.</span></span></span>
<span class="l" style="--d:5"><span class="n">6</span><span>});</span></span>
<span class="l" style="--d:6"><span class="n">7</span><span></span></span>
<span class="l" style="--d:7"><span class="n">8</span><span>space.<span class="f">on</span>(<span class="s">"change"</span>, (doc) =&gt; <span class="f">sync</span>(doc));</span></span></code></pre>
  </div>
</section>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.c-keynote-code').forEach((root) => {
    if (reduced) return;
    root.classList.add('is-armed');
    const io = new IntersectionObserver((entries) => {
      if (!entries.some((e) => e.isIntersecting)) return;
      io.disconnect();
      requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-in')));
    }, { threshold: 0.35 });
    io.observe(root);
  });
})();
</script>
