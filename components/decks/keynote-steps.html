<!--
@title Keynote steps
@group Keynote
@description A three-step flow on a dark stage: glowing arrows between three cards, each with a numbered badge, a micro-visual built from shapes, a title and one line.
@tags keynote, steps, flow, process, onboarding, arrows, getting started
@preview slide
@replay true
@added 2026-10-31
-->
<style>
  .c-keynote-steps, .c-keynote-steps *, .c-keynote-steps *::before, .c-keynote-steps *::after { box-sizing: border-box; }
.c-keynote-steps {
  --k-bg: var(--ds-ink);
  --k-fg: var(--ds-bg);
  --k-dim: color-mix(in srgb, var(--ds-bg) 60%, var(--ds-ink));
  --k-soft: color-mix(in srgb, var(--ds-bg) 82%, var(--ds-ink));
  --k-line: color-mix(in srgb, var(--ds-bg) 16%, transparent);
  --k-card: color-mix(in srgb, var(--ds-bg) 7%, var(--ds-ink));
  --k-card-2: color-mix(in srgb, var(--ds-bg) 12%, var(--ds-ink));
  --k-blue: var(--ds-info-line);
  --k-amber: var(--ds-highlight-line);
  --k-green: var(--ds-note-line);
  --k-t1: color-mix(in srgb, var(--ds-info-line) 80%, var(--ds-bg));
  --k-t2: color-mix(in srgb, var(--ds-highlight-line) 80%, var(--ds-bg));
  --k-t3: color-mix(in srgb, var(--ds-note-line) 80%, var(--ds-bg));
  --k-s1: color-mix(in srgb, var(--ds-info-line) 66%, var(--ds-bg));
  --k-s2: color-mix(in srgb, var(--ds-highlight-line) 66%, var(--ds-bg));
  --k-s3: color-mix(in srgb, var(--ds-note-line) 66%, var(--ds-bg));
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  overflow: hidden;
  background: var(--k-bg);
  color: var(--k-fg);
  font-family: var(--ds-font-sans);
  -webkit-font-smoothing: antialiased;
}
.c-keynote-steps .sky {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(70% 60% at 50% 118%, color-mix(in srgb, var(--k-blue) 24%, transparent), transparent 70%),
    radial-gradient(50% 45% at 94% -8%, color-mix(in srgb, var(--k-amber) 14%, transparent), transparent 70%),
    radial-gradient(45% 40% at 2% 30%, color-mix(in srgb, var(--k-green) 8%, transparent), transparent 70%);
}
.c-keynote-steps .pad { position: absolute; inset: 0; padding: 5.5cqi 7cqi; }
.c-keynote-steps .eyebrow { margin: 0; font-size: 1.3cqi; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--k-dim); }
.c-keynote-steps .display {
  margin: 0;
  font-family: var(--ds-font-display);
  font-weight: var(--ds-weight-display);
  letter-spacing: var(--ds-tracking-display);
  line-height: 1.02;
  color: var(--k-fg);
}
.c-keynote-steps .grad {
  display: inline-block;
  padding: 0 0.04em 0.1em 0;
  margin: 0 -0.04em -0.1em 0;
  background: linear-gradient(100deg, var(--k-t1) 0%, var(--k-t3) 52%, var(--k-t2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
.c-keynote-steps.is-armed .rv { opacity: 0; transform: translateY(1.8cqi); }
.c-keynote-steps.is-armed.is-in .rv {
  opacity: 1;
  transform: none;
  transition: opacity var(--ds-dur-slow) var(--ds-ease), transform var(--ds-dur-slow) var(--ds-ease);
  transition-delay: calc(var(--d, 0) * 110ms);
}
  .c-keynote-steps .sky {
    background:
      radial-gradient(60% 50% at 50% 112%, color-mix(in srgb, var(--k-blue) 22%, transparent), transparent 70%),
      radial-gradient(36% 40% at 96% 0%, color-mix(in srgb, var(--k-amber) 14%, transparent), transparent 70%),
      radial-gradient(36% 40% at 0% 40%, color-mix(in srgb, var(--k-green) 8%, transparent), transparent 70%);
  }
  .c-keynote-steps .title { position: absolute; left: 7cqi; top: 5.4cqi; font-size: 5cqi; }
  .c-keynote-steps .flow { position: absolute; left: 7cqi; right: 7cqi; top: 17cqi; bottom: 5.5cqi; display: grid; grid-template-columns: minmax(0, 1fr) 6cqi minmax(0, 1fr) 6cqi minmax(0, 1fr); align-items: stretch; }
  .c-keynote-steps .step {
    display: flex;
    flex-direction: column;
    gap: 0.7cqi;
    padding: 1.6cqi;
    border: var(--ds-hairline) solid var(--k-line);
    border-radius: calc(2cqi * var(--ds-radius-scale, 1));
    background:
      radial-gradient(90% 60% at 50% 0%, color-mix(in srgb, var(--tint) 14%, transparent), transparent 72%),
      linear-gradient(160deg, var(--k-card-2), var(--k-card));
  }
  .c-keynote-steps .s1 { --tint: var(--k-blue); }
  .c-keynote-steps .s2 { --tint: var(--k-amber); }
  .c-keynote-steps .s3 { --tint: var(--k-green); }
  .c-keynote-steps .viz { position: relative; flex: 1; display: grid; place-items: center; margin-bottom: 1cqi; border-radius: 1.3cqi; background: color-mix(in srgb, var(--k-fg) 5%, transparent); border: var(--ds-hairline) solid var(--k-line); overflow: hidden; }
  .c-keynote-steps .num { display: inline-grid; place-items: center; width: 2.8cqi; height: 2.8cqi; border-radius: 50%; background: color-mix(in srgb, var(--tint) 26%, transparent); border: var(--ds-hairline) solid color-mix(in srgb, var(--tint) 70%, transparent); font-size: 1.4cqi; font-weight: 700; color: var(--k-fg); }
  .c-keynote-steps .step h3 { margin: 0; font-size: 2.3cqi; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; color: var(--k-fg); }
  .c-keynote-steps .step p { margin: 0; min-height: 2.8em; font-size: 1.45cqi; line-height: 1.4; color: var(--k-dim); }
  .c-keynote-steps .arrow { display: grid; place-items: center; align-self: center; }
  .c-keynote-steps .arrow svg { width: 4.6cqi; height: 2cqi; fill: none; stroke: var(--k-t1); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 0.8cqi color-mix(in srgb, var(--k-blue) 70%, transparent)); }
  /* 1: people */
  .c-keynote-steps .faces { display: flex; align-items: center; }
  .c-keynote-steps .faces i { width: 5.4cqi; height: 5.4cqi; margin-left: -1.3cqi; border-radius: 50%; border: 0.3cqi solid var(--k-card-2); background: var(--k-blue); }
  .c-keynote-steps .faces i:first-child { margin-left: 0; }
  .c-keynote-steps .faces i:nth-child(2) { background: var(--k-amber); }
  .c-keynote-steps .faces i:nth-child(3) { background: var(--k-green); }
  .c-keynote-steps .faces i.add { display: grid; place-items: center; background: transparent; border: 0.2cqi dashed color-mix(in srgb, var(--k-fg) 50%, transparent); font-style: normal; font-size: 2.6cqi; font-weight: 300; color: var(--k-soft); }
  /* 2: window */
  .c-keynote-steps .win { width: 74%; height: 70%; display: grid; grid-template-columns: 22% 1fr; border: var(--ds-hairline) solid var(--k-line); border-radius: 1cqi; overflow: hidden; background: var(--k-card); }
  .c-keynote-steps .win .sb { border-right: var(--ds-hairline) solid var(--k-line); background: color-mix(in srgb, var(--k-fg) 5%, transparent); }
  .c-keynote-steps .win .ct { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 0.8cqi; padding: 1cqi; }
  .c-keynote-steps .win .ct i { border-radius: 0.6cqi; background: color-mix(in srgb, var(--k-amber) 55%, transparent); }
  .c-keynote-steps .win .ct i:nth-child(2) { background: color-mix(in srgb, var(--k-blue) 55%, transparent); }
  .c-keynote-steps .win .ct i:nth-child(3) { grid-column: 1 / span 2; background: color-mix(in srgb, var(--k-fg) 18%, transparent); }
  /* 3: link */
  .c-keynote-steps .link { display: flex; align-items: center; gap: 1cqi; padding: 0.6cqi 0.6cqi 0.6cqi 1.4cqi; border: var(--ds-hairline) solid var(--k-line); border-radius: var(--ds-radius-pill); background: var(--k-card); font-family: var(--ds-font-mono); font-size: 1.15cqi; color: var(--k-soft); }
  .c-keynote-steps .link b { padding: 0.7cqi 1.2cqi; border-radius: var(--ds-radius-pill); background: var(--k-green); font-family: var(--ds-font-sans); font-size: 1.2cqi; font-weight: 700; color: var(--k-bg); box-shadow: 0 0 2cqi color-mix(in srgb, var(--k-green) 50%, transparent); }
  .c-keynote-steps.is-armed .arrow { opacity: 0; }
  .c-keynote-steps.is-armed.is-in .arrow { opacity: 1; transition: opacity var(--ds-dur-slow) var(--ds-ease); transition-delay: calc(var(--d, 0) * 110ms); }
</style>

<section class="c-keynote-steps" aria-label="Three steps to get started with Orbit 2">
  <div class="sky"></div>
  <h2 class="display title rv" style="--d:0">Three steps. <span class="grad">Zero setup.</span></h2>
  <div class="flow">
    <article class="step s1 rv" style="--d:1">
      <div class="viz" aria-hidden="true"><div class="faces"><i></i><i></i><i></i><i class="add">+</i></div></div>
      <span class="num">1</span>
      <h3>Invite your team</h3>
      <p>Add people by email or link.</p>
    </article>
    <span class="arrow" style="--d:2" aria-hidden="true"><svg viewBox="0 0 46 20"><path d="M2 10h40M34 2l8 8-8 8"/></svg></span>
    <article class="step s2 rv" style="--d:3">
      <div class="viz" aria-hidden="true"><div class="win"><span class="sb"></span><span class="ct"><i></i><i></i><i></i></span></div></div>
      <span class="num">2</span>
      <h3>Open a space</h3>
      <p>Pick a template or start blank.</p>
    </article>
    <span class="arrow" style="--d:4" aria-hidden="true"><svg viewBox="0 0 46 20"><path d="M2 10h40M34 2l8 8-8 8"/></svg></span>
    <article class="step s3 rv" style="--d:5">
      <div class="viz" aria-hidden="true"><div class="link">orbit.example/join<b>Copy</b></div></div>
      <span class="num">3</span>
      <h3>Share the link</h3>
      <p>Everyone joins the same room.</p>
    </article>
  </div>
</section>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.c-keynote-steps').forEach((root) => {
    if (reduced) return;
    root.classList.add('is-armed');
    const io = new IntersectionObserver((entries) => {
      if (!entries.some((e) => e.isIntersecting)) return;
      io.disconnect();
      requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-in')));
    }, { threshold: 0.35 });
    io.observe(root);
  });
})();
</script>
