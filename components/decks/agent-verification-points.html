<!--
@title Verification points
@group Agent sessions
@description A run split by checkpoints, each with the kind of evidence it needs (a test, a build, a screenshot). The first check catches a bad branch, which loops back in pink.
@tags verification, checkpoints, tests, build, screenshot, agents
@preview slide
@added 2026-11-17
@source Lydia Hallie, "Rethinking Claude Code Best Practices", AI Engineer 2026 | https://www.youtube.com/watch?v=vlfCjWuv4es | inspired-by
-->
<style>
.c-agent-verification-points, .c-agent-verification-points *, .c-agent-verification-points *::before, .c-agent-verification-points *::after { box-sizing: border-box; }
.c-agent-verification-points {
  --k-bg: var(--ds-bg);
  --k-panel: color-mix(in srgb, var(--ds-ink) 4%, var(--ds-panel));
  --k-raised: color-mix(in srgb, var(--ds-ink) 7%, var(--ds-raised));
  --k-code: var(--ds-surface);
  --k-ink: var(--ds-ink);
  --k-text: var(--ds-text);
  --k-dim: var(--ds-muted);
  --k-faint: color-mix(in srgb, var(--ds-muted) 45%, var(--ds-bg));
  --k-line: var(--ds-line);
  --k-path: var(--ds-highlight-line);
  --k-pass: var(--ds-note-line);
  --k-passfill: var(--ds-note-fill);
  --k-fail: var(--ds-danger-line);
  --k-failfill: var(--ds-danger-fill);
  --k-human: var(--ds-info-line);
  --k-data: var(--ds-series-1);
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  overflow: hidden;
  border-radius: var(--ds-radius-lg);
  background-color: var(--k-bg);
  background-image: radial-gradient(circle, color-mix(in srgb, var(--ds-ink) 7%, transparent) 0.07cqi, transparent 0.09cqi);
  background-size: 1.4cqi 1.4cqi;
  color: var(--k-ink);
  font-family: var(--ds-font-sans);
}
.c-agent-verification-points svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.c-agent-verification-points text { font-family: var(--ds-font-sans); }
.c-agent-verification-points .serif { font-family: var(--ds-font-display); font-weight: var(--ds-weight-display); letter-spacing: var(--ds-tracking-display); }
.c-agent-verification-points .mono, .c-agent-verification-points .mono text { font-family: var(--ds-font-mono); }
.c-agent-verification-points .f-none { fill: none; }
.c-agent-verification-points .f-bg { fill: var(--k-bg); }
.c-agent-verification-points .f-panel { fill: var(--k-panel); }
.c-agent-verification-points .f-raised { fill: var(--k-raised); }
.c-agent-verification-points .f-code { fill: var(--k-code); }
.c-agent-verification-points .f-ink { fill: var(--k-ink); }
.c-agent-verification-points .f-text { fill: var(--k-text); }
.c-agent-verification-points .f-dim { fill: var(--k-dim); }
.c-agent-verification-points .f-faint { fill: var(--k-faint); }
.c-agent-verification-points .f-line { fill: var(--k-line); }
.c-agent-verification-points .f-path { fill: var(--k-path); }
.c-agent-verification-points .f-pass { fill: var(--k-pass); }
.c-agent-verification-points .f-passfill { fill: var(--k-passfill); }
.c-agent-verification-points .f-fail { fill: var(--k-fail); }
.c-agent-verification-points .f-failfill { fill: var(--k-failfill); }
.c-agent-verification-points .f-human { fill: var(--k-human); }
.c-agent-verification-points .f-data { fill: var(--k-data); }
.c-agent-verification-points .s-bg { stroke: var(--k-bg); }
.c-agent-verification-points .s-panel { stroke: var(--k-panel); }
.c-agent-verification-points .s-raised { stroke: var(--k-raised); }
.c-agent-verification-points .s-code { stroke: var(--k-code); }
.c-agent-verification-points .s-ink { stroke: var(--k-ink); }
.c-agent-verification-points .s-text { stroke: var(--k-text); }
.c-agent-verification-points .s-dim { stroke: var(--k-dim); }
.c-agent-verification-points .s-faint { stroke: var(--k-faint); }
.c-agent-verification-points .s-line { stroke: var(--k-line); }
.c-agent-verification-points .s-path { stroke: var(--k-path); }
.c-agent-verification-points .s-pass { stroke: var(--k-pass); }
.c-agent-verification-points .s-passfill { stroke: var(--k-passfill); }
.c-agent-verification-points .s-fail { stroke: var(--k-fail); }
.c-agent-verification-points .s-failfill { stroke: var(--k-failfill); }
.c-agent-verification-points .s-human { stroke: var(--k-human); }
.c-agent-verification-points .s-data { stroke: var(--k-data); }
</style>

<section class="c-agent-verification-points" aria-label="A run with three checkpoints: a test, a build and a screenshot; the first catches a change that logs everyone out">
  <svg viewBox="0 0 1600 900" role="img" aria-label="A run with three checkpoints: a test, a build and a screenshot; the first catches a change that logs everyone out"></svg>
</section>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  };
  const check = (p, x, y, s, state) => {
    const g = el('g', {}, p);
    if (state === 'done' || state === 'fail') {
      el('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: s * 0.18, class: state === 'done' ? 'f-pass' : 'f-fail' }, g);
      const d = state === 'done'
        ? `M${x - s * 0.25} ${y} l${s * 0.17} ${s * 0.17} l${s * 0.33} ${-s * 0.33}`
        : `M${x - s * 0.2} ${y - s * 0.2} L${x + s * 0.2} ${y + s * 0.2} M${x + s * 0.2} ${y - s * 0.2} L${x - s * 0.2} ${y + s * 0.2}`;
      el('path', { d, class: 'f-none s-bg', 'stroke-width': s * 0.12, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    } else {
      el('rect', { x: x - s / 2, y: y - s / 2, width: s, height: s, rx: s * 0.18, class: 'f-bg ' + (state === 'bad' ? 's-fail' : 's-pass'), 'stroke-width': Math.max(1.5, s * 0.07) }, g);
    }
    return g;
  };
  const person = (p, x, y, r, tone) => {
    tone = tone || 'human';
    const g = el('g', {}, p);
    el('circle', { cx: x, cy: y, r, class: 'f-bg s-' + tone, 'stroke-width': r * 0.12 }, g);
    el('circle', { cx: x, cy: y - r * 0.2, r: r * 0.28, class: 'f-' + tone }, g);
    el('path', { d: `M${x - r * 0.55} ${y + r * 0.62} a${r * 0.55} ${r * 0.5} 0 0 1 ${r * 1.1} 0`, class: 'f-' + tone }, g);
    return g;
  };
  const spark = (p, x, y, r) => {
    const g = el('g', { class: 's-path', 'stroke-width': r * 0.18, 'stroke-linecap': 'round' }, p);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4 + Math.PI / 8;
      const l = i % 2 ? r * 0.72 : r;
      el('line', { x1: x + Math.cos(a) * r * 0.2, y1: y + Math.sin(a) * r * 0.2, x2: x + Math.cos(a) * l, y2: y + Math.sin(a) * l }, g);
    }
    return g;
  };
  const chip = (p, x, y, verb, arg, o) => {
    o = o || {};
    const fs = o.fs || 20;
    const pad = 10;
    const w = (verb.length + (arg ? arg.length + 1 : 0) + (o.mark ? 2 : 0)) * fs * 0.6 + pad * 2;
    const g = el('g', { class: 'mono' }, p);
    el('rect', { x: x - w / 2, y: y - fs * 0.9, width: w, height: fs * 1.8, rx: 6, class: o.danger ? 'f-failfill s-fail' : 'f-raised s-line', 'stroke-width': 1 }, g);
    const t = el('text', { x: x - w / 2 + pad, y: y + fs * 0.35, 'font-size': fs, class: o.danger ? 'f-fail' : 'f-ink' }, g, verb);
    if (arg) el('tspan', { class: o.danger ? 'f-fail' : 'f-dim' }, t, ' ' + arg);
    if (o.mark) el('tspan', { class: o.danger ? 'f-fail' : 'f-text' }, t, ' ' + o.mark);
    return g;
  };
  const bubble = (p, x, y, txt, fs, anchor) => {
    fs = fs || 22;
    const w = txt.length * fs * 0.52 + 28;
    const x0 = anchor === 'end' ? x - w : x;
    el('rect', { x: x0, y: y - fs * 1.05, width: w, height: fs * 2, rx: 8, class: 'f-panel' }, p);
    el('text', { x: x0 + 14, y: y + fs * 0.3, 'font-size': fs, class: 'f-ink' }, p, txt);
  };
  const wave = (x0, x1, yc, amp, waves) => {
    let d = '';
    for (let i = 0; i <= 160; i++) {
      const t = i / 160;
      const x = x0 + (x1 - x0) * t;
      const y = yc - amp * Math.sin(Math.PI * Math.min(1, t * 1.05)) * Math.sin(t * Math.PI * 2 * waves);
      d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
  };
  const waveY = (x, x0, x1, yc, amp, waves) => {
    const t = (x - x0) / (x1 - x0);
    return yc - amp * Math.sin(Math.PI * Math.min(1, t * 1.05)) * Math.sin(t * Math.PI * 2 * waves);
  };
  const baseline = (p, x0, x1, y) => el('line', { x1: x0, y1: y, x2: x1, y2: y, class: 's-faint', 'stroke-width': 2, 'stroke-dasharray': '2 9', 'stroke-linecap': 'round' }, p);
  const startNode = (p, x, y) => el('rect', { x: x - 7, y: y - 7, width: 14, height: 14, rx: 3, class: 'f-bg s-dim', 'stroke-width': 2 }, p);

  document.querySelectorAll('.c-agent-verification-points').forEach((root) => {
    if (root.dataset.okInit) return;
    root.dataset.okInit = '1';
    const s = root.querySelector('svg');

    const DATA = { prompt: 'Move auth over to the new API', caught: 'logs everyone out', checks: ['A test', 'A build', 'A screenshot'], testFile: 'auth.test.ts', assertion: ['nobody gets', 'logged out'] };
    bubble(s, 1560, 70, DATA.prompt, 22, 'end');
    baseline(s, 140, 1450, 300);
    el('path', { d: 'M140 300 C 140 150, 330 150, 330 300', class: 'f-none s-path', 'stroke-width': 2.5 }, s);
    el('circle', { cx: 280, cy: 205, r: 14, class: 'f-fail' }, s);
    el('path', { d: 'M274 199 l12 12 M286 199 l-12 12', class: 's-bg', 'stroke-width': 3, 'stroke-linecap': 'round' }, s);
    el('rect', { x: 110, y: 110, width: 220, height: 44, rx: 8, class: 'f-failfill s-fail' }, s);
    el('text', { x: 220, y: 140, 'text-anchor': 'middle', 'font-size': 22, class: 'f-fail' }, s, DATA.caught);
    spark(s, 140, 300, 22);
    DATA.checks.forEach((label, i) => {
      const x = 400 + i * 350;
      check(s, x, 300, 48, i ? 'pending' : 'done');
      el('line', { x1: x, y1: 325, x2: x, y2: 400, class: 's-faint', 'stroke-width': 1.5 }, s);
      const g = el('g', { opacity: i ? 0.4 : 1 }, s);
      el('rect', { x: x - 150, y: 400, width: 300, height: 330, rx: 14, class: 'f-panel ' + (i ? '' : 's-pass'), 'stroke-width': 1.5 }, g);
      el('text', { x: x - 125, y: 455, 'font-size': 32, class: 'f-ink' }, g, label);
      el('rect', { x: x - 125, y: 480, width: 250, height: 220, rx: 8, class: 'f-code' }, g);
      if (i === 0) {
        el('text', { x: x - 105, y: 515, 'font-size': 16, class: 'mono f-dim' }, g, DATA.testFile);
        [[560, 'fail', 'f-fail'], [640, 'done', 'f-ink']].forEach(([y, st, cls]) => {
          check(g, x - 95, y, 22, st);
          el('text', { x: x - 75, y: y + 7, 'font-size': 22, class: cls }, g, DATA.assertion[0]);
          el('text', { x: x - 75, y: y + 35, 'font-size': 22, class: cls }, g, DATA.assertion[1]);
        });
      }
      if (i === 1) { el('text', { x: x - 105, y: 525, 'font-size': 22, class: 'mono f-ink' }, g, 'npm run build'); [560, 590, 620, 650].forEach((y, k) => el('rect', { x: x - 105, y, width: 200 - k * 30, height: 10, rx: 3, class: 'f-line' }, g)); }
      if (i === 2) { el('text', { x, y: 530, 'text-anchor': 'middle', 'font-size': 18, class: 'f-ink' }, g, 'Log in'); [560, 600].forEach((y) => el('rect', { x: x - 90, y, width: 180, height: 26, rx: 4, class: 'f-line' }, g)); el('rect', { x: x - 90, y: 648, width: 180, height: 30, rx: 5, class: 'f-ink' }, g); }
    });
    check(s, 1450, 300, 48, 'pending');

  });
})();
</script>
