<!--
@title Combo bar and line chart
@group Exhibits
@description Quarterly revenue as bars on the left axis with operating margin as a line on a second right axis, value labels on every point.
@tags slide, combo chart, bar, line, dual axis, revenue, margin, trend, exhibit
@preview slide
@added 2026-11-20
@author Frederik
-->
<style>
  .c-combo-bar-line {
    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--ds-surface);
    color: var(--ds-text);
    font-family: var(--ds-font-sans);
  }
  .c-combo-bar-line .inner {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    row-gap: 1.4cqi;
    padding: 5cqi 6cqi;
  }
  .c-combo-bar-line .kicker { margin: 0; font-size: 1.25cqi; font-weight: 600; line-height: 1.3; color: var(--ds-muted); }
  .c-combo-bar-line h1 {
    margin: 0.9cqi 0 0;
    font-family: var(--ds-font-display);
    font-size: 2.6cqi;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.2;
    color: var(--ds-ink);
    text-wrap: balance;
  }
  .c-combo-bar-line .exhibit { position: relative; min-height: 0; }
  .c-combo-bar-line .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 3cqi;
    padding-top: 0.9cqi;
    border-top: var(--ds-hairline) solid var(--ds-line);
    font-size: 0.95cqi;
    line-height: 1.4;
    color: var(--ds-muted);
  }
  .c-combo-bar-line .page { flex: none; font-weight: 600; color: var(--ds-text); font-variant-numeric: tabular-nums; }
  .c-combo-bar-line svg { display: block; width: 100%; height: auto; overflow: visible; }
  .c-combo-bar-line svg text { font-family: var(--ds-font-sans); fill: var(--ds-text); font-variant-numeric: tabular-nums; }
  .c-combo-bar-line .grid { stroke: var(--ds-line); stroke-width: 1; }
  .c-combo-bar-line .axis { stroke: var(--ds-muted); stroke-width: 1.2; }
  .c-combo-bar-line .tick { fill: var(--ds-muted); font-size: 12px; }
  .c-combo-bar-line .xs { font-size: 11px; }
  .c-combo-bar-line .sm { font-size: 12px; }
  .c-combo-bar-line .md { font-size: 13px; }
  .c-combo-bar-line .lg { font-size: 14px; }
  .c-combo-bar-line .b { font-weight: 700; }
  .c-combo-bar-line .sb { font-weight: 600; }
  .c-combo-bar-line .ink { fill: var(--ds-ink); }
  .c-combo-bar-line .mu { fill: var(--ds-muted); }
  .c-combo-bar-line .mid { text-anchor: middle; }
  .c-combo-bar-line .end { text-anchor: end; }
  .c-combo-bar-line .halo { paint-order: stroke; stroke: var(--ds-surface); stroke-width: 4px; stroke-linejoin: round; }

</style>
