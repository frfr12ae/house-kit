<style>
  .c-pitch-traction, .c-pitch-traction *, .c-pitch-traction *::before, .c-pitch-traction *::after { box-sizing: border-box; }
  .c-pitch-traction {
    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--ds-surface);
    color: var(--ds-text);
    font-family: var(--ds-font-sans);
  }
  .c-pitch-traction .inner {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    padding: 6cqi;
  }
  .c-pitch-traction .brand {
    display: flex;
    align-items: center;
    gap: 0.6cqi;
    font-size: 1.5cqi;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1;
    color: var(--ds-ink);
  }
  .c-pitch-traction .brand svg { width: 1.7cqi; height: 1.7cqi; fill: none; stroke: var(--ds-ink); stroke-width: 2; stroke-linecap: round; }
  .c-pitch-traction .brand svg .strike { stroke: var(--ds-highlight-line); }
  .c-pitch-traction .num {
    position: absolute;
    right: 6cqi;
    bottom: 2.6cqi;
    font-size: 1cqi;
    line-height: 1;
    color: var(--ds-muted);
    font-variant-numeric: tabular-nums;
  }
  .c-pitch-traction h2 {
    margin: 0;
    font-family: var(--ds-font-display);
    font-size: 4.6cqi;
    font-weight: var(--ds-weight-display);
    letter-spacing: var(--ds-tracking-display);
    line-height: 1.06;
    color: var(--ds-ink);
  }
  .c-pitch-traction .kicker { font-size: 1.5cqi; font-weight: 700; color: var(--ds-muted); }

  .c-pitch-traction .main { display: grid; grid-template-columns: 29cqi minmax(0, 1fr); gap: 4cqi; align-items: center; padding-top: 2cqi; }
  .c-pitch-traction .left { display: grid; gap: 1.6cqi; align-content: center; }
  .c-pitch-traction .figure { font-family: var(--ds-font-display); font-size: 12cqi; font-weight: var(--ds-weight-display); letter-spacing: -0.04em; line-height: 0.9; color: var(--ds-ink); font-variant-numeric: tabular-nums; }
  .c-pitch-traction .badge { justify-self: start; padding: 0.5cqi 1.3cqi; border: var(--ds-hairline) solid var(--ds-note-line); border-radius: var(--ds-radius-pill); background: var(--ds-note-fill); font-size: 1.8cqi; font-weight: 800; color: var(--ds-ink); }
  .c-pitch-traction .note { margin: 0; font-size: 1.7cqi; line-height: 1.42; color: var(--ds-text); }
  .c-pitch-traction .plot svg { display: block; width: 100%; height: auto; }
  .c-pitch-traction .gl { stroke: var(--ds-line); stroke-width: 1; }
  .c-pitch-traction .yt { fill: var(--ds-muted); font-size: 12px; text-anchor: end; font-variant-numeric: tabular-nums; }
  .c-pitch-traction .xt { fill: var(--ds-muted); font-size: 12px; font-weight: 600; }
  .c-pitch-traction .area { fill: color-mix(in srgb, var(--ds-info-line) 16%, transparent); }
  .c-pitch-traction .ln { fill: none; stroke: var(--ds-info-line); stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
  .c-pitch-traction .ml { stroke: var(--ds-neutral-line); stroke-width: 1; stroke-dasharray: 2 3; }
  .c-pitch-traction .md { fill: var(--ds-surface); stroke: var(--ds-ink); stroke-width: 2; }
  .c-pitch-traction .mt { fill: var(--ds-ink); font-size: 13px; font-weight: 700; }
  .c-pitch-traction .end { fill: var(--ds-highlight-line); stroke: var(--ds-surface); stroke-width: 3; }
</style>
