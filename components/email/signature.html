<!--
@title Email signature
@description Email signature with a drawn initials monogram, name, role, company, phone and links in a presentation table. No images, so nothing is blocked or tracked.
@tags email, signature, contact, monogram
@preview fill
@height 280
@added 2026-10-31
-->
<table class="c-signature" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="var(--ds-panel)" style='background: var(--ds-panel); font-family: var(--ds-font-sans);'>
  <tr>
    <td align="center" style='padding: 40px 16px;'>
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style='width: 100%; max-width: 600px;'>
        <tr>
          <td bgcolor="var(--ds-surface)" style='background: var(--ds-surface); border: 1px solid var(--ds-line); border-radius: var(--ds-radius-xl); padding: 32px 40px;'>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style='padding: 0 0 20px 0; font-family: var(--ds-font-sans); font-size: var(--ds-text-md); line-height: 24px; color: var(--ds-text);'>Best regards,</td>
              </tr>
              <tr>
                <td>
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td valign="top" style='padding: 0 18px 0 0;'>
                        <table role="presentation" width="56" height="56" cellpadding="0" cellspacing="0" border="0">
                          <tr>
                            <td width="56" height="56" align="center" valign="middle" bgcolor="var(--ds-action)" style='width: 56px; height: 56px; background: var(--ds-action); border-radius: var(--ds-radius-lg); font-family: var(--ds-font-sans); font-size: 20px; line-height: 56px; font-weight: 800; letter-spacing: 1px; color: var(--ds-on-action);'>AL</td>
                          </tr>
                        </table>
                      </td>
                      <td valign="top" style='padding: 0 0 0 18px; border-left: 2px solid var(--ds-highlight-line);'>
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                          <tr><td style='font-family: var(--ds-font-sans); font-size: var(--ds-text-lg); line-height: 26px; font-weight: 800; color: var(--ds-ink);'>Alex Lindqvist</td></tr>
                          <tr><td style='font-family: var(--ds-font-sans); font-size: var(--ds-text-sm); line-height: 20px; color: var(--ds-text);'>Studio Director, <b>Northlight Studio</b></td></tr>
                          <tr><td style='padding-top: 10px; font-family: var(--ds-font-sans); font-size: var(--ds-text-sm); line-height: 22px; color: var(--ds-text);'>
                            <span style='color: var(--ds-muted);'>T&nbsp;</span><a href="tel:+15550142318" style='color: var(--ds-text); text-decoration: none;'>+1 555 014 2318</a><br>
                            <span style='color: var(--ds-muted);'>E&nbsp;</span><a href="mailto:alex@example.com" style='color: var(--ds-text); text-decoration: none;'>alex@example.com</a>
                          </td></tr>
                          <tr><td style='padding-top: 10px; font-family: var(--ds-font-sans); font-size: var(--ds-text-sm); line-height: 20px;'>
                            <a href="#" style='color: var(--ds-ink); font-weight: 700; text-decoration: underline;'>northlight.example.com</a>
                            <span style='color: var(--ds-muted);'>&nbsp;&nbsp;|&nbsp;&nbsp;</span>
                            <a href="#" style='color: var(--ds-ink); font-weight: 700; text-decoration: underline;'>Book a call</a>
                            <span style='color: var(--ds-muted);'>&nbsp;&nbsp;|&nbsp;&nbsp;</span>
                            <a href="#" style='color: var(--ds-ink); font-weight: 700; text-decoration: underline;'>LinkedIn</a>
                          </td></tr>
                        </table>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
